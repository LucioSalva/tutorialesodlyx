<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Cómo resuelve ARP una dirección MAC</title><desc id="d">La pregunta ARP va a la dirección de difusión y la oye toda la red; solo el dueño de la IP responde, y lo hace en unicast.</desc><rect width="880" height="330" fill="#0B1017"/><text x="150" y="40" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >TU EQUIPO</text><line x1="150" y1="54" x2="150" y2="250" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><text x="400" y="40" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >VECINO</text><line x1="400" y1="54" x2="400" y2="250" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><text x="650" y="40" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >GATEWAY</text><line x1="650" y1="54" x2="650" y2="250" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><text x="830" y="40" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >OTRO</text><line x1="830" y1="54" x2="830" y2="250" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><text x="30" y="86" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >1</text><line x1="162" y1="96" x2="388" y2="96" stroke="#FBBF24" stroke-width="1.6"/><path d="M388.0,96.0 L381.9,99.4 L381.9,92.6 Z" fill="#FBBF24"/><line x1="162" y1="96" x2="638" y2="96" stroke="#FBBF24" stroke-width="1.6"/><path d="M638.0,96.0 L631.9,99.4 L631.9,92.6 Z" fill="#FBBF24"/><line x1="162" y1="96" x2="818" y2="96" stroke="#FBBF24" stroke-width="1.6"/><path d="M818.0,96.0 L811.9,99.4 L811.9,92.6 Z" fill="#FBBF24"/><rect x="200" y="62" width="320" height="22" rx="3" fill="#0B1017" /><text x="360" y="78" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >Who has 192.168.1.1? Tell 192.168.1.50</text><text x="30" y="116" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Destino Ethernet: ff:ff:ff:ff:ff:ff — difusión. Lo recibe toda la red local.</text><text x="30" y="186" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >2</text><line x1="638" y1="196" x2="162" y2="196" stroke="#19E6A4" stroke-width="1.8"/><path d="M162.0,196.0 L168.1,192.6 L168.1,199.4 Z" fill="#19E6A4"/><rect x="250" y="162" width="300" height="22" rx="3" fill="#0B1017" /><text x="400" y="178" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >192.168.1.1 is at 3c:84:6a:11:22:33</text><text x="30" y="222" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Destino Ethernet: la MAC de quien preguntó — unicast. Solo lo recibe tu equipo.</text><rect x="30" y="262" width="820" height="48" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="46" y="282" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Por qué esto importa para la seguridad</text><text x="46" y="300" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Nada en ARP comprueba quién responde. Dos respuestas distintas para la misma IP son un hecho observable que merece investigarse.</text><text x="30" y="326" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Ejemplo ilustrativo · direcciones de documentación</text></svg>
