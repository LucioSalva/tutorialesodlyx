<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="t d"><title id="t">La idea de un túnel SSH</title><desc id="d">Una conexión SSH ya establecida y cifrada entre tu equipo y el servidor transporta dentro otra conexión, por ejemplo HTTP hacia un panel interno, que sin el túnel no sería accesible.</desc><rect width="880" height="270" fill="#0B1017"/><rect x="24.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="114.0" y="98.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">TU EQUIPO</text><text x="114.0" y="118.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">cliente ssh</text><rect x="500.0" y="70.0" width="170.0" height="100.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="585.0" y="98.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">SERVIDOR SSH</text><text x="585.0" y="118.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="716.0" y="70.0" width="140.0" height="100.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1.5"/><text x="786.0" y="98.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">SERVICIO</text><text x="786.0" y="118.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">127.0.0.1:8000</text><rect x="214.0" y="92.0" width="276.0" height="56.0" rx="28" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><text x="352.0" y="86.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="middle" xml:space="preserve">conexión SSH cifrada (puerto 22)</text><line x1="236.0" y1="120.0" x2="470.0" y2="120.0" stroke="#FBBF24" stroke-width="2.2"/><path d="M470.0,120.0 L462.8,123.5 L462.8,116.5 Z" fill="#FBBF24"/><text x="352.0" y="140.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">HTTP viaja DENTRO</text><line x1="672.0" y1="120.0" x2="712.0" y2="120.0" stroke="#FBBF24" stroke-width="2"/><path d="M712.0,120.0 L704.8,123.5 L704.8,116.5 Z" fill="#FBBF24"/><rect x="24.0" y="196.0" width="832.0" height="56.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="220.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Un túnel no da acceso a nada que el servidor SSH no pueda alcanzar ya, ni salta la autorización: reutiliza una conexión</text><text x="44.0" y="238.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">que ya tienes permitida para llegar a un servicio concreto.</text></svg>
