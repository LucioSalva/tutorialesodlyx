<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d"><title id="t">La llave privada se queda, la pública viaja</title><desc id="d">En tu equipo, el fichero id_ed25519 es la llave privada y no sale nunca; id_ed25519.pub es la pública y se copia al fichero authorized_keys del servidor. Una flecha tachada impide que la privada viaje.</desc><rect width="880" height="380" fill="#0B1017"/><rect x="24.0" y="20.0" width="380.0" height="240.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="380.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">TU EQUIPO · ~/.ssh/</text><rect x="44.0" y="70.0" width="340.0" height="70.0" rx="6" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-width="1"/><text x="62.0" y="100.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">id_ed25519</text><text x="62.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">PRIVADA · nunca sale de aquí</text><rect x="44.0" y="160.0" width="340.0" height="70.0" rx="6" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><text x="62.0" y="190.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">id_ed25519.pub</text><text x="62.0" y="214.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">PÚBLICA · se puede copiar</text><rect x="476.0" y="20.0" width="380.0" height="240.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="476.0" y="20.0" width="380.0" height="3" rx="1.5" fill="#19E6A4"/><text x="494.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">EL SERVIDOR · ~/.ssh/</text><rect x="496.0" y="160.0" width="340.0" height="70.0" rx="6" fill="#0E141C" stroke="#19E6A4" stroke-width="1"/><text x="514.0" y="190.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">authorized_keys</text><text x="514.0" y="214.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">una línea por llave pública autorizada</text><line x1="386.0" y1="105.0" x2="490.0" y2="105.0" stroke="#F87171" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="438" cy="105" r="13" fill="#0B1017" stroke="#F87171" stroke-width="2"/><path d="M431,98 L445,112 M445,98 L431,112" fill="none" stroke="#F87171" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="386.0" y1="195.0" x2="492.0" y2="195.0" stroke="#19E6A4" stroke-width="2"/><path d="M492.0,195.0 L484.8,198.5 L484.8,191.5 Z" fill="#19E6A4"/><text x="439.0" y="183.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh-copy-id</text><rect x="24.0" y="278.0" width="832.0" height="84.0" rx="6" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-width="1"/><text x="44.0" y="302.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">La regla sin excepciones</text><text x="44.0" y="324.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Si alguien te pide id_ed25519 (sin .pub) —un proveedor, un compañero, un formulario—, algo va mal. Lo que se</text><text x="44.0" y="343.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">comparte termina en .pub.</text></svg>
