<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d"><title id="t">El ciclo de known_hosts</title><desc id="d">Primera conexión: el servidor presenta su clave, SSH muestra la huella, aceptas y se guarda una línea en known_hosts. Conexiones siguientes: SSH compara en silencio; si coincide entra, si no coincide se detiene con un aviso.</desc><rect width="880" height="350" fill="#0B1017"/><rect x="24.0" y="24.0" width="190.0" height="76.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="38.0" y="54.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">1 · Primera vez</text><text x="38.0" y="78.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">SSH no conoce la clave</text><line x1="216.0" y1="62.0" x2="234.0" y2="62.0" stroke="#8FA0AE" stroke-width="1.4"/><path d="M234.0,62.0 L228.6,64.6 L228.6,59.4 Z" fill="#8FA0AE"/><rect x="236.0" y="24.0" width="190.0" height="76.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="250.0" y="54.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">2 · Ves la huella</text><text x="250.0" y="78.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">SHA256:f/kLSUc2…</text><line x1="428.0" y1="62.0" x2="446.0" y2="62.0" stroke="#8FA0AE" stroke-width="1.4"/><path d="M446.0,62.0 L440.6,64.6 L440.6,59.4 Z" fill="#8FA0AE"/><rect x="448.0" y="24.0" width="190.0" height="76.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1"/><text x="462.0" y="54.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">3 · Aceptas</text><text x="462.0" y="78.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">yes o la huella</text><line x1="640.0" y1="62.0" x2="658.0" y2="62.0" stroke="#8FA0AE" stroke-width="1.4"/><path d="M658.0,62.0 L652.6,64.6 L652.6,59.4 Z" fill="#8FA0AE"/><rect x="660.0" y="24.0" width="190.0" height="76.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1"/><text x="674.0" y="54.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">4 · Se guarda</text><text x="674.0" y="78.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">una línea en known_hosts</text><rect x="24.0" y="124.0" width="832.0" height="44.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="40.0" y="151.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">~/.ssh/known_hosts  </tspan><tspan fill="#C2CCD6" font-weight="400">servidor ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDUpckdO…</tspan></text><line x1="440.0" y1="170.0" x2="440.0" y2="196.0" stroke="#8FA0AE" stroke-width="1.4"/><path d="M440.0,196.0 L436.5,188.8 L443.5,188.8 Z" fill="#8FA0AE"/><rect x="24.0" y="200.0" width="832.0" height="130.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="200.0" width="832.0" height="3" rx="1.5" fill="#E3EBF1"/><text x="42.0" y="230.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">5 · A PARTIR DE LA SEGUNDA CONEXIÓN</text><text x="42.0" y="250.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">SSH compara la clave recibida con la guardada, sin preguntar</text><rect x="44.0" y="262.0" width="380.0" height="52.0" rx="6" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><text x="60.0" y="284.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Coincide</text><text x="60.0" y="304.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">sin mensajes: el silencio ES la comprobación</text><rect x="456.0" y="262.0" width="380.0" height="52.0" rx="6" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-width="1"/><text x="472.0" y="284.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">No coincide</text><text x="472.0" y="304.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">REMOTE HOST IDENTIFICATION HAS CHANGED</text></svg>
