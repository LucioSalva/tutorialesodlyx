<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 527" width="880" height="527" role="img" aria-labelledby="t d"><title id="t">Too many authentication failures</title><desc id="d">Salida real: con siete llaves cargadas en el agente, la conexión como deploy termina en Too many authentication failures; el ssh -v filtrado muestra una llave ofrecida tras otra hasta el corte; con IdentitiesOnly y la llave concreta entra a la primera.</desc><rect width="880" height="527" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="511.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">for i in 1 2 3 4 5 6; do ssh-keygen -q -t ed25519 -N &#x27;&#x27; -C extra$i -f ~/.ssh/extra$i; done</tspan></text><text x="24.0" y="75.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">for i in 1 2 3 4 5 6; do ssh-add -q ~/.ssh/extra$i; done</tspan></text><text x="24.0" y="92.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-add ~/.ssh/llave_deploy</tspan></text><text x="24.0" y="109.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Identity added: /home/alumno/.ssh/llave_deploy (deploy@laptop)</tspan></text><rect x="14.0" y="114.0" width="852.0" height="17.0" rx="3" fill="#A78BFA" fill-opacity="0.1"/><rect x="14" y="114.0" width="3" height="17" fill="#A78BFA"/><circle cx="850.0" cy="121.5" r="10" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="850.0" y="125.7" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="126.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-add -l</tspan></text><text x="24.0" y="143.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqjHI alumno@laptop (ED25519)</tspan></text><text x="24.0" y="160.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:bRpBcn1V3jplQQstzyn4hSe38jamZysiXfhWoiAmwUE extra1 (ED25519)</tspan></text><text x="24.0" y="177.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:pVXRnr/m1boTNrPEva43wJ3vbGLNQr1loUQMpN5cchU extra2 (ED25519)</tspan></text><text x="24.0" y="194.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:ARWteJr7lLDF4XDT9fBQbusiOPRtH7NDm9qpUo5xAuw extra3 (ED25519)</tspan></text><text x="24.0" y="211.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:2EFQNaqaS/u5KBA7b05B0iwDIPg7DgwOxq4HkVqB+HE extra4 (ED25519)</tspan></text><text x="24.0" y="228.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:GtL1zZzXQgGQYl2hNBcLQUHhCsqA8YuvsNOvaxLSnG8 extra5 (ED25519)</tspan></text><text x="24.0" y="245.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:Itn9MBsFwApuP2akWdic9XfKD4DGKEqhVwUKbuBgEZ8 extra6 (ED25519)</tspan></text><text x="24.0" y="262.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:4YQs9kSqiSkTdYFeKAJJPY2PKm2Jq0M8jDXDlMfxPv4 deploy@laptop (ED25519)</tspan></text><text x="24.0" y="279.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh deploy@servidor hostname</tspan></text><rect x="14.0" y="284.0" width="852.0" height="17.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="284.0" width="3" height="17" fill="#F87171"/><circle cx="850.0" cy="291.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="295.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" fo