<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Refused frente a timed out</title><desc id="d">Con Connection refused el paquete llega a la máquina y esta responde que no hay nadie en ese puerto, en milisegundos. Con Connection timed out no llega ninguna respuesta y el cliente se cansa de esperar.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#FBBF24"/><text x="42.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">CONNECTION REFUSED</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">respuesta inmediata</text><rect x="42.0" y="80.0" width="90.0" height="40.0" rx="6" fill="#0E141C" stroke="#38BDF8" stroke-width="1"/><text x="87.0" y="105.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">cliente</text><rect x="316.0" y="80.0" width="90.0" height="40.0" rx="6" fill="#0E141C" stroke="#19E6A4" stroke-width="1"/><text x="361.0" y="105.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">servidor</text><line x1="134.0" y1="92.0" x2="312.0" y2="92.0" stroke="#38BDF8" stroke-width="1.6"/><path d="M312.0,92.0 L304.8,95.5 L304.8,88.5 Z" fill="#38BDF8"/><text x="224.0" y="84.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">SYN →</text><line x1="312.0" y1="112.0" x2="134.0" y2="112.0" stroke="#FBBF24" stroke-width="1.6"/><path d="M134.0,112.0 L141.2,108.5 L141.2,115.5 Z" fill="#FBBF24"/><text x="224.0" y="140.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">RST: «aquí no escucha nadie»</text><text x="42.0" y="180.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">La máquina existe y contesta. Nadie escucha en ese</text><text x="42.0" y="199.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">puerto, o un firewall RECHAZA de forma activa.</text><text x="42.0" y="290.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">tarda: milisegundos</text><rect x="456.0" y="20.0" width="400.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#A78BFA"/><text x="474.0" y="50.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">CONNECTION TIMED OUT</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">silencio hasta rendirse</text><rect x="474.0" y="80.0" width="90.0" height="40.0" rx="6" fill="#0E141C" stroke="#38BDF8" stroke-width="1"/><text x="519.0" y="105.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">cliente</text><rect x="748.0" y="80.0" width="90.0" height="40.0" rx="6" fill="#0E141C" stroke="#19E6A4" stroke-width="1"/><text x="793.0" y="105.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">servidor</text><line x1="566.0" y1="92.0" x2="744.0" y2="92.0" stroke="#38BDF8" stroke-width="1.6"/><path d="M744.0,92.0 L736.8,95.5 L736.8,88.5 Z" fill="#38BDF8"/><text x="656.0" y="84.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">SYN →</text><path d="M744,112 L566,112" fill="none" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="656.0" y="140.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">… (nada)</text><text x="474.0" y="180.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Algo descarta los paquetes en silencio (firewall con</text><text x="474.0" y="199.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">DROP), la IP no existe o no hay ruta.</text><text x="474.0" y="290.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">tarda: segundos o minutos</text></svg>
