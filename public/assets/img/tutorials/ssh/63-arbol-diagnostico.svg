<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" role="img" aria-labelledby="t d"><title id="t">Árbol de diagnóstico SSH</title><desc id="d">Cinco preguntas en orden: si se resuelve el nombre, si hay ruta, si contesta alguien en el puerto, si el servidor es el conocido y si te acepta. Para cada una, el error que indica que la respuesta es no y dónde buscar. Al final, sesión establecida.</desc><rect width="880" height="550" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="72.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="20" width="4" height="72" fill="#38BDF8"/><text x="44.0" y="48.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">¿Se resuelve el nombre?</text><text x="836.0" y="48.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end" xml:space="preserve">SÍ ↓</text><text x="44.0" y="74.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="700">NO → </tspan><tspan fill="#38BDF8" font-weight="700">Could not resolve hostname</tspan></text><text x="836.0" y="74.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">DNS · /etc/hosts · errata en el nombre</text><line x1="440.0" y1="94.0" x2="440.0" y2="110.0" stroke="#34465A" stroke-width="1.4"/><path d="M440.0,110.0 L437.8,105.5 L442.2,105.5 Z" fill="#34465A"/><rect x="24.0" y="112.0" width="832.0" height="72.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="112" width="4" height="72" fill="#38BDF8"/><text x="44.0" y="140.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">¿Hay ruta hasta la máquina?</text><text x="836.0" y="140.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end" xml:space="preserve">SÍ ↓</text><text x="44.0" y="166.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="700">NO → </tspan><tspan fill="#38BDF8" font-weight="700">No route to host · Network is unreachable</tspan></text><text x="836.0" y="166.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">red · VPN · IP equivocada</text><line x1="440.0" y1="186.0" x2="440.0" y2="202.0" stroke="#34465A" stroke-width="1.4"/><path d="M440.0,202.0 L437.8,197.5 L442.2,197.5 Z" fill="#34465A"/><rect x="24.0" y="204.0" width="832.0" height="72.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="204" width="4" height="72" fill="#A78BFA"/><text x="44.0" y="232.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">¿Contesta alguien en el puerto?</text><text x="836.0" y="232.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end" xml:space="preserve">SÍ ↓</text><text x="44.0" y="258.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="700">NO → </tspan><tspan fill="#A78BFA" font-weight="700">Connection refused · Connection timed out</tspan></text><text x="836.0" y="258.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">sshd parado · puerto · firewall</text><line x1="440.0" y1="278.0" x2="440.0" y2="294.0" stroke="#34465A" stroke-width="1.4"/><path d="M440.0,294.0 L437.8,289.5 L442.2,289.5 Z" fill="#34465A"/><rect x="24.0" y="296.0" width="832.0" height="72.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="296" width="4" height="72" fill="#FBBF24"/><text x="44.0" y="324.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">¿Es el servidor que conozco?</text><text x="836.0" y="324.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end" xml:space="preserve">SÍ ↓</text><text x="44.0" y="350.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="700">NO → </tspan><tspan fill="#FBBF24" font-weight="700">HOST IDENTIFICATION HAS CHANGED</tspan></text><text x="836.0" y="350.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">¿reinstalación o suplantación? verificar</text><line x1="440.0" y1="370.0" x2="440.0" y2="386.0" stroke="#34465A" stroke-width="1.4"/><path d="M440.0,386.0 L437.8,381.5 L442.2,381.5 Z" fill="#34465A"/><rect x="24.0" y="388.0" width="832.0" height="72.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="388" width="4" height="72" fill="#F87171"/><text x="44.0" y="416.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">¿Me acepta?</text><text x="836.0" y="416.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end" xml:space="preserve">SÍ ↓</text><text x="44.0" y="442.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="700">NO → </tspan><tspan fill="#F87171" font-weight="700">Permission denied · Too many authentication failures</tspan></text><text x="836.0" y="442.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">usuario · llave · authorized_keys · permisos</text><rect x="24.0" y="480.0" width="832.0" height="50.0" rx="6" fill="#19E6A4" fill-opacity="0.12" stroke="#19E6A4" stroke-width="1"/><text x="440.0" y="511.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle" xml:space="preserve">SESIÓN SSH ESTABLECIDA</text></svg>
