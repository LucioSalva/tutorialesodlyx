<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d"><title id="t">scp: la dirección la marca el orden</title><desc id="d">scp origen destino. Subir: el origen es local y el destino lleva servidor dos puntos ruta. Bajar: el origen lleva servidor dos puntos ruta y el destino es local, por ejemplo punto.</desc><rect width="880" height="350" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="144.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="20" width="4" height="144" fill="#19E6A4"/><text x="46.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SUBIR · local → servidor</text><rect x="46.0" y="64.0" width="460.0" height="36.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="62.0" y="88.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">$ scp informe.txt srv:/home/alumno/</text><text x="46.0" y="124.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">LAPTOP</text><text x="46.0" y="146.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">informe.txt</text><text x="836.0" y="124.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="end" xml:space="preserve">SERVIDOR</text><text x="836.0" y="146.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="end" xml:space="preserve">/home/alumno/informe.txt</text><line x1="270.0" y1="141.0" x2="560.0" y2="141.0" stroke="#19E6A4" stroke-width="2.4"/><path d="M560.0,141.0 L552.8,144.5 L552.8,137.5 Z" fill="#19E6A4"/><text x="415.0" y="130.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">cifrado por SSH</text><text x="836.0" y="50.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">el lado con «:» es el remoto</text><rect x="24.0" y="180.0" width="832.0" height="144.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="180" width="4" height="144" fill="#38BDF8"/><text x="46.0" y="210.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">BAJAR · servidor → local</text><rect x="46.0" y="224.0" width="460.0" height="36.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="62.0" y="248.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">$ scp srv:/home/alumno/logs/app.log .</text><text x="46.0" y="284.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">LAPTOP</text><text x="46.0" y="306.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">./app.log</text><text x="836.0" y="284.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="end" xml:space="preserve">SERVIDOR</text><text x="836.0" y="306.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="end" xml:space="preserve">/home/alumno/logs/app.log</text><line x1="560.0" y1="301.0" x2="270.0" y2="301.0" stroke="#38BDF8" stroke-width="2.4"/><path d="M270.0,301.0 L277.2,297.5 L277.2,304.5 Z" fill="#38BDF8"/><text x="415.0" y="290.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">cifrado por SSH</text><text x="836.0" y="210.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">el lado con «:» es el remoto</text><text x="24.0" y="340.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Para carpetas, -r. Puerto: -P mayúscula (en ssh es -p minúscula).</text></svg>
