<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d"><title id="t">Keepalive: tres mecanismos distintos</title><desc id="d">Tres tarjetas. ServerAliveInterval lo envía el cliente por dentro del canal cifrado. ClientAliveInterval lo envía el servidor por dentro del canal cifrado. TCPKeepAlive es del sistema operativo, fuera del cifrado y falsificable.</desc><rect width="880" height="360" fill="#0B1017"/><rect x="24.0" y="20.0" width="264.0" height="280.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="264.0" height="3" rx="1.5" fill="#19E6A4"/><text x="42.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ServerAliveInterval</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">cliente · ~/.ssh/config</text><text x="42.0" y="96.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">El cliente pregunta «¿sigues</text><text x="42.0" y="115.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">ahí?» por DENTRO del canal</text><text x="42.0" y="134.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">cifrado cada N segundos. Tras</text><text x="42.0" y="153.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">ServerAliveCountMax fallos,</text><text x="42.0" y="172.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">corta.</text><text x="42.0" y="207.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Evita sesiones colgadas en redes</text><text x="42.0" y="225.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">con NAT o wifi inestable.</text><rect x="308.0" y="20.0" width="264.0" height="280.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="308.0" y="20.0" width="264.0" height="3" rx="1.5" fill="#38BDF8"/><text x="326.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ClientAliveInterval</text><text x="326.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">servidor · sshd_config</text><text x="326.0" y="96.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Lo mismo en sentido contrario:</text><text x="326.0" y="115.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">el servidor pregunta al cliente.</text><text x="326.0" y="134.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Tras ClientAliveCountMax fallos,</text><text x="326.0" y="153.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">cierra la sesión.</text><text x="326.0" y="188.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Limpia sesiones de clientes que</text><text x="326.0" y="206.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">desaparecieron.</text><rect x="592.0" y="20.0" width="264.0" height="280.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="592.0" y="20.0" width="264.0" height="3" rx="1.5" fill="#FBBF24"/><text x="610.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">TCPKeepAlive</text><text x="610.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">ambos lados · capa TCP</text><text x="610.0" y="96.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Mensajes del sistema operativo,</text><text x="610.0" y="115.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">FUERA del cifrado. Se pueden</text><text x="610.0" y="134.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">falsificar y un corte breve de</text><text x="610.0" y="153.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">ruta mata la sesión.</text><text x="610.0" y="188.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Activo por defecto; no sustituye a</text><text x="610.0" y="206.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">los anteriores.</text><rect x="24.0" y="312.0" width="832.0" height="36.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="336.0" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">Ejemplo cliente:  </tspan><tspan fill="#19E6A4" font-weight="700">ServerAliveInterval 60</tspan><tspan fill="#8FA0AE" font-weight="400">  +  </tspan><tspan fill="#19E6A4" font-weight="700">ServerAliveCountMax 3</tspan><tspan fill="#C2CCD6" font-weight="400">  → corta tras ~3 min sin respuesta</tspan></text></svg>
