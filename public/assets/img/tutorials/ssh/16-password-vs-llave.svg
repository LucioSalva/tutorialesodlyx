<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" width="880" height="416" role="img" aria-labelledby="t d"><title id="t">Contraseña frente a llave SSH</title><desc id="d">Tabla comparativa entre autenticación por contraseña y por llave SSH en seis aspectos: si viaja el secreto, fuerza bruta, servidor suplantado, automatización, revocación y robo del fichero.</desc><rect width="880" height="416" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="44.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="48.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">ASPECTO</text><text x="300.0" y="48.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">CONTRASEÑA</text><text x="578.0" y="48.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">LLAVE SSH</text><rect x="24.0" y="64.0" width="832.0" height="46.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="92.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">¿Viaja el secreto?</text><text x="300.0" y="92.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Sí, cifrado dentro del túnel</text><text x="578.0" y="92.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">No: se firma un reto con la privada</text><rect x="24.0" y="110.0" width="832.0" height="46.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="138.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Adivinable por fuerza bruta</text><text x="300.0" y="138.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Sí, si es débil o repetida</text><text x="578.0" y="138.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">No en la práctica (Ed25519)</text><rect x="24.0" y="156.0" width="832.0" height="46.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="184.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Si el servidor está suplantado</text><text x="300.0" y="184.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Se la entregas al impostor</text><text x="578.0" y="184.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Solo obtiene una firma inservible</text><rect x="24.0" y="202.0" width="832.0" height="46.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="230.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Automatización</text><text x="300.0" y="230.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Obliga a guardarla en claro</text><text x="578.0" y="230.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Llave dedicada, sin secretos en scripts</text><rect x="24.0" y="248.0" width="832.0" height="46.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="276.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Revocar el acceso</text><text x="300.0" y="276.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Cambiar la contraseña</text><text x="578.0" y="276.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Borrar una línea de authorized_keys</text><rect x="24.0" y="294.0" width="832.0" height="46.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="322.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Si te roban el fichero</text><text x="300.0" y="322.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">—</text><text x="578.0" y="322.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Protegida si tiene passphrase</text><rect x="24.0" y="356.0" width="832.0" height="50.0" rx="6" fill="#19E6A4" fill-opacity="0.08" stroke="#19E6A4" stroke-width="1"/><text x="44.0" y="378.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Recomendación: llaves para el acceso habitual. La contraseña del usuario sigue sirviendo para sudo y, si el</text><text x="44.0" y="397.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">proveedor lo permite, como vía de recuperación.</text></svg>
