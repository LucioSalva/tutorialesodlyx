<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 546" width="880" height="546" role="img" aria-labelledby="t d"><title id="t">Los siete pasos de una conexión SSH</title><desc id="d">Secuencia vertical de siete pasos, de resolver el nombre a entregar el shell; a la derecha, el mensaje de error que aparece si la conexión se detiene en cada paso.</desc><rect width="880" height="546" fill="#0B1017"/><text x="40.0" y="30.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">QUÉ OCURRE</text><text x="520.0" y="30.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">SI SE DETIENE AQUÍ, VERÁS</text><line x1="48.0" y1="92.0" x2="48.0" y2="108.0" stroke="#34465A" stroke-width="2"/><rect x="24.0" y="44.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="44" width="4" height="50" fill="#38BDF8"/><circle cx="50.0" cy="69.0" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="50.0" y="73.2" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="76.0" y="65.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Resolver el nombre</text><text x="76.0" y="84.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">servidor → 192.168.56.20 (DNS o /etc/hosts)</text><rect x="510.0" y="44.0" width="346.0" height="50.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="526.0" y="65.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Could not resolve hostname</text><line x1="48.0" y1="156.0" x2="48.0" y2="172.0" stroke="#34465A" stroke-width="2"/><rect x="24.0" y="108.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="108" width="4" height="50" fill="#38BDF8"/><circle cx="50.0" cy="133.0" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="50.0" y="137.2" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="76.0" y="129.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Abrir la conexión TCP</text><text x="76.0" y="148.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">al puerto 22 del servidor</text><rect x="510.0" y="108.0" width="346.0" height="50.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="526.0" y="129.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Connection refused · timed out · No route</text><text x="526.0" y="145.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">to host</text><line x1="48.0" y1="220.0" x2="48.0" y2="236.0" stroke="#34465A" stroke-width="2"/><rect x="24.0" y="172.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="172" width="4" height="50" fill="#A78BFA"/><circle cx="50.0" cy="197.0" r="11" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="50.0" y="201.2" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="76.0" y="193.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Negociar SSH</text><text x="76.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">versión, algoritmos y claves de sesión</text><rect x="510.0" y="172.0" width="346.0" height="50.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="526.0" y="193.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">raro: incompatibilidad de algoritmos</text><line x1="48.0" y1="284.0" x2="48.0" y2="300.0" stroke="#34465A" stroke-width="2"/><rect x="24.0" y="236.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="236" width="4" height="50" fill="#FBBF24"/><circle cx="50.0" cy="261.0" r="11" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="50.0" y="265.2" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="76.0" y="257.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Verificar al servidor</text><text x="76.0" y="276.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">su host key contra tu known_hosts</text><rect x="510.0" y="236.0" width="346.0" height="50.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="526.0" y="257.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">huella nueva · HOST IDENTIFICATION HAS</text><text x="526.0" y="273.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">CHANGED</text><line x1="48.0" y1="348.0" x2="48.0" y2="364.0" stroke="#34465A" stroke-width="2"/><rect x="24.0" y="300.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="300" width="4" height="50" fill="#F87171"/><circle cx="50.0" cy="325.0" r="11" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="50.0" y="329.2" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="76.0" y="321.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Autenticarte a ti</text><text x="76.0" y="340.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">llave o contraseña</text><rect x="510.0" y="300.0" width="346.0" height="50.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="526.0" y="321.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Permission denied (publickey)</text><line x1="48.0" y1="412.0" x2="48.0" y2="428.0" stroke="#34465A" stroke-width="2"/><rect x="24.0" y="364.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="364" width="4" height="50" fill="#19E6A4"/><circle cx="50.0" cy="389.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="50.0" y="393.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><text x="76.0" y="385.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Abrir el canal</text><text x="76.0" y="404.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">sesión cifrada establecida</text><rect x="510.0" y="364.0" width="346.0" height="50.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="526.0" y="385.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">—</text><rect x="24.0" y="428.0" width="470.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="428" width="4" height="50" fill="#19E6A4"/><circle cx="50.0" cy="453.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="50.0" y="457.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">7</text><text x="76.0" y="449.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Entregar el shell</text><text x="76.0" y="468.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">tu prompt en el servidor</text><rect x="510.0" y="428.0" width="346.0" height="50.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="526.0" y="449.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">—</text><text x="24.0" y="512.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" xml:space="preserve">El mensaje de error dice en qué paso se detuvo la conexión. Eso descarta de golpe todos los pasos</text><text x="24.0" y="532.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" xml:space="preserve">anteriores.</text></svg>
