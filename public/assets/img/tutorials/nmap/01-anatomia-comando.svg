<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Anatomía de un comando de Nmap</title><desc id="d">El comando nmap -sV -p 8090 127.0.0.1 dividido en sus cuatro piezas: programa, tipo de escaneo, puertos y objetivo.</desc><rect width="880" height="300" fill="#0B1017"/><rect x="30" y="24" width="820" height="56" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><text x="44" y="60" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >$</text><text x="56" y="60" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >nmap</text><text x="136" y="60" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >-sV</text><text x="212" y="60" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >-p 8090</text><text x="330" y="60" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >127.0.0.1</text><path d="M74.0,84 v20 h40" fill="none" stroke="#19E6A4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="126.0" cy="104" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="126.0" y="108" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >①</text><text x="144.0" y="108" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >el programa</text><text x="274.0" y="108" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Siempre igual. Todo lo demás son opciones suyas.</text><path d="M149.5,84 v64 h40" fill="none" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="201.5" cy="148" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.5"/><text x="201.5" y="152" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >②</text><text x="219.5" y="152" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >qué quiero averiguar</text><text x="349.5" y="152" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Detección de servicio y versión: en vez de suponer por el número de puerto, pregunta.</text><path d="M243.5,84 v108 h40" fill="none" stroke="#FBBF24" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="295.5" cy="192" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.5"/><text x="295.5" y="196" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >③</text><text x="313.5" y="196" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >dónde quiero mirar</text><text x="443.5" y="196" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Sin -p, Nmap prueba los 1 000 puertos más frecuentes, no los 65 535.</text><path d="M370.5,84 v152 h40" fill="none" stroke="#A78BFA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="422.5" cy="236" r="10" fill="#0B1017" stroke="#A78BFA" stroke-width="1.5"/><text x="422.5" y="240" fill="#A78BFA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >④</text><text x="440.5" y="240" fill="#A78BFA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >a quién se lo pregunto</text><text x="570.5" y="240" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Tu propio equipo. El tráfico no sale de la máquina.</text><text x="30" y="292" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Orden de lectura: qué programa · qué técnica · sobre qué puertos · contra qué objetivo.</text></svg>
