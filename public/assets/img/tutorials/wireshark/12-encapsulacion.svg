<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Una trama es una muñeca rusa</title><desc id="d">Cada capa envuelve a la siguiente: Ethernet contiene IPv4, que contiene TCP, que contiene los datos de HTTP.</desc><rect width="880" height="310" fill="#0B1017"/><rect x="30" y="30" width="820" height="210" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-width="1" /><text x="44" y="52" fill="#A78BFA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >Ethernet II · 14 bytes</text><rect x="60" y="56" width="760" height="160" rx="5" fill="#38BDF8" fill-opacity="0.07" stroke="#38BDF8" stroke-width="1" /><text x="74" y="78" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >IPv4 · 20 bytes</text><rect x="90" y="82" width="700" height="110" rx="5" fill="#19E6A4" fill-opacity="0.07" stroke="#19E6A4" stroke-width="1" /><text x="104" y="104" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >TCP · 32 bytes</text><rect x="120" y="108" width="640" height="60" rx="5" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-width="1" /><text x="134" y="130" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >HTTP · 78 bytes · GET / HTTP/1.1</text><text x="440" y="266" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve" >144 bytes en total — exactamente lo que dice la columna Length del Packet List</text><text x="440" y="286" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve" >Wireshark deshace las capas en ese mismo orden, de fuera hacia dentro.</text><text x="440" y="304" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" xml:space="preserve" >Captura real de laboratorio · trama 10</text></svg>
