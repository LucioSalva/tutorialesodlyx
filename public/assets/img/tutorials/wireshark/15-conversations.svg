font-weight="700" text-anchor="start" xml:space="preserve" >Dónde mirar: las dos últimas columnas.</text><text x="30" y="190" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >La asimetría cuenta la historia. 351 bytes de subida contra 2 940 de bajada es una descarga normal.</text><text x="30" y="210" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >La proporción inversa y sostenida — mucho de subida, poco de bajada — es lo que hace mirar dos veces.</text><text x="30" y="232" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Eso es un indicio, no una conclusión: una copia de seguridad legítima produce exactamente el mismo perfil.</text><text x="30" y="290" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Captura real de laboratorio</text></svg>
