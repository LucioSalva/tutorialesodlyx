<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Un servidor, muchos puertos</title><desc id="d">Un servidor con una única dirección IP y varios servicios, cada uno en su puerto: 22 SSH resaltado, 80 HTTP, 443 HTTPS, 3306 MySQL y 25 SMTP.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="420.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="420.0" height="3" rx="1.5" fill="#E3EBF1"/><text x="42.0" y="50.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SERVIDOR · 192.168.56.20</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">una dirección, muchas puertas</text><rect x="38.0" y="74.0" width="392.0" height="38.0" rx="6" fill="#19E6A4" fill-opacity="0.12" stroke="#19E6A4" stroke-width="1"/><text x="56.0" y="98.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">22/tcp</text><text x="160.0" y="98.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="start" xml:space="preserve">SSH</text><text x="250.0" y="98.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">administración remota</text><text x="56.0" y="142.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">80/tcp</text><text x="160.0" y="142.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="start" xml:space="preserve">HTTP</text><text x="250.0" y="142.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">web sin cifrar</text><text x="56.0" y="186.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">443/tcp</text><text x="160.0" y="186.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="start" xml:space="preserve">HTTPS</text><text x="250.0" y="186.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">web cifrada</text><text x="56.0" y="230.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">3306/tcp</text><text x="160.0" y="230.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="start" xml:space="preserve">MySQL</text><text x="250.0" y="230.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">base de datos</text><text x="56.0" y="274.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">25/tcp</text><text x="160.0" y="274.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="start" xml:space="preserve">SMTP</text><text x="250.0" y="274.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">correo</text><rect x="470.0" y="20.0" width="386.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="470.0" y="20.0" width="386.0" height="3" rx="1.5" fill="#FBBF24"/><text x="488.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">EL 22 ES UN CONVENIO</text><text x="488.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">no una obligación</text><text x="490.0" y="96.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Un servidor puede escuchar SSH en otro puerto.</text><text x="490.0" y="115.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Entonces se lo dices al cliente:</text><rect x="490.0" y="136.0" width="346.0" height="36.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="506.0" y="160.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">ssh -p 2222 alumno@servidor</text><text x="490.0" y="204.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Cambiar el puerto reduce el ruido de los</text><text x="490.0" y="223.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">escaneos automáticos en los logs.</text><text x="490.0" y="254.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">No es un control de acceso: quien escanee</text><text x="490.0" y="273.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">ese equipo a conciencia lo encuentra en</text><text x="490.0" y="292.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">segundos.</text></svg>
