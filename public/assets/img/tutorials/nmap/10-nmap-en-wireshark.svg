pace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >TCP</text><text x="508" y="282" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >  ← 23  [RST, ACK]</text><rect x="500" y="232" width="200" height="20" rx="3" fill="none" stroke="#19E6A4" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="716" cy="242" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="716" y="246" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >!</text><text x="734" y="246" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >el único abierto</text><text x="30" y="330" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Las tres señales de un escaneo, y ninguna vale por sí sola:</text><text x="30" y="350" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >un mismo origen · muchos destinos o puertos consecutivos · en muy poco tiempo · con mayoría de RST.</text><text x="30" y="370" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Un navegador abriendo veinte conexiones a un CDN produce algo parecido. El contraste con la línea base es lo que decide.</text></svg>
