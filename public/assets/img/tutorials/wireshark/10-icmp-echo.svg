<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Un ping visto en Wireshark</title><desc id="d">El equipo envía un Echo request y el destino contesta con un Echo reply que lleva el mismo identificador y número de secuencia.</desc><rect width="880" height="300" fill="#0B1017"/><text x="190" y="40" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >TU EQUIPO</text><text x="690" y="40" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >DESTINO</text><line x1="190" y1="56" x2="190" y2="222" stroke="#34465A" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="690" y1="56" x2="690" y2="222" stroke="#34465A" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="204" y1="96" x2="676" y2="96" stroke="#19E6A4" stroke-width="1.8"/><path d="M676.0,96.0 L669.9,99.4 L669.9,92.6 Z" fill="#19E6A4"/><rect x="340" y="70" width="200" height="20" rx="3" fill="#0B1017" /><text x="440" y="85" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >Echo (ping) request  seq=1/256</text><line x1="676" y1="118" x2="204" y2="118" stroke="#FBBF24" stroke-width="1.8"/><path d="M204.0,118.0 L210.1,114.6 L210.1,121.4 Z" fill="#FBBF24"/><rect x="348" y="122" width="184" height="20" rx="3" fill="#0B1017" /><text x="440" y="137" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >Echo (ping) reply  seq=1/256</text><line x1="204" y1="150" x2="676" y2="150" stroke="#19E6A4" stroke-width="1.8"/><path d="M676.0,150.0 L669.9,153.4 L669.9,146.6 Z" fill="#19E6A4"/><rect x="340" y="124" width="200" heigh