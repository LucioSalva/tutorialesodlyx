<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d"><title id="t">Rutas absolutas y relativas</title><desc id="d">Árbol del directorio /home/alumno con public_html, assets, backups y logs. A la derecha, la misma carpeta assets alcanzada con una ruta absoluta y con rutas relativas desde distintos puntos.</desc><rect width="880" height="380" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="340.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#E3EBF1"/><text x="42.0" y="50.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">EL ÁRBOL DEL SERVIDOR</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">salida de tree en el laboratorio</text><text x="48.0" y="98.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">/home/alumno/</text><text x="48.0" y="126.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">├── backups/</text><text x="48.0" y="154.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">├── logs/</text><text x="48.0" y="182.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="400" text-anchor="start" xml:space="preserve">│   └── app.log</text><text x="48.0" y="210.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">└── public_html/</text><text x="48.0" y="238.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">    ├── assets/</text><text x="48.0" y="266.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="400" text-anchor="start" xml:space="preserve">    │   └── app.css</text><text x="48.0" y="294.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="400" text-anchor="start" xml:space="preserve">    └── index.php</text><text x="48.0" y="336.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Estás aquí →  ~/public_html</text><rect x="446.0" y="20.0" width="410.0" height="340.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="446.0" y="20.0" width="410.0" height="3" rx="1.5" fill="#FBBF24"/><text x="464.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">CÓMO LLEGAR A assets/</text><text x="464.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">tres formas, el mismo sitio</text><text x="466.0" y="102.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">ABSOLUTA · empieza por /</text><rect x="466.0" y="112.0" width="370.0" height="34.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="480.0" y="134.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">/home/alumno/public_html/assets</text><text x="466.0" y="166.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">funciona desde cualquier sitio</text><text x="466.0" y="188.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">RELATIVA · desde ~/public_html</text><rect x="466.0" y="198.0" width="370.0" height="34.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="480.0" y="220.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">./assets   o simplemente   assets</text><text x="466.0" y="252.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">. = el directorio actual</text><text x="466.0" y="274.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">RELATIVA · desde ~/logs</text><rect x="466.0" y="284.0" width="370.0" height="34.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="480.0" y="306.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">../public_html/assets</text><text x="466.0" y="338.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">.. = el directorio padre</text></svg>
