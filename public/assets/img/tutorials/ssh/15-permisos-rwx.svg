<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d"><title id="t">Cómo se leen los permisos Linux</title><desc id="d">La cadena -rw------- dividida en tipo de fichero, permisos del propietario, del grupo y de otros; debajo, r vale 4, w vale 2 y x vale 1, y cómo se suman para dar 600, 644 y 700.</desc><rect width="880" height="390" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="190.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="50.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">ls -l ~/.ssh/id_ed25519   →</text><text x="84.0" y="118.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="44" font-weight="700" text-anchor="middle" xml:space="preserve">-</text><line x1="84.0" y1="132.0" x2="84.0" y2="146.0" stroke="#8FA0AE" stroke-width="1.5"/><text x="84.0" y="166.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">tipo</text><text x="84.0" y="188.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">- = fichero</text><text x="250.0" y="118.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="44" font-weight="700" text-anchor="middle" xml:space="preserve">rw-</text><line x1="250.0" y1="132.0" x2="250.0" y2="146.0" stroke="#19E6A4" stroke-width="1.5"/><text x="250.0" y="166.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">propietario</text><text x="250.0" y="188.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">alumno: lee y escribe</text><text x="460.0" y="118.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="44" font-weight="700" text-anchor="middle" xml:space="preserve">---</text><line x1="460.0" y1="132.0" x2="460.0" y2="146.0" stroke="#FBBF24" stroke-width="1.5"/><text x="460.0" y="166.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">grupo</text><text x="460.0" y="188.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">nada</text><text x="670.0" y="118.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="44" font-weight="700" text-anchor="middle" xml:space="preserve">---</text><line x1="670.0" y1="132.0" x2="670.0" y2="146.0" stroke="#F87171" stroke-width="1.5"/><text x="670.0" y="166.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">otros</text><text x="670.0" y="188.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">nada</text><rect x="24.0" y="226.0" width="400.0" height="146.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="262.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">r</tspan><tspan fill="#8FA0AE" font-weight="400"> = </tspan><tspan fill="#FBBF24" font-weight="700">4</tspan><tspan fill="#C2CCD6" font-weight="400">   read · leer</tspan></text><text x="44.0" y="292.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">w</tspan><tspan fill="#8FA0AE" font-weight="400"> = </tspan><tspan fill="#FBBF24" font-weight="700">2</tspan><tspan fill="#C2CCD6" font-weight="400">   write · escribir</tspan></text><text x="44.0" y="322.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">x</tspan><tspan fill="#8FA0AE" font-weight="400"> = </tspan><tspan fill="#FBBF24" font-weight="700">1</tspan><tspan fill="#C2CCD6" font-weight="400">   execute · ejecutar / entrar</tspan></text><text x="44.0" y="356.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">En un directorio, x significa «poder entrar».</text><rect x="446.0" y="226.0" width="410.0" height="146.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="466.0" y="262.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">600</text><text x="516.0" y="262.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">rw- --- ---</text><text x="650.0" y="262.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">solo el dueño lee y escribe</text><text x="466.0" y="298.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">644</text><text x="516.0" y="298.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">rw- r-- r--</text><text x="650.0" y="298.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">el dueño escribe, todos leen</text><text x="466.0" y="334.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">700</text><text x="516.0" y="334.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">rwx --- ---</text><text x="650.0" y="334.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">solo el dueño entra (dir.)</text></svg>
