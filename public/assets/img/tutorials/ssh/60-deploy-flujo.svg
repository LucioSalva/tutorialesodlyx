<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d"><title id="t">Backup, despliegue y verificación</title><desc id="d">Cuatro pasos en línea: producción actual, backup con fecha, despliegue con rsync y verificación. Si la verificación falla, una flecha vuelve al backup para restaurar.</desc><rect width="880" height="250" fill="#0B1017"/><rect x="24.0" y="40.0" width="190.0" height="90.0" rx="6" fill="#111925" stroke="#E3EBF1" stroke-width="1"/><text x="119.0" y="78.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">PRODUCCIÓN</text><text x="119.0" y="102.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">lo que funciona hoy</text><line x1="216.0" y1="85.0" x2="236.0" y2="85.0" stroke="#8FA0AE" stroke-width="1.6"/><path d="M236.0,85.0 L230.6,87.6 L230.6,82.4 Z" fill="#8FA0AE"/><rect x="238.0" y="40.0" width="190.0" height="90.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="333.0" y="78.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">BACKUP</text><text x="333.0" y="102.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">tar con fecha en backups/</text><line x1="430.0" y1="85.0" x2="450.0" y2="85.0" stroke="#8FA0AE" stroke-width="1.6"/><path d="M450.0,85.0 L444.6,87.6 L444.6,82.4 Z" fill="#8FA0AE"/><rect x="452.0" y="40.0" width="190.0" height="90.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="547.0" y="78.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">DEPLOY</text><text x="547.0" y="102.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">rsync --dry-run → rsync</text><line x1="644.0" y1="85.0" x2="664.0" y2="85.0" stroke="#8FA0AE" stroke-width="1.6"/><path d="M664.0,85.0 L658.6,87.6 L658.6,82.4 Z" fill="#8FA0AE"/><rect x="666.0" y="40.0" width="190.0" height="90.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1"/><text x="761.0" y="78.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">VERIFICAR</text><text x="761.0" y="102.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve">¿responde? ¿está todo?</text><path d="M761,134 C761,190 333,190 333,134" fill="none" stroke="#F87171" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><line x1="333.0" y1="150.0" x2="333.0" y2="134.0" stroke="#F87171" stroke-width="1.6"/><path d="M333.0,134.0 L336.5,141.2 L329.5,141.2 Z" fill="#F87171"/><text x="547.0" y="196.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" xml:space="preserve">si falla: restaurar el backup</text><text x="24.0" y="230.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Sin backup, un despliegue fallido no tiene vuelta atrás. Sin verificación, no sabes que falló.</text></svg>
