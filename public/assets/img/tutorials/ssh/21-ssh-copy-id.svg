<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 353" width="880" height="353" role="img" aria-labelledby="t d"><title id="t">ssh-copy-id y la primera entrada con llave</title><desc id="d">Salida real de ssh-copy-id: identifica la llave pública, comprueba si ya estaba instalada, pide la contraseña una última vez y confirma que añadió una llave. Después, ssh ya no pide contraseña sino la passphrase de la llave.</desc><rect width="880" height="353" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="337.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-copy-id alumno@servidor</tspan></text><rect x="14.0" y="63.0" width="852.0" height="19.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="63.0" width="3" height="19" fill="#38BDF8"/><circle cx="850.0" cy="71.5" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="850.0" y="75.7" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">/usr/bin/ssh-copy-id: INFO: Source of key(s) to be installed: &quot;/home/alumno/.ssh/id_ed25519.pub&quot;</tspan></text><text x="24.0" y="96.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">/usr/bin/ssh-copy-id: INFO: attempting to log in with the new key(s), to filter out any that are already</tspan></text><text x="24.0" y="115.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  installed</tspan></text><text x="24.0" y="134.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">/usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you are prompted now it is to install</tspan></text><text x="24.0" y="153.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  the new keys</tspan></text><rect x="14.0" y="158.0" width="852.0" height="19.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="158.0" width="3" height="19" fill="#FBBF24"/><circle cx="850.0" cy="166.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="170.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">alumno@servidor&#x27;s password: </tspan></text><text x="24.0" y="191.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400"></tspan></text><rect x="14.0" y="196.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="196.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="204.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="208.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="210.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Number of key(s) added: 1</tspan></text><text x="24.0" y="229.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400"></tspan></text><text x="24.0" y="248.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Now try logging into the machine, with: &quot;ssh &#x27;alumno@servidor&#x27;&quot;</tspan></text><text x="24.0" y="267.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">and check to make sure that only the key(s) you wanted were added.</tspan></text><text x="24.0" y="286.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh alumno@servidor hostname</tspan></text><rect x="14.0" y="291.0" width="852.0" height="19.0" rx="3" fill="#A78BFA" fill-opacity="0.1"/><rect x="14" y="291.0" width="3" height="19" fill="#A78BFA"/><circle cx="850.0" cy="299.5" r="10" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="850.0" y="303.7" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="305.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Enter passphrase for key &#x27;/home/alumno/.ssh/id_ed25519&#x27;: </tspan></text><text x="24.0" y="324.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">servidor</tspan></text></svg>
