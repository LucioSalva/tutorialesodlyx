<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Dynamic forwarding: ssh -D</title><desc id="d">ssh -D 1080 bastion abre un proxy SOCKS en el puerto 1080 de tu equipo. Las aplicaciones configuradas para usarlo envían sus conexiones por SSH y el bastión las abre hacia el destino que pida cada una, dentro de la red interna.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="46.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="40.0" y="50.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">$ ssh -D 1080 bastion</text><rect x="24.0" y="96.0" width="210.0" height="110.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="129.0" y="124.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">TU EQUIPO</text><text x="129.0" y="144.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">proxy SOCKS en :1080</text><rect x="360.0" y="96.0" width="180.0" height="110.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="450.0" y="124.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">BASTIÓN</text><text x="450.0" y="144.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="240.0" y="130.0" width="114.0" height="40.0" rx="20" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><line x1="244.0" y1="150.0" x2="350.0" y2="150.0" stroke="#F472B6" stroke-width="2.2"/><path d="M350.0,150.0 L342.8,153.5 L342.8,146.5 Z" fill="#F472B6"/><rect x="640.0" y="80.0" width="216.0" height="42.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="656.0" y="98.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">wiki interna</text><text x="656.0" y="115.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">10.10.0.40:8000</text><line x1="544.0" y1="150.0" x2="636.0" y2="101.0" stroke="#F472B6" stroke-width="1.6"/><path d="M636.0,101.0 L631.3,107.5 L628.0,101.3 Z" fill="#F472B6"/><rect x="640.0" y="130.0" width="216.0" height="42.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="656.0" y="148.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">monitorización</text><text x="656.0" y="165.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">10.10.0.50:3000</text><line x1="544.0" y1="150.0" x2="636.0" y2="151.0" stroke="#F472B6" stroke-width="1.6"/><path d="M636.0,151.0 L628.8,154.4 L628.8,147.4 Z" fill="#F472B6"/><rect x="640.0" y="180.0" width="216.0" height="42.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="656.0" y="198.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">otro servicio</text><text x="656.0" y="215.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">destino que pida la app</text><line x1="544.0" y1="150.0" x2="636.0" y2="201.0" stroke="#F472B6" stroke-width="1.6"/><path d="M636.0,201.0 L628.0,200.6 L631.4,194.5 Z" fill="#F472B6"/><rect x="24.0" y="234.0" width="832.0" height="80.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="258.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">A diferencia de -L, no fijas un destino: cada aplicación decide a dónde va. Es una herramienta de administración para</text><text x="44.0" y="276.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">redes que ya estás autorizado a usar (por ejemplo, el panel de una red de gestión), no una forma de ocultar tráfico ni</text><text x="44.0" y="294.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">de saltarse políticas.</text></svg>
