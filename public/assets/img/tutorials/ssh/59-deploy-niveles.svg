<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" role="img" aria-labelledby="t d"><title id="t">Seis niveles de despliegue</title><desc id="d">Escalera de seis niveles: subir a mano, SFTP, SCP, rsync, Git sobre SSH y script de despliegue; con qué hace cada uno y su principal limitación o ventaja.</desc><rect width="880" height="448" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="48.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="20" width="4" height="48" fill="#F87171"/><circle cx="52.0" cy="44.0" r="11" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="52.0" y="48.2" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="78.0" y="50.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Subir a mano</text><text x="260.0" y="50.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">arrastrar en el gestor de archivos o FTP</text><text x="836.0" y="50.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">No sabes qué cambió ni cómo volver</text><rect x="24.0" y="78.0" width="832.0" height="48.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="78" width="4" height="48" fill="#FBBF24"/><circle cx="52.0" cy="102.0" r="11" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="52.0" y="106.2" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="78.0" y="108.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SFTP</text><text x="260.0" y="108.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">interactivo y cifrado</text><text x="836.0" y="108.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">Seguro, pero sigue siendo manual</text><rect x="24.0" y="136.0" width="832.0" height="48.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="136" width="4" height="48" fill="#FBBF24"/><circle cx="52.0" cy="160.0" r="11" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="52.0" y="164.2" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="78.0" y="166.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SCP</text><text x="260.0" y="166.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">un comando</text><text x="836.0" y="166.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">Repetible, pero copia todo siempre</text><rect x="24.0" y="194.0" width="832.0" height="48.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="194" width="4" height="48" fill="#19E6A4"/><circle cx="52.0" cy="218.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="52.0" y="222.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="78.0" y="224.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">rsync</text><text x="260.0" y="224.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">solo lo que cambió, con --dry-run</text><text x="836.0" y="224.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">El gran salto de calidad</text><rect x="24.0" y="252.0" width="832.0" height="48.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="252" width="4" height="48" fill="#19E6A4"/><circle cx="52.0" cy="276.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="52.0" y="280.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="78.0" y="282.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Git sobre SSH</text><text x="260.0" y="282.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">el servidor obtiene una versión concreta</text><text x="836.0" y="282.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">Historial y vuelta atrás reales</text><rect x="24.0" y="310.0" width="832.0" height="48.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="310" width="4" height="48" fill="#38BDF8"/><circle cx="52.0" cy="334.0" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="52.0" y="338.2" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><text x="78.0" y="340.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Script de despliegue</text><text x="260.0" y="340.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">backup + subida + verificación en un comando</text><text x="836.0" y="340.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">Siempre igual, sin olvidos</text><text x="24.0" y="404.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">No hace falta llegar al 6 para trabajar bien. En un hosting compartido, el nivel 4 con --dry-run ya es un</text><text x="24.0" y="423.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">despliegue serio.</text></svg>
