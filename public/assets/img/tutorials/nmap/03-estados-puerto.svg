<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 442" width="880" height="442" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Qué significa cada estado de puerto</title><desc id="d">Los seis estados que informa Nmap, con el estímulo enviado, la respuesta recibida y lo que se puede concluir de cada uno.</desc><rect width="880" height="442" fill="#0B1017"/><rect x="30" y="30" width="820" height="56" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="30" width="4" height="56" rx="2" fill="#19E6A4"/><text x="50" y="54" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >open</text><text x="50" y="74" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Hay un servicio escuchando y aceptó abrir la conversación.</text><text x="560" y="52" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >SYN →</text><text x="560" y="70" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >← SYN-ACK</text><line x1="548" y1="42" x2="548" y2="76" stroke="#22303C" stroke-width="1"/><rect x="30" y="94" width="820" height="56" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="94" width="4" height="56" rx="2" fill="#38BDF8"/><text x="50" y="118" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >closed</text><text x="50" y="138" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >El equipo está vivo, pero nadie escucha en ese puerto.</text><text x="560" y="116" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >SYN →</text><text x="560" y="134" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >← RST</text><line x1="548" y1="106" x2="548" y2="140" stroke="#22303C" stroke-width="1"/><rect x="30" y="158" width="820" height="56" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="158" width="4" height="56" rx="2" fill="#FBBF24"/><text x="50" y="182" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >filtered</text><text x="50" y="202" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Algo descartó el paquete. No sabes si hay servicio detrás.</text><text x="560" y="180" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >SYN →</text><text x="560" y="198" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >  (silencio)</text><line x1="548" y1="170" x2="548" y2="204" stroke="#22303C" stroke-width="1"/><rect x="30" y="222" width="820" height="56" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="222" width="4" height="56" rx="2" fill="#A78BFA"/><text x="50" y="246" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >unfiltered</text><text x="50" y="266" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Llega, pero este escaneo no distingue abierto de cerrado.</text><text x="560" y="244" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >ACK →</text><text x="560" y="262" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >← RST</text><line x1="548" y1="234" x2="548" y2="268" stroke="#22303C" stroke-width="1"/><rect x="30" y="286" width="820" height="56" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="286" width="4" height="56" rx="2" fill="#F472B6"/><text x="50" y="310" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >open|filtered</text><text x="50" y="330" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Típico de UDP: sin respuesta, no se puede decidir.</text><text x="560" y="308" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >UDP →</text><text x="560" y="326" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >  (silencio)</text><line x1="548" y1="298" x2="548" y2="332" stroke="#22303C" stroke-width="1"/><rect x="30" y="350" width="820" height="56" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="350" width="4" height="56" rx="2" fill="#8FA0AE"/><text x="50" y="374" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >closed|filtered</text><text x="50" y="394" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Poco frecuente; sale de escaneos poco concluyentes.</text><text x="560" y="372" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >varios →</text><text x="560" y="390" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >  ambiguo</text><line x1="548" y1="362" x2="548" y2="396" stroke="#22303C" stroke-width="1"/><text x="30" y="432" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >filtered es un resultado, no un fallo: significa que alguien decidió que ese paquete no llegara.</text></svg>
