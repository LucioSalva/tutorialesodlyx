<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">La columna SERVICE adivina; -sV pregunta</title><desc id="d">El mismo puerto 8090 aparece como opsmessaging en un escaneo normal y como Apache httpd 2.4.68 al añadir -sV.</desc><rect width="880" height="380" fill="#0B1017"/><text x="30" y="32" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.04em">SIN -sV — Nmap consulta una tabla</text><rect x="30" y="44" width="400" height="126" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><rect x="31" y="45" width="398" height="26" rx="5" fill="#0E141C" /><circle cx="44" cy="58" r="4" fill="#3B4754"/><circle cx="57" cy="58" r="4" fill="#3B4754"/><circle cx="70" cy="58" r="4" fill="#3B4754"/><text x="90" y="62" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="start" xml:space="preserve" >salida real</text><text x="46" y="90" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >$ nmap -p 8090 127.0.0.1</text><text x="46" y="128" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >PORT     STATE SERVICE</text><text x="46" y="147" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >8090/tcp open  opsmessaging</text><text x="30" y="190" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >«opsmessaging» es lo que dice</text><text x="30" y="208" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >/usr/share/nmap/nmap-services para</text><text x="30" y="226" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >el puerto 8090. Es una suposición.</text><line x1="444" y1="130" x2="470" y2="130" stroke="#19E6A4" stroke-width="2"/><path d="M470.0,130.0 L463.0,133.8 L463.0,126.2 Z" fill="#19E6A4"/><text x="482" y="32" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.04em">CON -sV — Nmap habla con el servicio</text><rect x="482" y="44" width="368" height="145" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><rect x="483" y="45" width="366" height="26" rx="5" fill="#0E141C" /><circle cx="496" cy="58" r="4" fill="#3B4754"/><circle cx="509" cy="58" r="4" fill="#3B4754"/><circle cx="522" cy="58" r="4" fill="#3B4754"/><text x="542" y="62" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="start" xml:space="preserve" >salida real</text><text x="498" y="90" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >$ nmap -sV -p 8090 127.0.0.1</text><text x="498" y="128" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >PORT     STATE SERVICE VERSION</text><text x="498" y="147" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >8090/tcp open  http    Apache</text><text x="498" y="166" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >                       httpd 2.4.68 ((Debian))</text><text x="482" y="208" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Abre la conexión, lee el saludo y lo</text><text x="482" y="226" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >compara con miles de huellas. Es evidencia.</text><rect x="30" y="258" width="820" height="106" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="46" y="284" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >Qué podemos y qué no podemos concluir</text><circle cx="54" cy="304" r="3.5" fill="#19E6A4"/><text x="68" y="308" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Podemos</text><text x="170" y="308" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >En 8090 hay algo que habla HTTP y se presenta como Apache 2.4.68.</text><circle cx="54" cy="326" r="3.5" fill="#FBBF24"/><text x="68" y="330" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >No podemos</text><text x="170" y="330" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Que sea realmente Apache: un banner se puede cambiar.</text><circle cx="54" cy="348" r="3.5" fill="#F87171"/><text x="68" y="352" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Menos aún</text><text x="170" y="352" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Que esa versión sea vulnerable aquí: falta el contexto del parcheado.</text></svg>
