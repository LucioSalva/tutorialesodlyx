<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d"><title id="t">Sesión interactiva frente a comando remoto</title><desc id="d">A la izquierda, ssh srv abre un shell y te deja dentro hasta que escribes exit. A la derecha, ssh srv hostname ejecuta un único comando, devuelve su salida y vuelve inmediatamente a tu equipo.</desc><rect width="880" height="300" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="262.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SESIÓN INTERACTIVA</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">ssh srv</text><text x="44.0" y="96.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">alumno@laptop:~$ ssh srv</text><text x="44.0" y="124.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">alumno@servidor:~$ hostname</text><text x="44.0" y="152.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">servidor</text><text x="44.0" y="180.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">alumno@servidor:~$ exit</text><text x="44.0" y="208.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">alumno@laptop:~$</text><text x="44.0" y="252.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Te quedas dentro: el prompt cambia de máquina.</text><rect x="456.0" y="20.0" width="400.0" height="262.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="474.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">COMANDO REMOTO</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">ssh srv hostname</text><text x="476.0" y="96.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">alumno@laptop:~$ ssh srv hostname</text><text x="476.0" y="124.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">servidor</text><text x="476.0" y="152.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">alumno@laptop:~$</text><text x="476.0" y="196.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Ejecuta, devuelve la salida y el código de salida, y</text><text x="476.0" y="214.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">termina. Es la base de los scripts.</text><text x="476.0" y="252.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">El prompt nunca deja de ser el tuyo.</text></svg>
