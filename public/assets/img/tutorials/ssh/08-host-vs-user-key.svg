<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d"><title id="t">Host key y user key</title><desc id="d">Dos columnas. La host key identifica al servidor, la genera el servidor y tu cliente la guarda en known_hosts. La user key te identifica a ti, la generas tú y el servidor guarda la pública en authorized_keys.</desc><rect width="880" height="390" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="300.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">HOST KEY</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">la identidad del SERVIDOR</text><text x="42.0" y="96.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">«Yo soy este servidor»</text><text x="42.0" y="132.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">La genera</text><text x="42.0" y="152.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">el servidor, al instalarse</text><text x="42.0" y="178.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Privada en</text><text x="42.0" y="198.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">/etc/ssh/ssh_host_ed25519_key</text><text x="42.0" y="224.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Pública guardada en</text><text x="42.0" y="244.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">TU ~/.ssh/known_hosts</text><text x="42.0" y="270.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Te protege a ti</text><text x="42.0" y="290.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">de hablar con el servidor equivocado</text><rect x="456.0" y="20.0" width="400.0" height="300.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="474.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">USER KEY</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">la identidad del USUARIO</text><text x="474.0" y="96.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">«Yo soy este usuario»</text><text x="474.0" y="132.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">La generas</text><text x="474.0" y="152.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">tú, con ssh-keygen</text><text x="474.0" y="178.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Privada en</text><text x="474.0" y="198.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">TU ~/.ssh/id_ed25519</text><text x="474.0" y="224.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Pública guardada en</text><text x="474.0" y="244.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">~/.ssh/authorized_keys DEL SERVIDOR</text><text x="474.0" y="270.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Protege al servidor</text><text x="474.0" y="290.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">de dejar entrar a quien no debe</text><line x1="424.0" y1="170.0" x2="456.0" y2="170.0" stroke="#8FA0AE" stroke-width="1.4"/><path d="M456.0,170.0 L448.8,173.5 L448.8,166.5 Z" fill="#8FA0AE"/><path d="M424.0,170.0 L431.2,166.5 L431.2,173.5 Z" fill="#8FA0AE"/><text x="440.0" y="348.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" xml:space="preserve">Las dos comprobaciones ocurren en la misma conexión y en este orden: primero tu cliente verifica al</text><text x="440.0" y="368.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" xml:space="preserve">servidor; después el servidor te verifica a ti.</text></svg>
