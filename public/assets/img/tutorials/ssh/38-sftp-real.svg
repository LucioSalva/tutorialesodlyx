<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 578" width="880" height="578" role="img" aria-labelledby="t d"><title id="t">Una sesión sftp real</title><desc id="d">Salida real de sftp: pwd y lpwd muestran el directorio remoto y el local, ls y lls listan cada lado, cd y lcd cambian cada uno, put sube index.php, get baja app.css con otro nombre, y mkdir y rmdir crean y quitan una carpeta remota.</desc><rect width="880" height="578" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="562.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sftp srv</tspan></text><text x="24.0" y="75.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Connected to srv.</tspan></text><rect x="14.0" y="80.0" width="852.0" height="17.0" rx="3" fill="#A78BFA" fill-opacity="0.1"/><rect x="14" y="80.0" width="3" height="17" fill="#A78BFA"/><circle cx="850.0" cy="87.5" r="10" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="850.0" y="91.7" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="92.0" font-family=