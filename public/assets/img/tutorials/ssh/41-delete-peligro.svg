<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-labelledby="t d"><title id="t">Qué hace --delete</title><desc id="d">Origen con index.php y assets. Destino con index.php, assets, viejo.html y uploads de usuarios. Con --delete, rsync borra del destino todo lo que no existe en el origen, incluidos los uploads.</desc><rect width="880" height="370" fill="#0B1017"/><rect x="24.0" y="20.0" width="300.0" height="230.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="300.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ORIGEN · proyecto/</text><text x="44.0" y="90.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">index.php</text><text x="44.0" y="120.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">assets/app.css</text><rect x="556.0" y="20.0" width="300.0" height="230.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="556.0" y="20.0" width="300.0" height="3" rx="1.5" fill="#19E6A4"/><text x="574.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">DESTINO · public_html/</text><text x="576.0" y="90.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">index.php</text><text x="576.0" y="120.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">assets/app.css</text><text x="576.0" y="150.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">viejo.html</text><text x="836.0" y="150.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="end" xml:space="preserve">BORRADO</text><text x="576.0" y="180.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">uploads/foto.jpg</text><text x="836.0" y="180.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="end" xml:space="preserve">BORRADO</text><text x="576.0" y="210.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">.htaccess</text><text x="836.0" y="210.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="end" xml:space="preserve">BORRADO</text><line x1="334.0" y1="130.0" x2="546.0" y2="130.0" stroke="#FBBF24" stroke-width="2.2"/><path d="M546.0,130.0 L538.8,133.5 L538.8,126.5 Z" fill="#FBBF24"/><text x="440.0" y="118.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle" xml:space="preserve">rsync -av --delete</text><rect x="24.0" y="266.0" width="832.0" height="88.0" rx="6" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-width="1"/><text x="44.0" y="292.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">⚠ --delete borra en el destino lo que no está en el origen</text><text x="44.0" y="316.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Ejecuta SIEMPRE antes lo mismo con --dry-run y lee cada línea «deleting». Un destino equivocado o una barra de más</text><text x="44.0" y="334.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">vacía un directorio entero.</text></svg>
