<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Tu primer escaneo, paso a paso</title><desc id="d">Terminal con el resultado real de nmap -sV 127.0.0.1 en la máquina de laboratorio.</desc><rect width="880" height="320" fill="#0B1017"/><rect x="30" y="24" width="820" height="270" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><rect x="31" y="25" width="818" height="26" rx="5" fill="#0E141C" /><circle cx="44" cy="38" r="4" fill="#3B4754"/><circle cx="57" cy="38" r="4" fill="#3B4754"/><circle cx="70" cy="38" r="4" fill="#3B4754"/><text x="90" y="42" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="start" xml:space="preserve" >lucio@lab:~ · salida real · Nmap 7.991</text><text x="46" y="70" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >$ nmap -sV 127.0.0.1</text><text x="46" y="110" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Starting Nmap 7.991 ( https://nmap.org ) at 2026-09-11 17:31 -0600</text><text x="46" y="130" fill="#D7E2EA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Nmap scan report for localhost (127.0.0.1)</text><text x="46" y="150" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Host is up (0.000030s latency).</text><text x="46" y="170" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Not shown: 998 closed tcp ports (conn-refused)</text><text x="46" y="190" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >PORT     STATE SERVICE    VERSION</text><text x="46" y="210" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >5432/tcp open  postgresql PostgreSQL DB</text><text x="46" y="230" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >8090/tcp open  http       Apache httpd 2.4.68 ((Debian))</text><text x="46" y="270" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Nmap done: 1 IP address (1 host up) scanned in 11.16 seconds</text><rect x="42" y="158" width="320" height="20" rx="3" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="384" cy="168" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.5"/><text x="384" y="172" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >!</text><text x="404" y="164" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >998 de los 1 000 puertos probados estaban cerrados.</text><text x="404" y="180" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Nmap los resume en una línea para no llenar la pantalla.</text><text x="30" y="300" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Dos puertos abiertos en la máquina de laboratorio. Eso es exposición, no vulnerabilidad: dice qué ofrece el equipo, no si está mal configurado.</text></svg>
