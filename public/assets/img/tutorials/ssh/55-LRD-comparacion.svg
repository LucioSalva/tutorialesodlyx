<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d"><title id="t">-L frente a -R frente a -D</title><desc id="d">Tabla comparativa de los tres tipos de reenvío de puertos: dónde se abre el puerto, destino, sintaxis, uso típico y regla mnemotécnica.</desc><rect width="880" height="360" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="44.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="48.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve"></text><text x="270.0" y="48.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">-L  LOCAL</text><text x="470.0" y="48.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">-R  REMOTO</text><text x="670.0" y="48.0" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">-D  DINÁMICO</text><rect x="24.0" y="64.0" width="832.0" height="46.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="92.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Dónde se abre el puerto</text><text x="270.0" y="92.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">en TU equipo</text><text x="470.0" y="92.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">en el SERVIDOR</text><text x="670.0" y="92.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">en TU equipo</text><rect x="24.0" y="110.0" width="832.0" height="46.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="138.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Destino</text><text x="270.0" y="138.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">uno, fijo</text><text x="470.0" y="138.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">uno, fijo</text><text x="670.0" y="138.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">el que pida cada app</text><rect x="24.0" y="156.0" width="832.0" height="46.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="184.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Sintaxis</text><text x="270.0" y="184.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">-L local:host:puerto</text><text x="470.0" y="184.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">-R remoto:host:puerto</text><text x="670.0" y="184.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weig