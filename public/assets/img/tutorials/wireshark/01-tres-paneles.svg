<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Los tres paneles de Wireshark</title><desc id="d">Ventana de Wireshark dividida en Packet List arriba, Packet Details en el centro y Packet Bytes abajo.</desc><rect width="880" height="430" fill="#0B1017"/><rect x="30" y="20" width="820" height="390" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><path d="M30,46 h820" stroke="#22303C" stroke-width="1"/><circle cx="44" cy="33" r="4" fill="#3B4754"/><circle cx="57" cy="33" r="4" fill="#3B4754"/><circle cx="70" cy="33" r="4" fill="#3B4754"/><text x="88" y="37" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" text-anchor="start" xml:space="preserve" >Wireshark · lo</text><rect x="44" y="56" width="792" height="26" rx="4" fill="#0E141C" stroke="#22303C" stroke-width="1" /><text x="54" y="73" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Apply a display filter … &lt;Ctrl-/&gt;</text><rect x="44" y="94" width="792" height="96" rx="4" fill="#0E141C" stroke="#22303C" stroke-width="1" /><rect x="44" y="94" width="4" height="96" rx="2" fill="#38BDF8"/><text x="62" y="114" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.08em">PACKET LIST</text><text x="62" y="134" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" >Una línea por paquete. Es el índice de la captura.</text><line x1="62" y1="150" x2="762" y2="150" stroke="#34465A" stroke-width="5"/><line x1="62" y1="165" x2="725" y2="165" stroke="#34465A" stroke-width="5"/><circle cx="44" cy="106" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.5"/><text x="44" y="110" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >①</text><rect x="44" y="202" width="792" height="118" rx="4" fill="#0E141C" stroke="#22303C" stroke-width="1" /><rect x="44" y="202" width="4" height="118" rx="2" fill="#19E6A4"/><text x="62" y="222" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.08em">PACKET DETAILS</text><text x="62" y="242" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" >El paquete seleccionado, desmontado campo a campo.</text><line x1="62" y1="258" x2="762" y2="258" stroke="#34465A" stroke-width="5"/><line x1="62" y1="273" x2="725" y2="273" stroke="#34465A" stroke-width="5"/><line x1="62" y1="288" x2="688" y2="288" stroke="#34465A" stroke-width="5"/><line x1="62" y1="303" x2="651" y2="303" stroke="#34465A" stroke-width="5"/><circle cx="44" cy="214" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="44" y="218" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >②</text><rect x="44" y="332" width="792" height="86" rx="4" fill="#0E141C" stroke="#22303C" stroke-width="1" /><rect x="44" y="332" width="4" height="86" rx="2" fill="#FBBF24"/><text x="62" y="352" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.08em">PACKET BYTES</text><text x="62" y="372" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" >Los mismos datos en hexadecimal y ASCII.</text><line x1="62" y1="388" x2="762" y2="388" stroke="#34465A" stroke-width="5"/><