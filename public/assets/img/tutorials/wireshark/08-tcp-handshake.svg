<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">El saludo de tres vías de TCP</title><desc id="d">Diagrama de secuencia: el cliente envía SYN, el servidor responde SYN-ACK y el cliente confirma con ACK.</desc><rect width="880" height="380" fill="#0B1017"/><text x="200" y="40" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >CLIENTE</text><text x="200" y="58" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >127.0.0.1:49452</text><text x="680" y="40" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >SERVIDOR</text><text x="680" y="58" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >127.0.0.1:8090</text><line x1="200" y1="72" x2="200" y2="330" stroke="#34465A" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="680" y1="72" x2="680" y2="330" stroke="#34465A" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="214" y1="110" x2="666" y2="110" stroke="#19E6A4" stroke-width="2"/><path d="M666.0,110.0 L659.0,113.8 L659.0,106.2 Z" fill="#19E6A4"/><rect x="348.0" y="80" width="184" height="24" rx="4" fill="#0B1017" /><text x="440.0" y="97" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >SYN   Seq=0</text><text x="440.0" y="132" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve" >«quiero hablar contigo». No lleva datos.</text><circle cx="214" cy="110" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="214" y="114" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >①</text><text x="720" y="114" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >trama 7</text><line x1="666" y1="180" x2="214" y2="180" stroke="#38BDF8" stroke-width="2"/><path d="M214.0,180.0 L221.0,176.2 L221.0,183.8 Z" fill="#38BDF8"/><rect x="348.0" y="150" width="184" height="24" rx="4" fill="#0B1017" /><text x="440.0" y="167" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >SYN, ACK   Seq=0  Ack=1</text><text x="440.0" y="202" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve" >«te oigo, y yo también quiero». Confirma y pide a la vez.</text><circle cx="666" cy="180" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.5"/><text x="666" y="184" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >②</text><text x="720" y="184" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >trama 8</text><line x1="214" y1="250" x2="666" y2="250" stroke="#19E6A4" stroke-width="2"/><path d="M666.0,250.0 L659.0,253.8 L659.0,246.2 Z" fill="#19E6A4"/><rect x="348.0" y="220" width="184" height="24" rx="4" fill="#0B1017" /><text x="440.0" y="237" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >ACK   Seq=1  Ack=1</text><text x="440.0" y="272" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve" >«confirmado». A partir de aquí ya pueden ir datos.</text><circle cx="214" cy="250" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="214" y="254" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >③</text><text x="720" y="254" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >trama 9</text><rect x="200" y="292" width="480" height="44" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="440" y="310" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve" >Conexión establecida — ahora sí viajan datos</text><text x="440" y="328" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >trama 10: GET / HTTP/1.1</text><text x="30" y="368" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Captura real de laboratorio · filtro: tcp.flags.syn == 1</text></svg>
