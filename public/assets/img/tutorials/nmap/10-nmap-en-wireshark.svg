<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Qué deja ver un escaneo en Wireshark</title><desc id="d">El mismo escaneo visto desde el lado que lo recibe: muchos SYN desde un solo origen a puertos consecutivos, casi todos contestados con RST.</desc><rect width="880" height="380" fill="#0B1017"/><text x="30" y="32" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">LO QUE TÚ EJECUTAS</text><rect x="30" y="44" width="380" height="40" rx="5" fill="#070B10" stroke="#22303C" stroke-width="1" /><text x="46" y="69" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >$ nmap -sT -p 20-25 127.0.0.1</text><text x="470" y="32" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">LO QUE VE EL OTRO LADO</text><rect x="470" y="44" width="380" height="40" rx="5" fill="#111925" stroke="#19E6A4" stroke-width="1" /><text x="486" y="69" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >tcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0</text><rect x="30" y="100" width="820" height="206" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="31" y="101" width="818" height="22" rx="5" fill="#0E141C" /><text x="52" y="116" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" >No.</text><text x="110" y="116" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" >Time</text><text x="196" y="116" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" >Source</text><text x="320" y="116" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" >Destination</text><text x="444" y="116" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" >Proto</text><text x="508" y="116" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" >Info</text><text x="52" y="142" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >1</text><text x="110" y="142" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >0.000000</text><text x="196" y="142" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >127.0.0.1</text><text x="320" y="142" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >127.0.0.1</text><text x="444" y="142" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >TCP</text><text x="508" y="142" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >  → 20  [SYN]</text><text x="52" y="162" fill="#8FA0AE" font-family="'JetBrains Mono','