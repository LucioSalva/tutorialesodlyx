<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Despliegue atómico con releases y current</title><desc id="d">Directorio releases con una carpeta por versión fechada; un enlace simbólico current apunta a la versión activa. Publicar es cambiar el enlace de una versión a otra en una sola operación; volver atrás es apuntarlo a la anterior.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="430.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="430.0" height="3" rx="1.5" fill="#E3EBF1"/><text x="42.0" y="50.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">app/</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">estructura en el servidor</text><text x="44.0" y="100.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">├── releases/</text><text x="44.0" y="132.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">│   ├── 20260914-1000/</text><text x="44.0" y="164.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">│   └── 20260914-1200/</text><text x="44.0" y="196.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">└── current → releases/20260914-1200</text><text x="44.0" y="250.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">El servidor web sirve app/current: nunca ve una carpeta</text><text x="44.0" y="268.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">a medio copiar.</text><rect x="476.0" y="20.0" width="380.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="476.0" y="20.0" width="380.0" height="3" rx="1.5" fill="#19E6A4"/><text x="494.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">PUBLICAR Y VOLVER ATRÁS</text><text x="496.0" y="76.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">1. Subir a una carpeta nueva</text><rect x="496.0" y="86.0" width="340.0" height="34.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="508.0" y="108.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">releases/20260914-1200/</text><text x="496.0" y="148.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">2. Cambiar el enlace</text><rect x="496.0" y="158.0" width="340.0" height="34.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="508.0" y="180.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">ln -sfn releases/20260914-1200 current</text><text x="496.0" y="220.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">3. ¿Falla? Volver</text><rect x="496.0" y="230.0" width="340.0" height="34.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="508.0" y="252.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">ln -sfn releases/20260914-1000 current</text><text x="496.0" y="282.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">En hosting compartido sencillo, rsync + backup</text><text x="496.0" y="299.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">suele bastar.</text></svg>
