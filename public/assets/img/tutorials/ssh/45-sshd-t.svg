<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 619" width="880" height="619" role="img" aria-labelledby="t d"><title id="t">Validar sshd_config antes de aplicarlo</title><desc id="d">Salida real en el bastión: se ven los valores por defecto comentados, se introduce una errata a propósito, sshd -t la detecta indicando la línea 61 y termina con código 255; tras corregirla, sshd -t no imprime nada y devuelve 0, y sshd -T confirma los valores efectivos.</desc><rect width="880" height="619" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="603.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">grep -nE &#x27;^#?(PasswordAuthentication|KbdInteractiveAuthentication|PermitRootLogin)&#x27;</tspan></text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  /etc/ssh/sshd_config</tspan></text><text x="24.0" y="96.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">36:#PermitRootLogin prohibit-password</tspan></text><text x="24.0" y="115.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">61:#PasswordAuthentication yes</tspan></text><text x="24.0" y="134.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">67:#KbdInteractiveAuthentication yes</tspan></text><text x="24.0" y="153.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak</tspan></text><text x="24.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">[… 9 líneas omitidas …]</tspan></text><text x="24.0" y="191.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">[sudo] password for alumno: </tspan></text><text x="24.0" y="210.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo sed -i &#x27;s/^#PasswordAuthentication yes/PasswordAuthentcation no/&#x27;</tspan></text><text x="24.0" y="229.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  /etc/ssh/sshd_config</tspan></text><text x="24.0" y="248.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo sshd -t</tspan></text><rect x="14.0" y="253.0" width="852.0" height="19.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="253.0" width="3" height="19" fill="#F87171"/><circle cx="850.0" cy="261.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="265.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="267.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">/etc/ssh/sshd_config: line 61: Bad configuration option: PasswordAuthentcation</tspan></text><text x="24.0" y="286.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">/etc/ssh/sshd_config: terminating, 1 bad configuration options</tspan></text><text x="24.0" y="305.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">echo $?</tspan></text><rect x="14.0" y="310.0" width="852.0" height="19.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="310.0" width="3" height="19" fill="#F87171"/><circle cx="850.0" cy="318.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="322.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="324.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">255</tspan></text><text x="24.0" y="343.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo sed -i &#x27;s/^PasswordAuthentcation no/PasswordAuthentication no/&#x27;</tspan></text><text x="24.0" y="362.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  /etc/ssh/sshd_config</tspan></text><text x="24.0" y="381.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo sed -i &#x27;s/^#KbdInteractiveAuthentication yes/KbdInteractiveAuthentication no/&#x27;</tspan></text><text x="24.0" y="400.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  /etc/ssh/sshd_config</tspan></text><text x="24.0" y="419.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo sshd -t</tspan></text><text x="24.0" y="438.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">echo $?</tspan></text><rect x="14.0" y="443.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="443.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="451.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="455.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="457.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">0</tspan></text><text x="24.0" y="476.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo sshd -T | grep -E &#x27;^(passwordauthentication|kbdinteractiveauthentication|permitroo</tspan></text><text x="24.0" y="495.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  tlogin|pubkeyauthentication) &#x27;</tspan></text><text x="24.0" y="514.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">permitrootlogin without-password</tspan></text><text x="24.0" y="533.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">pubkeyauthentication yes</tspan></text><rect x="14.0" y="538.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="538.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="546.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="550.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="552.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">passwordauthentication no</tspan></text><text x="24.0" y="571.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">kbdinteractiveauthentication no</tspan></text><text x="24.0" y="590.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">alumno@bastion:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">sudo kill -HUP $(cat /var/run/sshd.pid)</tspan></text></svg>
