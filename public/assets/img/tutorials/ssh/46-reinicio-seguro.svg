<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d"><title id="t">Aplicar cambios en sshd sin quedarte fuera</title><desc id="d">Cinco pasos: mantener abierta la sesión actual, editar y validar con sshd -t, recargar el servicio, abrir una segunda terminal y comprobar que entra; solo entonces cerrar la primera.</desc><rect width="880" height="440" fill="#0B1017"/><rect x="24.0" y="24.0" width="560.0" height="54.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="24" width="4" height="54" fill="#19E6A4"/><circle cx="54.0" cy="51.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="54.0" y="55.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="80.0" y="48.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Deja abierta la sesión actual</text><text x="80.0" y="67.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Es tu vía de vuelta. No la cierres pase lo que pase.</text><rect x="24.0" y="90.0" width="560.0" height="54.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="90" width="4" height="54" fill="#38BDF8"/><circle cx="54.0" cy="117.0" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="54.0" y="121.2" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="80.0" y="114.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Edita y valida</text><text x="80.0" y="133.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">sudo sshd -t · sin salida = sintaxis correcta</text><rect x="24.0" y="156.0" width="560.0" height="54.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="156" width="4" height="54" fill="#38BDF8"/><circle cx="54.0" cy="183.0" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="54.0" y="187.2" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="80.0" y="180.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Aplica</text><text x="80.0" y="199.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">sudo systemctl reload sshd · las sesiones abiertas no se cortan</text><rect x="24.0" y="222.0" width="560.0" height="54.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="222" width="4" height="54" fill="#FBBF24"/><circle cx="54.0" cy="249.0" r="11" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="54.0" y="253.2" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="80.0" y="246.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Abre una SEGUNDA terminal</text><text x="80.0" y="265.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Conéctate de nuevo desde cero, sin cerrar la primera.</text><rect x="24.0" y="288.0" width="560.0" height="54.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24" y="288" width="4" height="54" fill="#19E6A4"/><circle cx="54.0" cy="315.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="54.0" y="319.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="80.0" y="312.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">¿Entra la segunda?</text><text x="80.0" y="331.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Sí → ya puedes cerrar la primera · No → corrige desde la primera</text><rect x="604.0" y="24.0" width="252.0" height="150.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="620.0" y="48.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">TERMINAL 1 · abierta</text><text x="620.0" y="74.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">alumno@bastion:~$</text><text x="620.0" y="96.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">sudo sshd -t</text><text x="620.0" y="118.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">sudo systemctl reload sshd</text><text x="620.0" y="150.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">…sigue viva todo el rato</text><rect x="604.0" y="190.0" width="252.0" height="130.0" rx="6" fill="#070B10" stroke="#FBBF24" stroke-width="1"/><text x="620.0" y="214.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">TERMINAL 2 · nueva</text><text x="620.0" y="240.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">$ ssh bastion hostname</text><text x="620.0" y="262.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">bastion</text><text x="620.0" y="294.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">entra → cambio correcto</text><rect x="24.0" y="360.0" width="832.0" height="60.0" rx="6" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-width="1"/><text x="44.0" y="384.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Por qué importa: con un error en sshd_config y la única sesión cerrada, en un servidor remoto sin consola física te</text><text x="44.0" y="402.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">quedas fuera. Con dos sesiones, es un susto de diez segundos.</text></svg>
