<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">ssh_config frente a sshd_config</title><desc id="d">Dos columnas. ssh_config y ~/.ssh/config son del cliente y deciden cómo me conecto. sshd_config es del servidor y decide quién puede entrar y cómo. Diferencia de nombre: una d.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="260.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">~/.ssh/config</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">CLIENTE · cómo me conecto</text><circle cx="48" cy="96" r="3.5" fill="#38BDF8"/><text x="62.0" y="100.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Host, HostName, User, Port</text><circle cx="48" cy="130" r="3.5" fill="#38BDF8"/><text x="62.0" y="134.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">IdentityFile, IdentitiesOnly</text><circle cx="48" cy="164" r="3.5" fill="#38BDF8"/><text x="62.0" y="168.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">ProxyJump, ServerAliveInterval</text><circle cx="48" cy="198" r="3.5" fill="#38BDF8"/><text x="62.0" y="202.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Afecta solo a TUS conexiones</text><circle cx="48" cy="232" r="3.5" fill="#38BDF8"/><text x="62.0" y="236.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Sin sudo · efecto inmediato</text><rect x="456.0" y="20.0" width="400.0" height="260.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="474.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">/etc/ssh/sshd_config</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">SERVIDOR · cómo acepta conexiones</text><circle cx="480" cy="96" r="3.5" fill="#19E6A4"/><text x="494.0" y="100.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Port, ListenAddress</text><circle cx="480" cy="130" r="3.5" fill="#19E6A4"/><text x="494.0" y="134.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">PasswordAuthentication</text><circle cx="480" cy="164" r="3.5" fill="#19E6A4"/><text x="494.0" y="168.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">PermitRootLogin, AllowUsers</text><circle cx="480" cy="198" r="3.5" fill="#19E6A4"/><text x="494.0" y="202.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Afecta a TODOS los que entran</text><circle cx="480" cy="232" r="3.5" fill="#19E6A4"/><text x="494.0" y="236.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">sudo · sshd -t · recargar</text><rect x="24.0" y="292.0" width="832.0" height="26.0" rx="6" fill="#0B1017"/><text x="440.0" y="310.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">Un «d» de diferencia: sshd = SSH daemon = el servidor.</text></svg>
