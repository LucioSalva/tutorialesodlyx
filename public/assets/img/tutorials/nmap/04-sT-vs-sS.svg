<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">TCP connect (-sT) frente a SYN scan (-sS)</title><desc id="d">Diagrama comparado: -sT completa el saludo de tres vías y luego cierra; -sS corta después del SYN-ACK sin llegar a establecer la conexión.</desc><rect width="880" height="400" fill="#0B1017"/><rect x="30" y="24" width="390" height="350" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="24" width="390" height="3" rx="2" fill="#38BDF8"/><text x="50" y="52" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >-sT · TCP connect</text><text x="50" y="71" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >sin privilegios</text><rect x="460" y="24" width="390" height="350" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="460" y="24" width="390" height="3" rx="2" fill="#19E6A4"/><text x="480" y="52" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >-sS · SYN scan</text><text x="480" y="71" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >requiere sudo</text><text x="110" y="100" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >Nmap</text><text x="330" y="100" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >objetivo</text><line x1="110" y1="110" x2="110" y2="300" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="330" y1="110" x2="330" y2="300" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="118" y1="134" x2="322" y2="134" stroke="#38BDF8" stroke-width="1.6"/><path d="M322.0,134.0 L316.7,136.9 L316.7,131.1 Z" fill="#38BDF8"/><rect x="158.0" y="110" width="124" height="18" rx="3" fill="#111925" /><text x="220.0" y="123" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >SYN</text><line x1="322" y1="176" x2="118" y2="176" stroke="#38BDF8" stroke-width="1.6"/><path d="M118.0,176.0 L123.3,173.1 L123.3,178.9 Z" fill="#38BDF8"/><rect x="158.0" y="152" width="124" height="18" rx="3" fill="#111925" /><text x="220.0" y="165" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >SYN-ACK</text><line x1="118" y1="218" x2="322" y2="218" stroke="#38BDF8" stroke-width="1.6"/><path d="M322.0,218.0 L316.7,220.9 L316.7,215.1 Z" fill="#38BDF8"/><rect x="158.0" y="194" width="124" height="18" rx="3" fill="#111925" /><text x="220.0" y="207" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >ACK</text><line x1="118" y1="260" x2="322" y2="260" stroke="#F87171" stroke-width="1.6"/><path d="M322.0,260.0 L316.7,262.9 L316.7,257.1 Z" fill="#F87171"/><rect x="158.0" y="236" width="124" height="18" rx="3" fill="#111925" /><text x="220.0" y="249" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >RST</text><text x="50" y="322" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Cuatro paquetes. La conexión llega a existir:</text><text x="50" y="340" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >el servicio la registra en su log.</text><text x="50" y="362" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Más lento y más ruidoso, pero funciona sin sudo.</text><text x="540" y="100" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >Nmap</text><text x="760" y="100" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >objetivo</text><line x1="540" y1="110" x2="540" y2="250" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="760" y1="110" x2="760" y2="250" stroke="#34465A" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="548" y1="134" x2="752" y2="134" stroke="#19E6A4" stroke-width="1.6"/><path d="M752.0,134.0 L746.7,136.9 L746.7,131.1 Z" fill="#19E6A4"/><rect x="588.0" y="110" width="124" height="18" rx="3" fill="#111925" /><text x="650.0" y="123" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >SYN</text><line x1="752" y1="176" x2="548" y2="176" stroke="#19E6A4" stroke-width="1.6"/><path d="M548.0,176.0 L553.3,173.1 L553.3,178.9 Z" fill="#19E6A4"/><rect x="588.0" y="152" width="124" height="18" rx="3" fill="#111925" /><text x="650.0" y="165" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >SYN-ACK</text><line x1="548" y1="218" x2="752" y2="218" stroke="#FBBF24" stroke-width="1.6"/><path d="M752.0,218.0 L746.7,220.9 L746.7,215.1 Z" fill="#FBBF24"/><rect x="588.0" y="194" width="124" height="18" rx="3" fill="#111925" /><text x="650.0" y="207" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >RST</text><text x="480" y="280" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Tres paquetes. La conexión nunca se completa:</text><text x="480" y="298" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >muchas aplicaciones no la registran.</text><text x="480" y="322" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Eso NO significa invisible: el firewall y el IDS</text><text x="480" y="338" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >de la red sí lo ven perfectamente.</text><text x="480" y="362" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Es el escaneo por defecto cuando hay privilegios.</text><text x="440" y="394" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve" >Ambos llegan a la misma conclusión sobre el puerto. Cambian el coste y el rastro.</text></svg>
