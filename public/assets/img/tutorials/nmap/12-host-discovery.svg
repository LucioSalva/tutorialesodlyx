<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Qué envía Nmap para saber si un equipo está vivo</title><desc id="d">Con privilegios, nmap -sn manda cuatro sondas distintas a cada objetivo; basta con que una responda.</desc><rect width="880" height="330" fill="#0B1017"/><text x="30" y="40" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >$ sudo nmap -sn 192.168.56.0/24</text><text x="30" y="60" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Sin sudo, Nmap solo puede intentar un connect() a 80 y 443.</text><rect x="30" y="78" width="820" height="50" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="78" width="4" height="50" rx="2" fill="#FBBF24"/><text x="50" y="99" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >ICMP echo request</text><text x="240" y="99" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >el ping de toda la vida</text><text x="50" y="118" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Muchos firewalls de Windows lo bloquean por defecto.</text><rect x="30" y="136" width="820" height="50" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="136" width="4" height="50" rx="2" fill="#19E6A4"/><text x="50" y="157" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >TCP SYN a 443</text><text x="240" y="157" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >«¿hay algo en HTTPS?»</text><text x="50" y="176" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Un RST también cuenta como respuesta: demuestra que hay alguien.</text><rect x="30" y="194" width="820" height="50" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="194" width="4" height="50" rx="2" fill="#38BDF8"/><text x="50" y="215" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >TCP ACK a 80</text><text x="240" y="215" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >un ACK sin conexión previa</text><text x="50" y="234" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Cruza algunos filtros que descartan el SYN.</text><rect x="30" y="252" width="820" height="50" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="252" width="4" height="50" rx="2" fill="#A78BFA"/><text x="50" y="273" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >ICMP timestamp</text><text x="240" y="273" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >petición de hora</text><text x="50" y="292" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Sobrevive en equipos que filtran el echo pero no esto.</text><rect x="30" y="310" width="820" height="0" rx="4" fill="#111925" /><text x="30" y="320" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Si ninguna responde, Nmap da el equipo por caído — y puede equivocarse. -Pn salta este paso y escanea de todas formas.</text></svg>
