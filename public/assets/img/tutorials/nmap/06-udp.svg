<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Por qué el escaneo UDP es lento y ambiguo</title><desc id="d">En UDP el silencio no distingue un puerto abierto de uno filtrado, y el único «no» claro llega como ICMP port unreachable.</desc><rect width="880" height="350" fill="#0B1017"/><rect x="30" y="30" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="30" width="4" height="62" rx="2" fill="#19E6A4"/><text x="50" y="54" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Puerto ABIERTO con servicio que contesta</text><text x="50" y="74" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >El único caso con certeza total.</text><text x="480" y="54" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >UDP →</text><text x="480" y="74" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >← respuesta UDP</text><rect x="676" y="48" width="160" height="26" rx="4" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1" /><text x="756" y="66" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >open</text><rect x="30" y="100" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="100" width="4" height="62" rx="2" fill="#F472B6"/><text x="50" y="124" fill="#F472B6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Puerto ABIERTO con servicio que calla</text><text x="50" y="144" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Muchos servicios UDP no responden a basura.</text><text x="480" y="124" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >UDP →</text><text x="480" y="144" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >  (silencio)</text><rect x="676" y="118" width="160" height="26" rx="4" fill="#F472B6" fill-opacity="0.1" stroke="#F472B6" stroke-width="1" /><text x="756" y="136" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >open|filtered</text><rect x="30" y="170" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="170" width="4" height="62" rx="2" fill="#38BDF8"/><text x="50" y="194" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Puerto CERRADO</text><text x="50" y="214" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >La negativa la da IP, no UDP.</text><text x="480" y="194" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >UDP →</text><text x="480" y="214" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >← ICMP port unreachable</text><rect x="676" y="188" width="160" height="26" rx="4" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1" /><text x="756" y="206" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >closed</text><rect x="30" y="240" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="240" width="4" height="62" rx="2" fill="#FBBF24"/><text x="50" y="264" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Puerto FILTRADO</text><text x="50" y="284" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Indistinguible del segundo caso.</text><text x="480" y="264" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >UDP →</text><text x="480" y="284" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >  (silencio)</text><rect x="676" y="258" width="160" height="26" rx="4" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-width="1" /><text x="756" y="276" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="middle" xml:space="preserve" >open|filtered</text><text x="30" y="326" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Los casos 2 y 4 producen exactamente la misma evidencia: nada. Por eso Nmap no se inventa una respuesta y devuelve open|filtered.</text><text x="30" y="344" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Y por eso reintenta y espera: un escaneo UDP amplio puede tardar horas. Escanea pocos puertos UDP, elegidos.</text></svg>
