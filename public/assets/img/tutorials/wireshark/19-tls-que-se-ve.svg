<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Qué revela HTTPS aunque vaya cifrado</title><desc id="d">En un handshake TLS el nombre del servidor viaja en claro dentro del Client Hello; el contenido posterior no es legible.</desc><rect width="880" height="350" fill="#0B1017"/><rect x="30" y="24" width="400" height="300" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1" /><text x="50" y="50" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">LO QUE SÍ VES</text><circle cx="58" cy="74" r="3" fill="#19E6A4"/><text x="72" y="78" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Client Hello › server_name</text><text x="410" y="78" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >ejemplo.lab</text><circle cx="58" cy="104" r="3" fill="#19E6A4"/><text x="72" y="108" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >IP de destino</text><text x="410" y="108" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >203.0.113.71</text><circle cx="58" cy="134" r="3" fill="#19E6A4"/><text x="72" y="138" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Puerto</text><text x="410" y="138" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >443/tcp</text><circle cx="58" cy="164" r="3" fill="#19E6A4"/><text x="72" y="168" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Versión negociada</text><text x="410" y="168" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >TLS 1.3</text><circle cx="58" cy="194" r="3" fill="#19E6A4"/><text x="72" y="198" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Cipher suite</text><text x="410" y="198" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >TLS_AES_256_GCM_SHA384</text><circle cx="58" cy="224" r="3" fill="#19E6A4"/><text x="72" y="228" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Volumen y ritmo</text><text x="410" y="228" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >2 940 bytes en 0.3 s</text><circle cx="58" cy="254" r="3" fill="#19E6A4"/><text x="72" y="258" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Momento exacto</text><text x="410" y="258" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >23:31:39.778</text><rect x="450" y="24" width="400" height="300" rx="6" fill="#111925" stroke="#F87171" stroke-width="1" /><text x="470" y="50" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">LO QUE NO VES</text><path d="M470,70 l8,8 M478,70 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="78" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >La URL concreta que se pidió</text><path d="M470,100 l8,8 M478,100 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="108" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Las cabeceras HTTP</text><path d="M470,130 l8,8 M478,130 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="138" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Las cookies y los tokens</text><path d="M470,160 l8,8 M478,160 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="168" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >El cuerpo de la petición</text><path d="M470,190 l8,8 M478,190 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="198" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >La respuesta del servidor</text><path d="M470,220 l8,8 M478,220 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="228" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Los formularios enviados</text><path d="M470,250 l8,8 M478,250 l-8,8" fill="none" stroke="#F87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="258" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Con TLS 1.3, ni el certificado</text><text x="440" y="344" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve" >Metadatos no es lo mismo que contenido — y para investigar, los metadatos suelen bastar.</text></svg>
