<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" role="img" aria-labelledby="t d"><title id="t">REMOTE HOST IDENTIFICATION HAS CHANGED</title><desc id="d">Salida real al conectar después de regenerar las host keys del servidor: el aviso con arrobas, la advertencia de posible intermediario, la línea que dice que también es posible que la clave simplemente haya cambiado, la huella nueva, la línea de known_hosts afectada y la negativa a conectar.</desc><rect width="880" height="306" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="290.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh srv hostname</tspan></text><text x="24.0" y="75.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan></text><rect x="14.0" y="80.0" width="852.0" height="17.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="80.0" width="3" height="17" fill="#F87171"/><circle cx="850.0" cy="87.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="91.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="92.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">@    WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!     @</tspan></text><text x="24.0" y="109.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan></text><text x="24.0" y="126.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!</tspan></text><text x="24.0" y="143.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Someone could be eavesdropping on you right now (man-in-the-middle attack)!</tspan></text><rect x="14.0" y="148.0" width="852.0" height="17.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="148.0" width="3" height="17" fill="#FBBF24"/><circle cx="850.0" cy="155.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="159.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="160.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">It is also possible that a host key has just been changed.</tspan></text><text x="24.0" y="177.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">The fingerprint for the ED25519 key sent by the remote host is</tspan></text><rect x="14.0" y="182.0" width="852.0" height="17.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="182.0" width="3" height="17" fill="#38BDF8"/><circle cx="850.0" cy="189.5" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="850.0" y="193.7" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="194.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">SHA256:KjYa/RXk2+RjRJdxHjmo1z9EW6ZEIGBcQ4vU81R0UTc.</tspan></text><text x="24.0" y="211.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Please contact your system administrator.</tspan></text><text x="24.0" y="228.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Add correct host key in /home/alumno/.ssh/known_hosts to get rid of this message.</tspan></text><rect x="14.0" y="233.0" width="852.0" height="17.0" rx="3" fill="#A78BFA" fill-opacity="0.1"/><rect x="14" y="233.0" width="3" height="17" fill="#A78BFA"/><circle cx="850.0" cy="240.5" r="10" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="850.0" y="244.7" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="245.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Offending ECDSA key in /home/alumno/.ssh/known_hosts:3</tspan></text><text x="24.0" y="262.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Host key for servidor has changed and you have requested strict checking.</tspan></text><rect x="14.0" y="267.0" width="852.0" height="17.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="267.0" width="3" height="17" fill="#F87171"/><circle cx="850.0" cy="274.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="278.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="24.0" y="279.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Host key verification failed.</tspan></text></svg>
