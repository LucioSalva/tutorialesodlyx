<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d"><title id="t">Zoom: la autenticación dentro de ssh -v</title><desc id="d">Zoom sobre tres líneas reales de ssh -v: el cliente ofrece la llave pública, el servidor la acepta y el cliente queda autenticado con publickey.</desc><rect width="880" height="340" fill="#0B1017"/><rect x="16.0" y="16.0" width="848.0" height="104.0" rx="6" fill="#070B10" stroke="#38BDF8" stroke-width="1.6"/><text x="34.0" y="40.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">① El cliente OFRECE una llave (aún no firma nada)</text><text x="34.0" y="72.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">Offering public key: /home/alumno/.ssh/id_ed25519 ED25519</tspan></text><text x="34.0" y="100.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqjHI explicit agent</tspan></text><rect x="16.0" y="132.0" width="848.0" height="104.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1.6"/><text x="34.0" y="156.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">② El servidor la tiene en authorized_keys y la ACEPTA</text><text x="34.0" y="188.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">Server accepts key: /home/alumno/.ssh/id_ed25519 ED25519</tspan></text><text x="34.0" y="216.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqjHI explicit agent</tspan></text><rect x="16.0" y="248.0" width="848.0" height="76.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1.6"/><text x="34.0" y="272.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">③ El cliente firma el reto y queda AUTENTICADO</text><text x="34.0" y="304.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Authenticated to servidor ([192.168.56.20]:22) using &quot;publickey&quot;.</tspan></text></svg>
