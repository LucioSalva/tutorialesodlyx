<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">SSH en un hosting compartido</title><desc id="d">El equipo se conecta por SSH a una cuenta de hosting compartido. Dentro, el home de la cuenta contiene public_html, que es la carpeta que sirve la web, además de otras carpetas que no son públicas.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="40.0" width="190.0" height="90.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="119.0" y="68.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">TU EQUIPO</text><text x="119.0" y="88.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">ssh · scp · rsync</text><line x1="222.0" y1="85.0" x2="318.0" y2="85.0" stroke="#19E6A4" stroke-width="2.2"/><path d="M318.0,85.0 L310.8,88.5 L310.8,81.5 Z" fill="#19E6A4"/><text x="270.0" y="72.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve">SSH</text><rect x="326.0" y="20.0" width="530.0" height="290.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="326.0" y="20.0" width="530.0" height="3" rx="1.5" fill="#19E6A4"/><text x="344.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">CUENTA DE HOSTING · usuario_cpanel</text><text x="344.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">servidor compartido con otras cuentas</text><text x="346.0" y="96.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">/home/USUARIO/</text><text x="836.0" y="96.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">tu home (lo ves solo tú)</text><text x="346.0" y="124.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">├── public_html/</text><text x="836.0" y="124.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">← lo que se sirve en la web</text><text x="346.0" y="152.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">│   ├── index.php</text><text x="346.0" y="180.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">│   └── .htaccess</text><text x="346.0" y="208.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">├── backups/</text><text x="836.0" y="208.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">no público</text><text x="346.0" y="236.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">├── logs/</text><text x="836.0" y="236.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">no público</text><text x="346.0" y="264.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">└── .ssh/authorized_keys</text><text x="836.0" y="264.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">tus llaves autorizadas</text><text x="24.0" y="170.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Datos que da el panel del proveedor: host,</text><text x="24.0" y="188.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">usuario, puerto y la huella del servidor.</text><text x="24.0" y="250.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Suele NO haber sudo ni acceso a</text><text x="24.0" y="268.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">sshd_config: administras tu cuenta, no el</text><text x="24.0" y="286.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">servidor.</text></svg>
