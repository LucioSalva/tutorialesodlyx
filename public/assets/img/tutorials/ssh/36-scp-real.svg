<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" role="img" aria-labelledby="t d"><title id="t">scp en las dos direcciones y con carpetas</title><desc id="d">Salida real de tres copias: subir informe.txt al servidor con su barra de progreso, bajar app.log del servidor al directorio actual y copiar la carpeta proyecto entera con -r, fichero a fichero; al final, ls en el servidor confirma lo copiado.</desc><rect width="880" height="612" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="596.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">echo &quot;informe del lunes&quot; &gt; informe.txt</tspan></text><rect x="14.0" y="63.0" width="852.0" height="17.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="63.0" width="3" height="17" fill="#19E6A4"/><circle cx="850.0" cy="70.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="74.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="75.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">scp informe.txt srv:/home/alumno/</tspan></text><rect x="14.0" y="80.0" width="852.0" height="17.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="80.0" width="3" height="17" fill="#19E6A4"/><text x="24.0" y="92.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">informe.txt                                                       100%   18    76.7KB/s   00:00    </tspan></text><text x="24.0" y="109.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh srv &#x27;ls -l informe.txt&#x27;</tspan></text><text x="24.0" y="126.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">-rw-r--r-- 1 alumno alumno 18 Sep 14 18:11 informe.txt</tspan></text><rect x="14.0" y="131.0" width="852.0" height="17.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="131.0" width="3" height="17" fill="#38BDF8"/><circle cx="850.0" cy="138.5" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="850.0" y="142.7" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="143.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">scp srv:/home/alumno/logs/app.log .</tspan></text><text x="24.0" y="160.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monosp