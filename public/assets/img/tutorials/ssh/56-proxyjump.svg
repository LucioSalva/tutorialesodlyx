<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d"><title id="t">ProxyJump: entrar por un bastión</title><desc id="d">Tu equipo se conecta al bastión, único equipo expuesto. Desde ahí se reenvía la conexión al servidor interno, que no es accesible directamente. La autenticación con el interno es de extremo a extremo: el bastión no ve la sesión descifrada.</desc><rect width="880" height="350" fill="#0B1017"/><rect x="24.0" y="60.0" width="190.0" height="100.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="119.0" y="88.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">TU EQUIPO</text><text x="119.0" y="108.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">192.168.56.10</text><rect x="345.0" y="60.0" width="190.0" height="100.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1.5"/><text x="440.0" y="88.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">BASTIÓN</text><text x="440.0" y="108.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">en las dos redes</text><rect x="666.0" y="60.0" width="190.0" height="100.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="761.0" y="88.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">INTERNO</text><text x="761.0" y="108.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">10.10.0.40 · sin salida</text><line x1="218.0" y1="110.0" x2="340.0" y2="110.0" stroke="#FBBF24" stroke-width="2.2"/><path d="M340.0,110.0 L332.8,113.5 L332.8,106.5 Z" fill="#FBBF24"/><text x="279.0" y="98.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">salto 1</text><line x1="540.0" y1="110.0" x2="662.0" y2="110.0" stroke="#19E6A4" stroke-width="2.2"/><path d="M662.0,110.0 L654.8,113.5 L654.8,106.5 Z" fill="#19E6A4"/><text x="601.0" y="98.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">salto 2</text><path d="M120,168 C120,210 760,210 760,168" fill="none" stroke="#19E6A4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="440.0" y="222.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" xml:space="preserve">sesión cifrada de extremo a extremo con el interno</text><text x="440.0" y="36.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">tu equipo NO llega a 10.10.0.40 directamente (red interna)</text><rect x="24.0" y="244.0" width="400.0" height="90.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="40.0" y="270.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">$ ssh -J bastion alumno@10.10.0.40</text><text x="40.0" y="296.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"># o en ~/.ssh/config:</text><text x="40.0" y="318.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Host interno  ·  ProxyJump bastion</text><rect x="446.0" y="244.0" width="410.0" height="90.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="466.0" y="268.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Es arquitectura, no truco: un único punto expuesto,</text><text x="466.0" y="286.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">auditado y endurecido, en lugar de veinte servidores</text><text x="466.0" y="304.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">con el 22 abierto.</text></svg>
