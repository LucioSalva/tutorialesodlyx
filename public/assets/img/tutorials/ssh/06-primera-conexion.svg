<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 201" width="880" height="201" role="img" aria-labelledby="t d"><title id="t">Primera conexión a un servidor</title><desc id="d">Salida real de la primera conexión SSH al servidor del laboratorio: el aviso de autenticidad, la huella ED25519, la pregunta de confirmación respondida con yes, el aviso de que se añadió a known hosts y la petición de contraseña.</desc><rect width="880" height="201" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="185.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh alumno@servidor</tspan></text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">The authenticity of host &#x27;servidor (192.168.56.20)&#x27; can&#x27;t be established.</tspan></text><rect x="14.0" y="82.0" width="852.0" height="19.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="82.0" width="3" height="19" fill="#FBBF24"/><circle cx="850.0" cy="90.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="94.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="70