<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" height="446" role="img" aria-labelledby="t d"><title id="t">Los permisos que espera OpenSSH</title><desc id="d">Tabla con el fichero, el permiso recomendado, cómo se ve en ls -l, dónde vive y qué pasa si es demasiado abierto: directorio .ssh 700, llave privada 600, pública 644, config 600, authorized_keys 600 y home no escribible por otros.</desc><rect width="880" height="446" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="44.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="48.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">FICHERO</text><text x="220.0" y="48.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">MODO</text><text x="320.0" y="48.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">ls -l</text><text x="450.0" y="48.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">DÓNDE</text><text x="560.0" y="48.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve">POR QUÉ</text><rect x="24.0" y="64.0" width="832.0" height="44.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="91.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">~/.ssh/</text><text x="220.0" y="91.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">700</text><text x="320.0" y="91.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">drwx------</text><text x="450.0" y="91.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">directorio</text><text x="560.0" y="91.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">solo tú entras</text><rect x="24.0" y="108.0" width="832.0" height="44.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="135.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">id_ed25519</text><text x="220.0" y="135.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">600</text><text x="320.0" y="135.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">-rw-------</text><text x="450.0" y="135.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">tu equipo</text><text x="560.0" y="135.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">si otros pueden leerla, ssh la IGNORA</text><rect x="24.0" y="152.0" width="832.0" height="44.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="179.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">id_ed25519.pub</text><text x="220.0" y="179.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">644</text><text x="320.0" y="179.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">-rw-r--r--</text><text x="450.0" y="179.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">tu equipo</text><text x="560.0" y="179.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">pública: leerla no es un riesgo</text><rect x="24.0" y="196.0" width="832.0" height="44.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="223.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">config</text><text x="220.0" y="223.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">600</text><text x="320.0" y="223.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">-rw-------</text><text x="450.0" y="223.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">tu equipo</text><text x="560.0" y="223.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">644 también vale; escribible por otros, no</text><rect x="24.0" y="240.0" width="832.0" height="44.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="267.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">authorized_keys</text><text x="220.0" y="267.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">600</text><text x="320.0" y="267.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">-rw-------</text><text x="450.0" y="267.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">servidor</text><text x="560.0" y="267.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">si otros pueden escribirla, pueden entrar</text><rect x="24.0" y="284.0" width="832.0" height="44.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="44.0" y="311.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">home del usuario</text><text x="220.0" y="311.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">755 o 750</text><text x="320.0" y="311.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">drwxr-xr-x</text><text x="450.0" y="311.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">servidor</text><text x="560.0" y="311.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">no debe ser escribible por el grupo u otros</text><rect x="24.0" y="344.0" width="832.0" height="88.0" rx="6" fill="#FBBF24" fill-opacity="0.08" stroke="#FBBF24" stroke-width="1"/><text x="44.0" y="370.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">Por qué es tan estricto (StrictModes yes, el valor por defecto)</text><text x="44.0" y="394.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Una llave que otro usuario puede leer ya no es secreta, y un authorized_keys que otro puede escribir es una puerta</text><text x="44.0" y="412.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">abierta. OpenSSH prefiere rechazar antes que confiar.</text></svg>
