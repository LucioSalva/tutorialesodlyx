<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="t d"><title id="t">Los estados de un servicio en systemd</title><desc id="d">Tres tarjetas: active running significa que el servicio está en marcha; inactive dead significa que está parado, sin error; failed significa que intentó arrancar o estaba en marcha y terminó con error.</desc><rect width="880" height="270" fill="#0B1017"/><rect x="24.0" y="20.0" width="264.0" height="180.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="264.0" height="3" rx="1.5" fill="#19E6A4"/><text x="42.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">active (running)</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">en marcha</text><text x="42.0" y="100.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">sshd escucha y acepta</text><text x="42.0" y="119.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">conexiones.</text><rect x="308.0" y="20.0" width="264.0" height="180.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="308.0" y="20.0" width="264.0" height="3" rx="1.5" fill="#8FA0AE"/><text x="326.0" y="50.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">inactive (dead)</text><text x="326.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">parado, sin error</text><text x="326.0" y="100.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">No se arrancó o se detuvo a</text><text x="326.0" y="119.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">propósito. Nadie puede entrar</text><text x="326.0" y="138.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">por SSH.</text><rect x="592.0" y="20.0" width="264.0" height="180.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="592.0" y="20.0" width="264.0" height="3" rx="1.5" fill="#F87171"/><text x="610.0" y="50.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">failed</text><text x="610.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">terminó con error</text><text x="610.0" y="100.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Intentó arrancar y no pudo: casi</text><text x="610.0" y="119.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">siempre sshd_config roto. Mira</text><text x="610.0" y="138.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">journalctl.</text><rect x="24.0" y="214.0" width="832.0" height="40.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="239.0" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">El nombre cambia según la distribución:  </tspan><tspan fill="#19E6A4" font-weight="700">sshd</tspan><tspan fill="#C2CCD6" font-weight="400"> (Arch, Fedora, RHEL)  ·  </tspan><tspan fill="#19E6A4" font-weight="700">ssh</tspan><tspan fill="#C2CCD6" font-weight="400"> (Debian, Ubuntu)</tspan></text></svg>
