<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 501" width="880" height="501" role="img" aria-labelledby="t d"><title id="t">Diagnosticar desde los dos lados</title><desc id="d">Dos salidas reales del mismo fallo. Arriba, el cliente con ssh -v ofrece su llave y termina en Permission denied (publickey) sin decir por qué. Abajo, en el servidor, el directorio .ssh se había vuelto escribible por el grupo y el log de sshd explica la causa: Authentication refused, bad ownership or modes; tras volver a 700 el directorio queda correcto.</desc><rect width="880" height="501" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="205.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">CLIENTE · laptop · salida real</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh -o BatchMode=yes -v bastion hostname 2&gt;&amp;1 | grep -E &#x27;Authenticating to|Offering public</tspan></text><text x="24.0" y="75.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  key|Authentications that can continue|No more authentication|Permission denied&#x27;</tspan></text><text x="24.0" y="92.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">Authenticating to 192.168.56.30:22 as &#x27;alumno&#x27;</tspan></text><text x="24.0" y="109.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">Authentications that can continue: publickey</tspan></text><rect x="14.0" y="114.0" width="852.0" height="17.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="114.0" width="3" height="17" fill="#38BDF8"/><circle cx="850.0" cy="121.5" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="850.0" y="125.7" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="126.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">Offering public key: /home/alumno/.ssh/id_ed25519 ED25519 SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqj</tspan></text><text x="24.0" y="143.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  HI explicit</tspan></text><text x="24.0" y="160.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">Authentications that can continue: publickey</tspan></text><rect x="14.0" y="165.0" width="852.0" height="17.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="165.0" width="3" height="17" fill="#FBBF24"/><circle cx="850.0" cy="172.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="176.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="177.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#8FA0AE" font-weight="400">debug1: </tspan><tspan fill="#C2CCD6" font-weight="400">No more authentication methods to try.</tspan></text><rect x="14.0" y="182.0" width="852.0" height="17.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="182.0" width="3" height="17" fill="#F87171"/><circle cx="850.0" cy="189.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="193.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="194.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">alumno@192.168.56.30: Permission denied (publickey).</tspan></text><g transform="translate(0,221)"><rect x="8.0" y="8.0" width="864.0" height="256.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">SERVIDOR · bastion · salida real</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">root@bastion:~# ls -ld /home/alumno/.ssh</tspan></text><text x="24.0" y="75.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">drwx--S--- 2 alumno alumno 4096 Sep 14 18:06 /home/alumno/.ssh</tspan></text><text x="24.0" y="92.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">root@bastion:~# chmod 775 /home/alumno/.ssh</tspan></text><text x="24.0" y="109.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">root@bastion:~# ls -ld /home/alumno/.ssh</tspan></text><rect x="14.0" y="114.0" width="852.0" height="17.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="114.0" width="3" height="17" fill="#FBBF24"/><circle cx="850.0" cy="121.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="125.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="126.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">drwxrwsr-x 2 alumno alumno 4096 Sep 14 18:06 /home/alumno/.ssh</tspan></text><text x="24.0" y="143.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">root@bastion:~# grep -E &quot;Authentication refused|Failed publickey&quot; /var/log/sshd.log | tail -n 2</tspan></text><rect x="14.0" y="148.0" width="852.0" height="17.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="148.0" width="3" height="17" fill="#F87171"/><circle cx="850.0" cy="155.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="159.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="24.0" y="160.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Authentication refused: bad ownership or modes for directory /home/alumno/.ssh</tspan></text><rect x="14.0" y="165.0" width="852.0" height="17.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="165.0" width="3" height="17" fill="#F87171"/><circle cx="850.0" cy="172.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="176.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><text x="24.0" y="177.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Failed publickey for alumno from 192.168.56.10 port 35746 ssh2: ED25519</tspan></text><text x="24.0" y="194.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqjHI</tspan></text><text x="24.0" y="211.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">root@bastion:~# chmod 700 /home/alumno/.ssh</tspan></text><text x="24.0" y="228.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" text-anchor="start" xml:s