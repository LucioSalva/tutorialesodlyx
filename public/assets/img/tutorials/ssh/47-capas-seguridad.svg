<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 506" width="880" height="506" role="img" aria-labelledby="t d"><title id="t">Seguridad SSH por capas</title><desc id="d">Ocho capas apiladas: llaves con passphrase, contraseñas desactivadas, root sin acceso directo, solo usuarios autorizados, firewall, actualizaciones, revisión de logs con Fail2Ban como complemento y MFA si la infraestructura lo soporta.</desc><rect width="880" height="506" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="42.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1"/><text x="44.0" y="47.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Llaves con passphrase</text><text x="300.0" y="47.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">el acceso habitual no depende de una contraseña adivinable</text><rect x="34.0" y="70.0" width="812.0" height="42.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1"/><text x="54.0" y="97.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Contraseñas desactivadas</text><text x="300.0" y="97.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">PasswordAuthentication no — solo cuando las llaves están probadas</text><rect x="44.0" y="120.0" width="792.0" height="42.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="64.0" y="147.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">root sin acceso directo</text><text x="300.0" y="147.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">PermitRootLogin no · se entra como usuario y se usa sudo</text><rect x="54.0" y="170.0" width="772.0" height="42.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="74.0" y="197.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Solo quien debe</text><text x="300.0" y="197.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">AllowUsers / AllowGroups · usuarios dedicados por función</text><rect x="64.0" y="220.0" width="752.0" height="42.0" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1"/><text x="84.0" y="247.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Firewall</text><text x="300.0" y="247.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">puerto 22 solo desde donde haga falta (VPN, oficina, bastión)</text><rect x="74.0" y="270.0" width="732.0" height="42.0" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1"/><text x="94.0" y="297.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Actualizaciones</text><text x="300.0" y="297.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">OpenSSH al día: los fallos se corrigen en versiones nuevas</text><rect x="84.0" y="320.0" width="712.0" height="42.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="104.0" y="347.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Logs revisados</text><text x="300.0" y="347.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">saber quién entró y qué se intentó · Fail2Ban como complemento</text><rect x="94.0" y="370.0" width="692.0" height="42.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="114.0" y="397.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">MFA</text><text x="300.0" y="397.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">si la infraestructura lo soporta: llaves FIDO (-sk) o un segundo factor</text><text x="24.0" y="458.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Ninguna capa es suficiente sola, y ninguna configuración vale para todos los servidores. Se decide con el</text><text x="24.0" y="477.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">contexto: quién entra, desde dónde y cómo se recupera el acceso.</text></svg>
