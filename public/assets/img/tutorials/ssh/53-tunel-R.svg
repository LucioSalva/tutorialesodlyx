<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-labelledby="t d"><title id="t">Remote forwarding: ssh -R</title><desc id="d">ssh -R 9000:127.0.0.1:9000 srv abre el puerto 9000 en el servidor; lo que entra ahí viaja por SSH en sentido contrario y tu equipo lo entrega en su propio 127.0.0.1:9000.</desc><rect width="880" height="396" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="46.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="40.0" y="50.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">$ ssh -R 9000:127.0.0.1:9000 srv</text><rect x="24.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1"/><text x="36.0" y="102.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">9000</text><text x="36.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">se ABRE en el servidor</text><rect x="234.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1"/><text x="246.0" y="102.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">127.0.0.1</text><text x="246.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">visto DESDE tu equipo</text><rect x="444.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="456.0" y="102.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">9000</text><text x="456.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">puerto del destino</text><rect x="654.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="666.0" y="102.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">srv</text><text x="666.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">servidor SSH</text><rect x="24.0" y="164.0" width="200.0" height="100.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="124.0" y="192.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">DEMO LOCAL</text><text x="124.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">tu 127.0.0.1:9000</text><rect x="356.0" y="164.0" width="200.0" height="100.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="456.0" y="192.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">SERVIDOR (srv)</text><text x="456.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">escucha en su :9000</text><rect x="676.0" y="164.0" width="180.0" height="100.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1.5"/><text x="766.0" y="192.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">EN EL SERVIDOR</text><text x="766.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">curl 127.0.0.1:9000</text><rect x="230.0" y="194.0" width="120.0" height="40.0" rx="20" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><text x="290.0" y="186.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">SSH</text><line x1="346.0" y1="214.0" x2="236.0" y2="214.0" stroke="#A78BFA" stroke-width="2.2"/><path d="M236.0,214.0 L243.2,210.5 L243.2,217.5 Z" fill="#A78BFA"/><line x1="670.0" y1="214.0" x2="560.0" y2="214.0" stroke="#A78BFA" stroke-width="2.2"/><path d="M560.0,214.0 L567.2,210.5 L567.2,217.5 Z" fill="#A78BFA"/><rect x="24.0" y="290.0" width="832.0" height="90.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="316.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Por defecto el puerto remoto solo escucha en el loopback del servidor (GatewayPorts no). Úsalo solo en</text><text x="44.0" y="335.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">infraestructura propia o autorizada: publica algo de tu equipo en otra máquina, y eso debe estar permitido.</text></svg>
