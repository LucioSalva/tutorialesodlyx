<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 277" width="880" height="277" role="img" aria-labelledby="t d"><title id="t">ssh-agent y ssh-add en una sesión real</title><desc id="d">Salida real: se arranca el agente, ssh-add -l indica que no tiene identidades, ssh-add pide la passphrase una vez, ssh-add -l muestra la huella cargada y la conexión posterior entra sin pedir nada.</desc><rect width="880" height="277" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="261.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">eval &quot;$(ssh-agent -s)&quot;</tspan></text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Agent pid 99</tspan></text><text x="24.0" y="96.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-add -l</tspan></text><rect x="14.0" y="101.0" width="852.0" height="19.0" rx="3" fill="#8FA0AE" fill-opacity="0.1"/><rect x="14" y="101.0" width="3" height="19" fill="#8FA0AE"/><circle cx="850.0" cy="109.5" r="10" fill="#0B1017" stroke="#8FA0AE" stroke-width="1.8"/><text x="850.0" y="113.7" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="115.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">The agent has no identities.</tspan></text><text x="24.0" y="134.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-add</tspan></text><rect x="14.0" y="139.0" width="852.0" height="19.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="139.0" width="3" height="19" fill="#FBBF24"/><circle cx="850.0" cy="147.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="151.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="153.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Enter passphrase for /home/alumno/.ssh/id_ed25519: </tspan></text><text x="24.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Identity added: /home/alumno/.ssh/id_ed25519 (alumno@laptop)</tspan></text><text x="24.0" y="191.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-add -l</tspan></text><rect x="14.0" y="196.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="196.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="204.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="208.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="210.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqjHI alumno@laptop (ED25519)</tspan></text><rect x="14.0" y="215.0" width="852.0" height="19.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="215.0" width="3" height="19" fill="#38BDF8"/><text x="24.0" y="229.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh alumno@servidor hostname</tspan></text><rect x="14.0" y="234.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="234.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="242.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="246.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="248.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">servidor</tspan></text></svg>
