<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-labelledby="t d"><title id="t">Local forwarding: ssh -L</title><desc id="d">ssh -L 8080:127.0.0.1:8000 srv abre el puerto 8080 en tu equipo; lo que entra ahí viaja por SSH y el servidor lo entrega en su propio 127.0.0.1:8000, donde escucha un panel interno.</desc><rect width="880" height="396" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="46.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="40.0" y="50.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">$ ssh -L 8080:127.0.0.1:8000 srv</text><rect x="24.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="36.0" y="102.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">8080</text><text x="36.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">se ABRE en tu equipo</text><rect x="234.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="246.0" y="102.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">127.0.0.1</text><text x="246.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">visto DESDE el servidor</text><rect x="444.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="456.0" y="102.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">8000</text><text x="456.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">puerto del destino</text><rect x="654.0" y="78.0" width="198.0" height="60.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="666.0" y="102.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">srv</text><text x="666.0" y="124.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">servidor puente</text><rect x="24.0" y="164.0" width="200.0" height="100.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="124.0" y="192.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">TU EQUIPO</text><text x="124.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">escucha en localhost:8080</text><rect x="356.0" y="164.0" width="200.0" height="100.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="456.0" y="192.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">SERVIDOR (srv)</text><text x="456.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="676.0" y="164.0" width="180.0" height="100.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1.5"/><text x="766.0" y="192.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">PANEL INTERNO</text><text x="766.0" y="212.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">su 127.0.0.1:8000</text><rect x="230.0" y="194.0" width="120.0" height="40.0" rx="20" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><text x="290.0" y="186.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">SSH</text><line x1="236.0" y1="214.0" x2="346.0" y2="214.0" stroke="#38BDF8" stroke-width="2.2"/><path d="M346.0,214.0 L338.8,217.5 L338.8,210.5 Z" fill="#38BDF8"/><line x1="560.0" y1="214.0" x2="670.0" y2="214.0" stroke="#38BDF8" stroke-width="2.2"/><path d="M670.0,214.0 L662.8,217.5 L662.8,210.5 Z" fill="#38BDF8"/><rect x="24.0" y="290.0" width="832.0" height="90.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="316.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Abres http://127.0.0.1:8080 en tu navegador y ves el panel que en el servidor solo escucha en loopback.</text><text x="44.0" y="335.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">«127.0.0.1» se interpreta en el SERVIDOR, no en tu equipo: esa es la confusión clásica.</text></svg>
