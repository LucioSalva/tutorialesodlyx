<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-labelledby="t d"><title id="t">Cliente ssh y servidor sshd</title><desc id="d">A la izquierda el equipo del usuario ejecuta el cliente ssh; a la derecha el servidor ejecuta el demonio sshd, que escucha siempre; los une una conexión cifrada.</desc><rect width="880" height="370" fill="#0B1017"/><rect x="24.0" y="20.0" width="330.0" height="230.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="330.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">TU EQUIPO · el cliente</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">lo ejecutas cuando quieres conectar</text><rect x="526.0" y="20.0" width="330.0" height="230.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="526.0" y="20.0" width="330.0" height="3" rx="1.5" fill="#19E6A4"/><text x="544.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">EL SERVIDOR · el demonio</text><text x="544.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">arranca con el sistema y espera</text><rect x="44.0" y="88.0" width="290.0" height="56.0" rx="6" fill="#070B10" stroke="#38BDF8" stroke-width="1"/><text x="64.0" y="124.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">ssh</text><text x="130.0" y="112.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">programa cliente</text><text x="130.0" y="131.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">arranca, conecta y termina</text><rect x="546.0" y="88.0" width="290.0" height="56.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="566.0" y="124.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">sshd</text><text x="650.0" y="112.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">SSH daemon</text><text x="650.0" y="131.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">escucha en el puerto 22</text><text x="44.0" y="176.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Configuración:</text><text x="44.0" y="198.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">~/.ssh/config</text><text x="44.0" y="226.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">editable por ti, sin sudo</text><text x="546.0" y="176.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Configuración:</text><text x="546.0" y="198.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">/etc/ssh/sshd_config</text><text x="546.0" y="226.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">requiere sudo · recargar el servicio</text><line x1="364.0" y1="116.0" x2="516.0" y2="116.0" stroke="#19E6A4" stroke-width="2.2"/><path d="M516.0,116.0 L508.8,119.5 L508.8,112.5 Z" fill="#19E6A4"/><text x="440.0" y="104.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" xml:space="preserve">conexión cifrada</text><text x="440.0" y="138.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">TCP · puerto 22</text><rect x="24.0" y="270.0" width="832.0" height="80.0" rx="6" fill="#FBBF24" fill-opacity="0.08" stroke="#FBBF24" stroke-width="1"/><text x="44.0" y="298.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">La confusión más cara de SSH</text><text x="44.0" y="322.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Tocar ~/.ssh/config no cambia quién puede entrar en tu máquina, y tocar /etc/ssh/sshd_config no cambia cómo</text><text x="44.0" y="341.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">sales tú. No da error: simplemente se aplica al otro lado.</text></svg>
