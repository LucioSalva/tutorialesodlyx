<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">El orden de una auditoría autorizada</title><desc id="d">Los seis pasos, de la autorización por escrito al informe, con la regla de no ampliar el alcance sobre la marcha.</desc><rect width="880" height="300" fill="#0B1017"/><rect x="30" y="40" width="122" height="120" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1" /><rect x="30" y="40" width="122" height="3" rx="2" fill="#FBBF24"/><text x="46" y="68" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >01</text><text x="46" y="92" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >AUTORIZAS</text><text x="46" y="114" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >por escrito</text><text x="46" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >y con alcance</text><line x1="156" y1="100" x2="178" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M178.0,100.0 L172.7,102.9 L172.7,97.1 Z" fill="#8FA0AE"/><rect x="170" y="40" width="122" height="120" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1" /><rect x="170" y="40" width="122" height="3" rx="2" fill="#38BDF8"/><text x="186" y="68" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >02</text><text x="186" y="92" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >DESCUBRES</text><text x="186" y="114" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >qué equipos</text><text x="186" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >hay vivos</text><line x1="296" y1="100" x2="318" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M318.0,100.0 L312.7,102.9 L312.7,97.1 Z" fill="#8FA0AE"/><rect x="310" y="40" width="122" height="120" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1" /><rect x="310" y="40" width="122" height="3" rx="2" fill="#19E6A4"/><text x="326" y="68" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >03</text><text x="326" y="92" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >ENUMERAS</text><text x="326" y="114" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >qué puertos</text><text x="326" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >abren</text><line x1="436" y1="100" x2="458" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M458.0,100.0 L452.7,102.9 L452.7,97.1 Z" fill="#8FA0AE"/><rect x="450" y="40" width="122" height="120" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1" /><rect x="450" y="40" width="122" height="3" rx="2" fill="#A78BFA"/><text x="466" y="68" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >04</text><text x="466" y="92" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >IDENTIFICAS</text><text x="466" y="114" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >qué servicio</text><text x="466" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >y versión</text><line x1="576" y1="100" x2="598" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M598.0,100.0 L592.7,102.9 L592.7,97.1 Z" fill="#8FA0AE"/><rect x="590" y="40" width="122" height="120" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1" /><rect x="590" y="40" width="122" height="3" rx="2" fill="#FBBF24"/><text x="606" y="68" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >05</text><text x="606" y="92" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >CONTRASTAS</text><text x="606" y="114" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >con lo que</text><text x="606" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >debería haber</text><line x1="716" y1="100" x2="738" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M738.0,100.0 L732.7,102.9 L732.7,97.1 Z" fill="#8FA0AE"/><rect x="730" y="40" width="122" height="120" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1" /><rect x="730" y="40" width="122" height="3" rx="2" fill="#19E6A4"/><text x="746" y="68" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve" >06</text><text x="746" y="92" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >INFORMAS</text><text x="746" y="114" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >hechos, hipótesis</text><text x="746" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >y límites</text><rect x="30" y="180" width="820" height="52" rx="5" fill="rgba(251,191,36,0.08)" stroke="#FBBF24" stroke-width="1" /><text x="46" y="204" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >La regla que no se salta</text><text x="46" y="222" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Si en el paso 3 aparece un equipo que no estaba en el alcance, no se escanea: se informa. Ampliar sobre la marcha invalida la autorización.</text><rect x="30" y="244" width="820" height="46" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="46" y="266" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Y lo que se entrega no es la salida de Nmap</text><text x="46" y="284" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Es qué se buscó, con qué comando exacto, qué se encontró, qué significa y qué queda fuera de lo que se puede afirmar.</text></svg>
