<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Usuario normal, sudo y root</title><desc id="d">El usuario normal trabaja con prompt que suele terminar en dólar. sudo concede privilegio de root para un único comando tras pedir la contraseña del propio usuario. Una shell de root suele terminar en almohadilla.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="260.0" height="220.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="260.0" height="3" rx="1.5" fill="#19E6A4"/><text x="42.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">USUARIO NORMAL</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">donde trabajas siempre</text><text x="44.0" y="110.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14.5" font-weight="700" text-anchor="start" xml:space="preserve">alumno@servidor:~$</text><text x="44.0" y="146.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Puede tocar su home. No puede</text><text x="44.0" y="164.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">tocar /etc ni el servicio sshd.</text><rect x="310.0" y="20.0" width="260.0" height="220.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="310.0" y="20.0" width="260.0" height="3" rx="1.5" fill="#FBBF24"/><text x="328.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SUDO</text><text x="328.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">privilegio para UN comando</text><text x="330.0" y="110.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14.5" font-weight="700" text-anchor="start" xml:space="preserve">$ sudo sshd -t</text><text x="330.0" y="146.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Pide TU contraseña, ejecuta ese</text><text x="330.0" y="164.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">comando como root, queda</text><text x="330.0" y="182.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">registrado y vuelves a ser</text><text x="330.0" y="200.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">alumno.</text><rect x="596.0" y="20.0" width="260.0" height="220.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="596.0" y="20.0" width="260.0" height="3" rx="1.5" fill="#F87171"/><text x="614.0" y="50.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ROOT</text><text x="614.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">sin límites, sin red de seguridad</text><text x="616.0" y="110.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14.5" font-weight="700" text-anchor="start" xml:space="preserve">root@servidor:~#</text><text x="616.0" y="146.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Puede borrar el sistema entero</text><text x="616.0" y="164.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">o dejar a todos fuera. Un error</text><text x="616.0" y="182.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">de tecleo no pide confirmación.</text><line x1="286.0" y1="110.0" x2="306.0" y2="110.0" stroke="#FBBF24" stroke-width="1.6"/><path d="M306.0,110.0 L300.6,112.6 L300.6,107.4 Z" fill="#FBBF24"/><line x1="572.0" y1="110.0" x2="592.0" y2="110.0" stroke="#F87171" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M592.0,110.0 L586.6,112.6 L586.6,107.4 Z" fill="#F87171"/><rect x="24.0" y="256.0" width="832.0" height="56.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="280.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">El $ y el # son una convención del prompt, no una garantía: se pueden personalizar. Lo fiable es whoami o id.</text></svg>
