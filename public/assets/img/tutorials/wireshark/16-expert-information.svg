<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Analyze › Expert Information</title><desc id="d">Los cuatro niveles de severidad que usa Wireshark, del error a la nota, con ejemplos de cada uno.</desc><rect width="880" height="320" fill="#0B1017"/><rect x="30" y="30" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="30" width="4" height="62" rx="2" fill="#F87171"/><circle cx="60" cy="61" r="7" fill="#F87171"/><text x="82" y="54" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >Error</text><text x="82" y="74" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Paquete malformado o disector que no puede seguir.</text><text x="836" y="68" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >Malformed Packet</text><rect x="30" y="100" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="100" width="4" height="62" rx="2" fill="#FBBF24"/><circle cx="60" cy="131" r="7" fill="#FBBF24"/><text x="82" y="124" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >Warning</text><text x="82" y="144" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Algo poco habitual que probablemente importe.</text><text x="836" y="138" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >Previous segment not captured</text><rect x="30" y="170" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="170" width="4" height="62" rx="2" fill="#38BDF8"/><circle cx="60" cy="201" r="7" fill="#38BDF8"/><text x="82" y="194" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >Note</text><text x="82" y="214" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Comportamiento normal del protocolo, pero digno de mención.</text><text x="836" y="208" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >This frame is a (suspected) retransmission</text><rect x="30" y="240" width="820" height="62" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="240" width="4" height="62" rx="2" fill="#19E6A4"/><circle cx="60" cy="271" r="7" fill="#19E6A4"/><text x="82" y="264" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >Chat</text><text x="82" y="284" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Sucesos del flujo normal de una conversación.</text><text x="836" y="278" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >Connection establish request (SYN)</text><text x="30" y="306" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Error común: leer «Warning» como «ataque». Casi siempre significa red con pérdidas, no adversario.</text></svg>
