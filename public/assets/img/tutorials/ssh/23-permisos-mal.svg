<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 429" width="880" height="429" role="img" aria-labelledby="t d"><title id="t">Una llave privada con permisos 644</title><desc id="d">Salida real: con la llave privada en modo 644, OpenSSH muestra WARNING UNPROTECTED PRIVATE KEY FILE, ignora la llave y la conexión termina en Permission denied. Tras chmod 600 y chmod 700, ls -ld muestra los permisos correctos.</desc><rect width="880" height="429" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="413.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">chmod 644 ~/.ssh/id_ed25519</tspan></text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ls -l ~/.ssh/id_ed25519</tspan></text><text x="24.0" y="96.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">-rw-r--r-- 1 alumno alumno 444 Sep 14 18:05 /home/alumno/.ssh/id_ed25519</tspan></text><text x="24.0" y="115.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh -o IdentityAgent=none -o PasswordAuthentication=no -o</tspan></text><text x="24.0" y="134.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  KbdInteractiveAuthentication=no alumno@servidor hostname</tspan></text><text x="24.0" y="153.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan></text><text x="24.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">@         WARNING: UNPROTECTED PRIVATE KEY FILE!          @</tspan></text><text x="24.0" y="191.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan></text><rect x="14.0" y="196.0" width="852.0" height="19.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="196.0" width="3" height="19" fill="#F87171"/><circle cx="850.0" cy="204.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="208.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="210.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Permissions 0644 for &#x27;/home/alumno/.ssh/id_ed25519&#x27; are too open.</tspan></text><text x="24.0" y="229.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">It is required that your private key files are NOT accessible by others.</tspan></text><rect x="14.0" y="234.0" width="852.0" height="19.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="234.0" width="3" height="19" fill="#F87171"/><circle cx="850.0" cy="242.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="246.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="248.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">This private key will be ignored.</tspan></text><text x="24.0" y="267.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Load key &quot;/home/alumno/.ssh/id_ed25519&quot;: bad permissions</tspan></text><rect x="14.0" y="272.0" width="852.0" height="19.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="272.0" width="3" height="19" fill="#FBBF24"/><circle cx="850.0" cy="280.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="284.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="286.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">alumno@servidor: Permission denied (publickey,password,keyboard-interactive).</tspan></text><text x="24.0" y="305.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">chmod 600 ~/.ssh/id_ed25519</tspan></text><text x="24.0" y="324.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">chmod 700 ~/.ssh</tspan></text><text x="24.0" y="343.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ls -ld ~/.ssh ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub</tspan></text><text x="24.0" y="362.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">drwx--S--- 2 alumno alumno 4096 Sep 14 18:06 /home/alumno/.ssh</tspan></text><rect x="14.0" y="367.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="367.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="375.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="379.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="381.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">-rw------- 1 alumno alumno  444 Sep 14 18:05 /home/alumno/.ssh/id_ed25519</tspan></text><text x="24.0" y="400.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">-rw-r--r-- 1 alumno alumno   95 Sep 14 18:05 /home/alumno/.ssh/id_ed25519.pub</tspan></text></svg>
