<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Comparar dos escaneos del mismo objetivo</title><desc id="d">Diff entre el inventario de ayer y el de hoy: una línea nueva indica un servicio que antes no estaba.</desc><rect width="880" height="340" fill="#0B1017"/><text x="30" y="32" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >AYER</text><rect x="30" y="44" width="380" height="107" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><rect x="31" y="45" width="378" height="26" rx="5" fill="#0E141C" /><circle cx="44" cy="58" r="4" fill="#3B4754"/><circle cx="57" cy="58" r="4" fill="#3B4754"/><circle cx="70" cy="58" r="4" fill="#3B4754"/><text x="90" y="62" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="start" xml:space="preserve" >inventario-09-10.nmap</text><text x="46" y="90" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >PORT     STATE SERVICE</text><text x="46" y="109" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >22/tcp   open  ssh</text><text x="46" y="128" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >5432/tcp open  postgresql</text><text x="470" y="32" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >HOY</text><rect x="470" y="44" width="380" height="126" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><rect x="471" y="45" width="378" height="26" rx="5" fill="#0E141C" /><circle cx="484" cy="58" r="4" fill="#3B4754"/><circle cx="497" cy="58" r="4" fill="#3B4754"/><circle cx="510" cy="58" r="4" fill="#3B4754"/><text x="530" y="62" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="start" xml:space="preserve" >inventario-09-11.nmap</text><text x="486" y="90" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >PORT     STATE SERVICE</text><text x="486" y="109" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >22/tcp   open  ssh</text><text x="486" y="128" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >5432/tcp open  postgresql</text><text x="486" y="147" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >8090/tcp open  http</text><text x="30" y="194" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >$ ndiff inventario-09-10.xml inventario-09-11.xml</text><rect x="30" y="206" width="820" height="60" rx="5" fill="#070B10" stroke="#22303C" stroke-width="1" /><text x="46" y="228" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >+8090/tcp open  http</text><text x="260" y="228" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >← la única línea que importa</text><text x="46" y="250" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" > 22/tcp   open  ssh        (sin cambios)</text><rect x="30" y="280" width="820" height="46" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="46" y="302" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Este es el uso más valioso de Nmap en el día a día</text><text x="46" y="320" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >No «¿qué hay?», sino «¿qué ha cambiado desde la última vez, y quién lo cambió?».</text><text x="660" y="326" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Ejemplo ilustrativo</text></svg>
