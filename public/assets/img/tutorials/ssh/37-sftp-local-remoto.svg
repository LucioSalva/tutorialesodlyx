text x="440.0" y="286.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">get fichero   (trae)</text><line x1="650.0" y1="336.0" x2="230.0" y2="336.0" stroke="#19E6A4" stroke-width="2.2"/><path d="M230.0,336.0 L237.2,332.5 L237.2,339.5 Z" fill="#19E6A4"/><text x="440.0" y="358.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">put fichero   (lleva)</text></svg>
