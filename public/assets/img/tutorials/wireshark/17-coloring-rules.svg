<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Qué significan los colores del Packet List</title><desc id="d">Las reglas de color por defecto de Wireshark y lo que indica cada una.</desc><rect width="880" height="364" fill="#0B1017"/><rect x="30" y="30" width="820" height="52" rx="5" fill="#2B0F13" stroke="#22303C" stroke-width="1" /><rect x="30" y="30" width="4" height="52" rx="2" fill="#F87171"/><text x="50" y="51" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Negro sobre rojo</text><text x="50" y="70" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Problema de TCP: retransmisión, segmento perdido, ACK duplicado.</text><text x="836" y="61" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >tcp.analysis.flags</text><rect x="30" y="88" width="820" height="52" rx="5" fill="#2B2510" stroke="#22303C" stroke-width="1" /><rect x="30" y="88" width="4" height="52" rx="2" fill="#FBBF24"/><text x="50" y="109" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Negro sobre amarillo</text><text x="50" y="128" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Conexión cortada de golpe con RST.</text><text x="836" y="119" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >tcp.flags.reset == 1</text><rect x="30" y="146" width="820" height="52" rx="5" fill="#10202B" stroke="#22303C" stroke-width="1" /><rect x="30" y="146" width="4" height="52" rx="2" fill="#38BDF8"/><text x="50" y="167" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Blanco sobre azul</text><text x="50" y="186" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Tráfico de control y de nombres.</text><text x="836" y="177" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >dns ‖ icmp</text><rect x="30" y="204" width="820" height="52" rx="5" fill="#141B23" stroke="#22303C" stroke-width="1" /><rect x="30" y="204" width="4" height="52" rx="2" fill="#8FA0AE"/><text x="50" y="225" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Gris claro</text><text x="50" y="244" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Conversación TCP corriente.</text><text x="836" y="235" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >tcp</text><rect x="30" y="262" width="820" height="52" rx="5" fill="#0F2119" stroke="#22303C" stroke-width="1" /><rect x="30" y="262" width="4" height="52" rx="2" fill="#19E6A4"/><text x="50" y="283" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Verde</text><text x="50" y="302" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Peticiones y respuestas HTTP en claro.</text><text x="836" y="293" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="end" xml:space="preserve" >http</text><text x="30" y="344" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Rojo NO significa ataque: significa que TCP tuvo que repetir algo. En un wifi saturado la pantalla se llena de rojo sin que pase nada malo.</text></svg>
