<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t d"><title id="t">¿Qué herramienta uso?</title><desc id="d">Árbol de decisión: para cada necesidad, la herramienta. Entrar en un servidor, ssh; copiar un fichero, scp; explorar, sftp; sincronizar, rsync; no teclear datos, config; autenticación segura, llaves; passphrase, agente; servicio interno, -L; bastión, ProxyJump; algo falla, ssh -v y logs.</desc><rect width="880" height="520" fill="#0B1017"/><text x="24.0" y="38.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="start" xml:space="preserve">¿QUÉ QUIERO HACER?</text><rect x="24.0" y="56.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="77.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Entrar en un servidor</text><line x1="458.0" y1="72.0" x2="500.0" y2="72.0" stroke="#19E6A4" stroke-width="1.6"/><path d="M500.0,72.0 L494.6,74.6 L494.6,69.4 Z" fill="#19E6A4"/><rect x="504.0" y="56.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="520.0" y="77.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh</text><rect x="24.0" y="96.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="117.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Ejecutar un comando y volver</text><line x1="458.0" y1="112.0" x2="500.0" y2="112.0" stroke="#19E6A4" stroke-width="1.6"/><path d="M500.0,112.0 L494.6,114.6 L494.6,109.4 Z" fill="#19E6A4"/><rect x="504.0" y="96.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="520.0" y="117.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh srv &#x27;comando&#x27;</text><rect x="24.0" y="136.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="157.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Copiar un fichero puntual</text><line x1="458.0" y1="152.0" x2="500.0" y2="152.0" stroke="#FBBF24" stroke-width="1.6"/><path d="M500.0,152.0 L494.6,154.6 L494.6,149.4 Z" fill="#FBBF24"/><rect x="504.0" y="136.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#FBBF24" stroke-width="1"/><text x="520.0" y="157.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">scp</text><rect x="24.0" y="176.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="197.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Explorar y transferir a mano</text><line x1="458.0" y1="192.0" x2="500.0" y2="192.0" stroke="#A78BFA" stroke-width="1.6"/><path d="M500.0,192.0 L494.6,194.6 L494.6,189.4 Z" fill="#A78BFA"/><rect x="504.0" y="176.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#A78BFA" stroke-width="1"/><text x="520.0" y="197.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">sftp</text><rect x="24.0" y="216.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="237.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Sincronizar un proyecto</text><line x1="458.0" y1="232.0" x2="500.0" y2="232.0" stroke="#38BDF8" stroke-width="1.6"/><path d="M500.0,232.0 L494.6,234.6 L494.6,229.4 Z" fill="#38BDF8"/><rect x="504.0" y="216.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#38BDF8" stroke-width="1"/><text x="520.0" y="237.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">rsync -av --dry-run</text><rect x="24.0" y="256.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="277.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">No teclear datos cada vez</text><line x1="458.0" y1="272.0" x2="500.0" y2="272.0" stroke="#38BDF8" stroke-width="1.6"/><path d="M500.0,272.0 L494.6,274.6 L494.6,269.4 Z" fill="#38BDF8"/><rect x="504.0" y="256.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#38BDF8" stroke-width="1"/><text x="520.0" y="277.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">~/.ssh/config</text><rect x="24.0" y="296.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="317.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Autenticarte con seguridad</text><line x1="458.0" y1="312.0" x2="500.0" y2="312.0" stroke="#19E6A4" stroke-width="1.6"/><path d="M500.0,312.0 L494.6,314.6 L494.6,309.4 Z" fill="#19E6A4"/><rect x="504.0" y="296.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="520.0" y="317.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh-keygen + ssh-copy-id</text><rect x="24.0" y="336.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="357.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">No teclear la passphrase</text><line x1="458.0" y1="352.0" x2="500.0" y2="352.0" stroke="#19E6A4" stroke-width="1.6"/><path d="M500.0,352.0 L494.6,354.6 L494.6,349.4 Z" fill="#19E6A4"/><rect x="504.0" y="336.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="520.0" y="357.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh-agent + ssh-add</text><rect x="24.0" y="376.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="397.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Llegar a un servicio interno</text><line x1="458.0" y1="392.0" x2="500.0" y2="392.0" stroke="#F472B6" stroke-width="1.6"/><path d="M500.0,392.0 L494.6,394.6 L494.6,389.4 Z" fill="#F472B6"/><rect x="504.0" y="376.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#F472B6" stroke-width="1"/><text x="520.0" y="397.0" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh -L</text><rect x="24.0" y="416.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="437.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Entrar por un bastión</text><line x1="458.0" y1="432.0" x2="500.0" y2="432.0" stroke="#F472B6" stroke-width="1.6"/><path d="M500.0,432.0 L494.6,434.6 L494.6,429.4 Z" fill="#F472B6"/><rect x="504.0" y="416.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#F472B6" stroke-width="1"/><text x="520.0" y="437.0" fill="#F472B6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh -J / ProxyJump</text><rect x="24.0" y="456.0" width="430.0" height="32.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="40.0" y="477.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">Algo falla</text><line x1="458.0" y1="472.0" x2="500.0" y2="472.0" stroke="#F87171" stroke-width="1.6"/><path d="M500.0,472.0 L494.6,474.6 L494.6,469.4 Z" fill="#F87171"/><rect x="504.0" y="456.0" width="352.0" height="32.0" rx="6" fill="#070B10" stroke="#F87171" stroke-width="1"/><text x="520.0" y="477.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">ssh -v + logs de sshd</text></svg>
