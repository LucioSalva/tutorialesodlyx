<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Antes y después de aplicar el filtro icmp</title><desc id="d">A la izquierda la lista completa con dieciséis paquetes; a la derecha, tras escribir icmp en la barra de filtro, solo quedan los dos paquetes ICMP.</desc><rect width="880" height="300" fill="#0B1017"/><text x="30" y="30" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">ANTES — sin filtro</text><rect x="30" y="40" width="380" height="26" rx="4" fill="#0E141C" stroke="#22303C" stroke-width="1" /><text x="42" y="57" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Apply a display filter …</text><rect x="30" y="76" width="380" height="155" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="31" y="77" width="378" height="20" rx="4" fill="#0E141C" /><text x="40" y="91" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" xml:space="preserve" >No.</text><text x="82" y="91" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" xml:space="preserve" >Protocol</text><text x="152" y="91" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" xml:space="preserve" >Info</text><text x="40" y="112" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >1</text><text x="82" y="112" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >ICMP</text><text x="152" y="112" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Echo (ping) request</text><text x="40" y="131" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >2</text><text x="82" y="131" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >ICMP</text><text x="152" y="131" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Echo (ping) reply</text><text x="40" y="150" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >7</text><text x="82" y="150" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >TCP</text><text x="152" y="150" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >49452 → 8090 [SYN]</text><text x="40" y="169" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >8</text><text x="82" y="169" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >TCP</text><text x="152" y="169" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" 