<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 467" width="880" height="467" role="img" aria-labelledby="t d"><title id="t">ssh-keygen -t ed25519, paso a paso</title><desc id="d">Salida real de ssh-keygen generando una llave Ed25519: pregunta dónde guardarla, pide la passphrase dos veces sin mostrarla, y guarda la privada en id_ed25519 y la pública en id_ed25519.pub; termina con la huella y el randomart.</desc><rect width="880" height="467" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="451.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh-keygen -t ed25519 -C &quot;alumno@laptop&quot;</tspan></text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Generating public/private ed25519 key pair.</tspan></text><rect x="14.0" y="82.0" width="852.0" height="19.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="82.0" width="3" height="19" fill="#38BDF8"/><circle cx="850.0" cy="90.5" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="850.0" y="94.7" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="96.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Enter file in which to save the key (/home/alumno/.ssh/id_ed25519): </tspan></text><rect x="14.0" y="101.0" width="852.0" height="19.0" rx="3" fill="#FBBF24" fill-opacity="0.1"/><rect x="14" y="101.0" width="3" height="19" fill="#FBBF24"/><circle cx="850.0" cy="109.5" r="10" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="850.0" y="113.7" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="115.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Enter passphrase for &quot;/home/alumno/.ssh/id_ed25519&quot; (empty for no passphrase): </tspan></text><text x="24.0" y="134.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Enter same passphrase again: </tspan></text><rect x="14.0" y="139.0" width="852.0" height="19.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="139.0" width="3" height="19" fill="#F87171"/><circle cx="850.0" cy="147.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="151.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="153.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Your identification has been saved in /home/alumno/.ssh/id_ed25519</tspan></text><rect x="14.0" y="158.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="158.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="166.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="170.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">Your public key has been saved in /home/alumno/.ssh/id_ed25519.pub</tspan></text><text x="24.0" y="191.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">The key fingerprint is:</tspan></text><rect x="14.0" y="196.0" width="852.0" height="19.0" rx="3" fill="#A78BFA" fill-opacity="0.1"/><rect x="14" y="196.0" width="3" height="19" fill="#A78BFA"/><circle cx="850.0" cy="204.5" r="10" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="850.0" y="208.7" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="24.0" y="210.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">SHA256:naRfLqw1lzl4RNzMfQ/a0lJ2FAIuCHwbE6H7hQnqjHI alumno@laptop</tspan></text><text x="24.0" y="229.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">The key&#x27;s randomart image is:</tspan></text><text x="24.0" y="248.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">+--[ED25519 256]--+</tspan></text><text x="24.0" y="267.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|    .. oo  ... .o|</tspan></text><text x="24.0" y="286.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|     .o+. .. +.o |</tspan></text><text x="24.0" y="305.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|     o..+...o B +|</tspan></text><text x="24.0" y="324.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|    . o.o+.o * oo|</tspan></text><text x="24.0" y="343.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|   . . oS.o * o .|</tspan></text><text x="24.0" y="362.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|  +   . .o = =   |</tspan></text><text x="24.0" y="381.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|..Eo   .  B B    |</tspan></text><text x="24.0" y="400.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|..       o = .   |</tspan></text><text x="24.0" y="419.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">|        .        |</tspan></text><text x="24.0" y="438.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">+----[SHA256]-----+</tspan></text></svg>
