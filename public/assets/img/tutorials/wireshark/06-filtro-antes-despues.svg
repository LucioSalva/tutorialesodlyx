rados — todo lo que pasó por lo</text><line x1="432" y1="150" x2="466" y2="150" stroke="#19E6A4" stroke-width="2"/><path d="M466.0,150.0 L459.0,153.8 L459.0,146.2 Z" fill="#19E6A4"/><text x="478" y="30" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">DESPUÉS — filtro icmp</text><rect x="478" y="40" width="372" height="26" rx="4" fill="rgba(25,230,164,0.08)" stroke="#19E6A4" stroke-width="1" /><text x="490" y="57" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >icmp</text><rect x="478" y="76" width="372" height="60" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="479" y="77" width="370" height="20" rx="4" fill="#0E141C" /><text x="488" y="91" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" xml:space="preserve" >No.</text><text x="530" y="91" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" xml:space="preserve" >Protocol</text><text x="600" y="91" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" text-anchor="start" xml:space="preserve" >Info</text><text x="488" y="112" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >1</text><text x="530" y="112" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >ICMP</text><text x="600" y="112" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Echo (ping) request</text><text x="488" y="131" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >2</text><text x="530" y="131" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve" >ICMP</text><text x="600" y="131" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Echo (ping) reply</text><text x="478" y="258" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >2 paquetes mostrados — los otros 14 siguen en el fichero</text><text x="478" y="276" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >El filtro de visualización esconde, no borra.</text></svg>
