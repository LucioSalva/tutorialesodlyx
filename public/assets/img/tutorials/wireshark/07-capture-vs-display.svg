<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Filtro de captura frente a filtro de visualización</title><desc id="d">El filtro de captura descarta tramas antes de guardarlas; el de visualización solo esconde las ya guardadas.</desc><rect width="880" height="390" fill="#0B1017"/><rect x="30" y="24" width="390" height="336" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="30" y="24" width="390" height="3" rx="2" fill="#FBBF24"/><text x="50" y="52" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">CAPTURE FILTER</text><text x="50" y="71" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >sintaxis BPF · se decide ANTES</text><rect x="460" y="24" width="390" height="336" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><rect x="460" y="24" width="390" height="3" rx="2" fill="#19E6A4"/><text x="480" y="52" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">DISPLAY FILTER</text><text x="480" y="71" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >sintaxis de Wireshark · se decide DESPUÉS</text><text x="50" y="104" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >red</text><rect x="50" y="114" width="16" height="16" rx="2" fill="#34465A" /><rect x="72" y="114" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="94" y="114" width="16" height="16" rx="2" fill="#34465A" /><rect x="116" y="114" width="16" height="16" rx="2" fill="#34465A" /><rect x="138" y="114" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="160" y="114" width="16" height="16" rx="2" fill="#34465A" /><line x1="122" y1="146" x2="122" y2="168" stroke="#FBBF24" stroke-width="1.6"/><path d="M122.0,168.0 L119.1,162.7 L124.9,162.7 Z" fill="#FBBF24"/><rect x="50" y="172" width="340" height="30" rx="4" fill="rgba(251,191,36,0.08)" stroke="#FBBF24" stroke-width="1" /><text x="64" y="192" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >host 1.1.1.1</text><text x="180" y="192" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >← solo esto se guarda</text><line x1="122" y1="206" x2="122" y2="228" stroke="#FBBF24" stroke-width="1.6"/><path d="M122.0,228.0 L119.1,222.7 L124.9,222.7 Z" fill="#FBBF24"/><text x="50" y="244" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >fichero .pcapng</text><rect x="50" y="254" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="72" y="254" width="16" height="16" rx="2" fill="#FBBF24" /><text x="50" y="300" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Las otras cuatro tramas</text><text x="50" y="318" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" >no existen. No hay vuelta atrás:</text><text x="50" y="336" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" >si te equivocas, recapturas.</text><text x="480" y="104" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >red</text><rect x="480" y="114" width="16" height="16" rx="2" fill="#34465A" /><rect x="502" y="114" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="524" y="114" width="16" height="16" rx="2" fill="#34465A" /><rect x="546" y="114" width="16" height="16" rx="2" fill="#34465A" /><rect x="568" y="114" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="590" y="114" width="16" height="16" rx="2" fill="#34465A" /><line x1="552" y1="146" x2="552" y2="168" stroke="#19E6A4" stroke-width="1.6"/><path d="M552.0,168.0 L549.1,162.7 L554.9,162.7 Z" fill="#19E6A4"/><text x="570" y="162" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >todo se guarda</text><text x="480" y="186" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >fichero .pcapng</text><rect x="480" y="196" width="16" height="16" rx="2" fill="#34465A" /><rect x="502" y="196" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="524" y="196" width="16" height="16" rx="2" fill="#34465A" /><rect x="546" y="196" width="16" height="16" rx="2" fill="#34465A" /><rect x="568" y="196" width="16" height="16" rx="2" fill="#FBBF24" /><rect x="590" y="196" width="16" height="16" rx="2" fill="#34465A" /><line x1="552" y1="222" x2="552" y2="244" stroke="#19E6A4" stroke-width="1.6"/><path d="M552.0,244.0 L549.1,238.7 L554.9,238.7 Z" fill="#19E6A4"/><rect x="480" y="248" width="340" height="30" rx="4" fill="rgba(25,230,164,0.08)" stroke="#19E6A4" stroke-width="1" /><text x="494" y="268" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >ip.addr == 1.1.1.1</text><text x="480" y="300" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Las otras cuatro siguen ahí.</text><text x="480" y="318" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" >Borras el filtro y vuelven a verse:</text><text x="480" y="336" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" >puedes cambiar de idea mil veces.</text><text x="440" y="380" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >Regla: captura ancho, filtra estrecho.</text></svg>
