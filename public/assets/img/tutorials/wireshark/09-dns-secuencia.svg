<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Cómo se ve una resolución DNS</title><desc id="d">El equipo pregunta por un nombre, el resolver responde con una dirección, y ambos mensajes comparten el mismo Transaction ID.</desc><rect width="880" height="360" fill="#0B1017"/><text x="180" y="40" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >TU EQUIPO</text><text x="700" y="40" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" xml:space="preserve" >RESOLVER DNS</text><text x="700" y="58" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve" >192.168.1.1:53</text><line x1="180" y1="72" x2="180" y2="250" stroke="#34465A" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="700" y1="72" x2="700" y2="250" stroke="#34465A" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="194" y1="110" x2="686" y2="110" stroke="#19E6A4" stroke-width="2"/><path d="M686.0,110.0 L679.0,113.8 L679.0,106.2 Z" fill="#19E6A4"/><rect x="300" y="80" width="280" height="24" rx="4" fill="#0B1017" /><text x="440" y="97" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve" >Standard query  A  example.com</text><text x="440" y="130" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve" >«¿qué dirección tiene example.com?»</text><line x1="686" y1="190" x2="194" y2="190" stroke="#38BDF8" stroke-width="2"/><path d="M194.0,190.0 L201.0,186.2 L201.0,193.8 Z" fill="#38BDF8"/><rect x="290" y="160" width="300" height="24" rx="4" fill="#0B1017" /><text x="440" y="177" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve" >Standard query response  A  203.0.113.34</text><text x="440" y="210" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" xml:space="preserve" >«esta». Y repite la pregunta dentro de la respuesta.</text><rect x="230" y="240" width="420" height="34" rx="5" fill="rgba(251,191,36,0.08)" stroke="#FBBF24" stroke-width="1" /><text x="440" y="262" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve" >Transaction ID  0x4f2a  — idéntico en ambos</text><path d="M 258,236 C 258,228 250,224 210,224" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M 622,236 C 622,228 640,224 686,224" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="30" y="306" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >Por qué importa el Transaction ID</text><text x="30" y="326" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >DNS viaja sobre UDP, que no tiene conexión: nada empareja pregunta y respuesta salvo ese número de dos bytes.</text><text x="30" y="346" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Filtro: dns  ·  un solo campo, dns.flags.response, separa consultas (0) de respuestas (1).</text></svg>
