<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Anatomía de la salida de Nmap</title><desc id="d">Salida real de nmap contra 127.0.0.1 con cada bloque numerado: cabecera, objetivo, estado del host, tabla de puertos y resumen final.</desc><rect width="880" height="430" fill="#0B1017"/><rect x="58" y="24" width="532" height="330" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><rect x="59" y="25" width="530" height="26" rx="5" fill="#0E141C" /><circle cx="72" cy="38" r="4" fill="#3B4754"/><circle cx="85" cy="38" r="4" fill="#3B4754"/><circle cx="98" cy="38" r="4" fill="#3B4754"/><text x="118" y="42" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="start" xml:space="preserve" >lucio@lab:~ · salida real</text><text x="74" y="70" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >$ nmap -sT --reason -p 22,80,443,5432,8090 127.0.0.1</text><text x="74" y="110" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Starting Nmap 7.991 ( https://nmap.org ) at 2026-09-11 17:32</text><text x="74" y="130" fill="#D7E2EA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Nmap scan report for localhost (127.0.0.1)</text><text x="74" y="150" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Host is up, received conn-refused (0.000018s latency).</text><text x="74" y="190" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >PORT     STATE  SERVICE      REASON</text><text x="74" y="210" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >22/tcp   closed ssh          conn-refused</text><text x="74" y="230" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >80/tcp   closed http         conn-refused</text><text x="74" y="250" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >443/tcp  closed https        conn-refused</text><text x="74" y="270" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >5432/tcp open   postgresql   syn-ack</text><text x="74" y="290" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >8090/tcp open   opsmessaging syn-ack</text><text x="74" y="330" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Nmap done: 1 IP address (1 host up) scanned in 0.02 seconds</text><circle cx="40" cy="106" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="40" y="110" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >①</text><circle cx="40" cy="126" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="40" y="130" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >②</text><circle cx="40" cy="146" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="40" y="150" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >③</text><circle cx="40" cy="186" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="40" y="190" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >④</text><circle cx="40" cy="326" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="40" y="330" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >⑤</text><rect x="70" y="178" width="508" height="122" rx="3" fill="none" stroke="#19E6A4" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="618" cy="60" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="618" y="64" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >①</text><text x="638" y="64" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Versión y hora</text><text x="638" y="82" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Deja constancia de cuándo se hizo.</text><text x="638" y="97" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >En una auditoría eso es parte de la prueba.</text><circle cx="618" cy="124" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="618" y="128" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >②</text><text x="638" y="128" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >El objetivo</text><text x="638" y="146" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Nombre resuelto y dirección.</text><text x="638" y="161" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Sin resolución de nombres, aquí solo hay una IP.</text><circle cx="618" cy="188" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="618" y="192" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >③</text><text x="638" y="192" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >¿Está vivo, y por qué lo cree?</text><text x="638" y="210" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >conn-refused también es respuesta:</text><text x="638" y="225" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >demuestra que hay alguien al otro lado.</text><circle cx="618" cy="252" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="618" y="256" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >④</text><text x="638" y="256" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >La tabla de puertos</text><text x="638" y="274" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Una línea por puerto consultado.</text><text x="638" y="289" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Es el 90 % de lo que vas a leer en tu vida.</text><circle cx="618" cy="316" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.5"/><text x="618" y="320" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle" xml:space="preserve" >⑤</text><text x="638" y="320" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >El resumen</text><text x="638" y="338" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Objetivos, cuántos vivos y cuánto tardó.</text><text x="638" y="353" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" xml:space="preserve" >Sirve para detectar escaneos truncados.</text><rect x="30" y="364" width="820" height="52" rx="5" fill="rgba(251,191,36,0.08)" stroke="#FBBF24" stroke-width="1" /><text x="46" y="386" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Dónde mirar primero: la columna STATE</text><text x="46" y="404" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >SERVICE es solo una etiqueta que Nmap saca de un fichero según el número de puerto. El 8090 dice «opsmessaging» y en realidad hay un Apache.</text></svg>
