<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Cuatro herramientas, la misma conexión</title><desc id="d">ssh, scp, sftp y rsync usan todas la misma conexión SSH, la misma autenticación y el mismo fichero config. Cambia lo que hacen: shell remoto, copia puntual, sesión interactiva de ficheros y sincronización incremental.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="120.0" width="170.0" height="90.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1.5"/><text x="109.0" y="148.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">TU EQUIPO</text><text x="109.0" y="168.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">~/.ssh/config</text><rect x="686.0" y="120.0" width="170.0" height="90.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="771.0" y="148.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">SERVIDOR</text><text x="771.0" y="168.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="250.0" y="30.0" width="380.0" height="54.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1"/><text x="270.0" y="64.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">ssh</text><text x="350.0" y="64.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">shell y comandos remotos</text><line x1="196.0" y1="165.0" x2="248.0" y2="57.0" stroke="#34465A" stroke-width="1.2"/><line x1="632.0" y1="57.0" x2="684.0" y2="165.0" stroke="#34465A" stroke-width="1.2"/><rect x="250.0" y="100.0" width="380.0" height="54.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1"/><text x="270.0" y="134.0" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">scp</text><text x="350.0" y="134.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">copiar un fichero o carpeta</text><line x1="196.0" y1="165.0" x2="248.0" y2="127.0" stroke="#34465A" stroke-width="1.2"/><line x1="632.0" y1="127.0" x2="684.0" y2="165.0" stroke="#34465A" stroke-width="1.2"/><rect x="250.0" y="170.0" width="380.0" height="54.0" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1"/><text x="270.0" y="204.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">sftp</text><text x="350.0" y="204.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">explorar y transferir a mano</text><line x1="196.0" y1="165.0" x2="248.0" y2="197.0" stroke="#34465A" stroke-width="1.2"/><line x1="632.0" y1="197.0" x2="684.0" y2="165.0" stroke="#34465A" stroke-width="1.2"/><rect x="250.0" y="240.0" width="380.0" height="54.0" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1"/><text x="270.0" y="274.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">rsync</text><text x="350.0" y="274.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">sincronizar solo lo que cambió</text><line x1="196.0" y1="165.0" x2="248.0" y2="267.0" stroke="#34465A" stroke-width="1.2"/><line x1="632.0" y1="267.0" x2="684.0" y2="165.0" stroke="#34465A" stroke-width="1.2"/><text x="440.0" y="318.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle" xml:space="preserve">Mismo usuario, misma llave, mismo known_hosts: si ssh funciona, las otras tres también pueden.</text></svg>
