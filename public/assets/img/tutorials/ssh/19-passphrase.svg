<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d"><title id="t">Qué protege la passphrase</title><desc id="d">La llave privada es la llave física y la passphrase es la caja fuerte donde se guarda. Columna izquierda: lo que la passphrase protege. Columna derecha: lo que no protege.</desc><rect width="880" height="380" fill="#0B1017"/><rect x="24.0" y="20.0" width="832.0" height="86.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="52.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">La analogía</text><text x="44.0" y="76.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">La llave privada es la llave física de la puerta. La passphrase es la caja fuerte donde la guardas: si alguien se</text><text x="44.0" y="96.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">lleva la caja, todavía tiene que abrirla.</text><rect x="24.0" y="122.0" width="400.0" height="240.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="122.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="42.0" y="152.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SÍ PROTEGE</text><circle cx="48" cy="178" r="4" fill="#19E6A4"/><text x="62.0" y="183.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Una copia robada del fichero id_ed25519</text><circle cx="48" cy="234" r="4" fill="#19E6A4"/><text x="62.0" y="239.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Un backup del portátil que acaba en otras manos</text><circle cx="48" cy="290" r="4" fill="#19E6A4"/><text x="62.0" y="295.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Un disco o USB perdido</text><rect x="456.0" y="122.0" width="400.0" height="240.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="122.0" width="400.0" height="3" rx="1.5" fill="#F87171"/><text x="474.0" y="152.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">NO PROTEGE</text><circle cx="480" cy="178" r="4" fill="#F87171"/><text x="494.0" y="183.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Una sesión ya abierta o una llave cargada en el</text><text x="494.0" y="202.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">agente</text><circle cx="480" cy="234" r="4" fill="#F87171"/><text x="494.0" y="239.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Un equipo comprometido que captura el teclado</text><circle cx="480" cy="290" r="4" fill="#F87171"/><text x="494.0" y="295.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">No es la contraseña de tu usuario en el servidor</text></svg>
