<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Multiplexing con ControlMaster</title><desc id="d">Sin multiplexing, cada comando abre una conexión TCP nueva con su negociación y autenticación. Con ControlMaster, la primera conexión deja un socket de control y las siguientes sesiones viajan por esa misma conexión.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="230.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#FBBF24"/><text x="42.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SIN MULTIPLEXING</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">cada comando: TCP + negociación + autenticación</text><rect x="44.0" y="96.0" width="110.0" height="32.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="99.0" y="117.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh #1</text><line x1="158.0" y1="112.0" x2="300.0" y2="112.0" stroke="#FBBF24" stroke-width="1.6"/><path d="M300.0,112.0 L292.8,115.5 L292.8,108.5 Z" fill="#FBBF24"/><text x="229.0" y="106.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve">conexión nueva</text><rect x="304.0" y="96.0" width="100.0" height="32.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="354.0" y="117.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="44.0" y="142.0" width="110.0" height="32.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="99.0" y="163.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh #2</text><line x1="158.0" y1="158.0" x2="300.0" y2="158.0" stroke="#FBBF24" stroke-width="1.6"/><path d="M300.0,158.0 L292.8,161.5 L292.8,154.5 Z" fill="#FBBF24"/><text x="229.0" y="152.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve">conexión nueva</text><rect x="304.0" y="142.0" width="100.0" height="32.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="354.0" y="163.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="44.0" y="188.0" width="110.0" height="32.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="99.0" y="209.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh #3</text><line x1="158.0" y1="204.0" x2="300.0" y2="204.0" stroke="#FBBF24" stroke-width="1.6"/><path d="M300.0,204.0 L292.8,207.5 L292.8,200.5 Z" fill="#FBBF24"/><text x="229.0" y="198.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve">conexión nueva</text><rect x="304.0" y="188.0" width="100.0" height="32.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="354.0" y="209.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="456.0" y="20.0" width="400.0" height="230.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="474.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">CON ControlMaster</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">una conexión, muchas sesiones</text><rect x="476.0" y="96.0" width="110.0" height="32.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="531.0" y="117.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh #1</text><line x1="588.0" y1="112.0" x2="640.0" y2="142.0" stroke="#19E6A4" stroke-width="1.4"/><rect x="476.0" y="142.0" width="110.0" height="32.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="531.0" y="163.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh #2</text><line x1="588.0" y1="158.0" x2="640.0" y2="142.0" stroke="#19E6A4" stroke-width="1.4"/><rect x="476.0" y="188.0" width="110.0" height="32.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="531.0" y="209.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">ssh #3</text><line x1="588.0" y1="204.0" x2="640.0" y2="142.0" stroke="#19E6A4" stroke-width="1.4"/><rect x="642.0" y="124.0" width="60.0" height="36.0" rx="6" fill="#19E6A4" fill-opacity="0.15" stroke="#19E6A4" stroke-width="1"/><text x="672.0" y="147.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="middle" xml:space="preserve">socket</text><line x1="704.0" y1="142.0" x2="734.0" y2="142.0" stroke="#19E6A4" stroke-width="3"/><path d="M734.0,142.0 L726.8,145.5 L726.8,138.5 Z" fill="#19E6A4"/><rect x="736.0" y="124.0" width="100.0" height="36.0" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1"/><text x="786.0" y="147.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">sshd</text><rect x="24.0" y="264.0" width="832.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="286.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Útil cuando lanzas muchos comandos seguidos al mismo host (scripts, Ansible, git). Opcional: si el socket queda en un</text><text x="44.0" y="304.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">estado raro, ssh -O exit lo cierra.</text></svg>
