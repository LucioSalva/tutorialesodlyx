<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d"><title id="t">~/.ssh/config: antes y después</title><desc id="d">Arriba, los comandos largos que hay que teclear cada vez con usuario, puerto y llave. En medio, el bloque Host del fichero config. Abajo, los mismos comandos reducidos a un nombre corto.</desc><rect width="880" height="380" fill="#0B1017"/><text x="24.0" y="36.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">ANTES · cuatro datos que recordar en cada comando</text><rect x="24.0" y="48.0" width="832.0" height="64.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><text x="40.0" y="74.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">$ ssh -p 2222 -i ~/.ssh/id_deploy deploy@servidor.ejemplo.com</text><text x="40.0" y="98.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">$ rsync -av -e &#x27;ssh -p 2222 -i ~/.ssh/id_deploy&#x27; web/ deploy@servidor.ejemplo.com:web/</text><text x="24.0" y="146.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">EL FICHERO · ~/.ssh/config</text><rect x="24.0" y="158.0" width="400.0" height="130.0" rx="6" fill="#070B10" stroke="#38BDF8" stroke-width="1"/><text x="40.0" y="184.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#38BDF8" font-weight="700">Host</tspan><tspan fill="#E3EBF1" font-weight="400"> web</tspan></text><text x="40.0" y="205.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#A78BFA" font-weight="700">    HostName</tspan><tspan fill="#E3EBF1" font-weight="400"> servidor.ejemplo.com</tspan></text><text x="40.0" y="226.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#A78BFA" font-weight="700">    User</tspan><tspan fill="#E3EBF1" font-weight="400"> deploy</tspan></text><text x="40.0" y="247.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#A78BFA" font-weight="700">    Port</tspan><tspan fill="#E3EBF1" font-weight="400"> 2222</tspan></text><text x="40.0" y="268.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#A78BFA" font-weight="700">    IdentityFile</tspan><tspan fill="#E3EBF1" font-weight="400"> ~/.ssh/id_deploy</tspan></text><line x1="432.0" y1="222.0" x2="470.0" y2="222.0" stroke="#19E6A4" stroke-width="2"/><path d="M470.0,222.0 L462.8,225.5 L462.8,218.5 Z" fill="#19E6A4"/><text x="480.0" y="146.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">DESPUÉS · un nombre</text><rect x="480.0" y="158.0" width="376.0" height="130.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="496.0" y="188.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">$ ssh web</text><text x="496.0" y="214.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">$ scp informe.txt web:</text><text x="496.0" y="240.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">$ rsync -av web/ web:web/</text><text x="496.0" y="266.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">$ sftp web</text><rect x="24.0" y="306.0" width="832.0" height="56.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="330.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">No es solo comodidad: scp, sftp, rsync y git leen el mismo fichero. Configuras el acceso una vez y todas las</text><text x="44.0" y="349.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">herramientas lo heredan, scripts incluidos.</text></svg>
