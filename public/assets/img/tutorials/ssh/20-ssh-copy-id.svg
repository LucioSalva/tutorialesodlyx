<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d"><title id="t">Qué hace ssh-copy-id</title><desc id="d">ssh-copy-id toma id_ed25519.pub del equipo local, entra en el servidor con la autenticación que ya funciona, crea ~/.ssh si falta y añade la línea a authorized_keys con permisos restrictivos.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="24.0" y="24.0" width="520.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><circle cx="50.0" cy="49.0" r="11" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="50.0" y="53.2" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="76.0" y="46.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Busca tu llave pública</text><text x="76.0" y="65.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">~/.ssh/id_ed25519.pub</text><rect x="24.0" y="86.0" width="520.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><circle cx="50.0" cy="111.0" r="11" fill="#0B1017" stroke="#A78BFA" stroke-width="1.8"/><text x="50.0" y="115.2" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="76.0" y="108.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Prueba si ya está instalada</text><text x="76.0" y="127.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">si entra con ella, no la duplica</text><rect x="24.0" y="148.0" width="520.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><circle cx="50.0" cy="173.0" r="11" fill="#0B1017" stroke="#FBBF24" stroke-width="1.8"/><text x="50.0" y="177.2" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="76.0" y="170.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Entra con lo que ya funciona</text><text x="76.0" y="189.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">normalmente, tu contraseña</text><rect x="24.0" y="210.0" width="520.0" height="50.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><circle cx="50.0" cy="235.0" r="11" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="50.0" y="239.2" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="76.0" y="232.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">Añade una línea al servidor</text><text x="76.0" y="251.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">~/.ssh/authorized_keys (sin borrar las demás)</text><rect x="568.0" y="24.0" width="288.0" height="236.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="588.0" y="54.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Equivale, más o menos, a:</text><text x="588.0" y="86.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">cat ~/.ssh/id_ed25519.pub |</text><text x="588.0" y="110.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">  ssh alumno@servidor \</text><text x="588.0" y="134.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">  &#x27;mkdir -p ~/.ssh &amp;&amp;</text><text x="588.0" y="158.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">   chmod 700 ~/.ssh &amp;&amp;</text><text x="588.0" y="182.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">   cat &gt;&gt; ~/.ssh/authorized_keys &amp;&amp;</text><text x="588.0" y="206.0" fill="#C2CCD6" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">   chmod 600 ~/.ssh/authorized_keys&#x27;</text><text x="588.0" y="238.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">&gt;&gt; añade; &gt; sustituiría todo el fichero.</text><rect x="24.0" y="276.0" width="832.0" height="40.0" rx="6" fill="#19E6A4" fill-opacity="0.08" stroke="#19E6A4" stroke-width="1"/><text x="44.0" y="301.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">Lo que nunca viaja: id_ed25519. ssh-copy-id solo lee ficheros .pub.</text></svg>
