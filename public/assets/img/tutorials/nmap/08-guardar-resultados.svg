<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Qué produce -oA</title><desc id="d">Una sola ejecución con -oA escribe tres ficheros: el normal para leer, el grepable para filtrar y el XML para procesar.</desc><rect width="880" height="330" fill="#0B1017"/><rect x="30" y="24" width="820" height="42" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1" /><text x="46" y="51" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve" >$ nmap -sV -oA inventario-2026-09-11 127.0.0.1</text><line x1="440" y1="72" x2="170" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M170.0,100.0 L174.9,96.6 L175.5,102.3 Z" fill="#8FA0AE"/><line x1="440" y1="72" x2="440" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M440.0,100.0 L437.1,94.7 L442.9,94.7 Z" fill="#8FA0AE"/><line x1="440" y1="72" x2="710" y2="100" stroke="#8FA0AE" stroke-width="1.4"/><path d="M710.0,100.0 L704.5,102.3 L705.1,96.6 Z" fill="#8FA0AE"/><rect x="30" y="106" width="262" height="128" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1" /><rect x="30" y="106" width="262" height="3" rx="2" fill="#19E6A4"/><text x="50" y="138" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >inventario-2026-09-11</text><text x="50" y="160" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="start" xml:space="preserve" >.nmap</text><text x="50" y="188" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Lo mismo que verías en pantalla.</text><text x="50" y="206" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Para leerlo tú y para pegarlo en</text><text x="50" y="222" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >un informe.</text><rect x="300" y="106" width="262" height="128" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1" /><rect x="300" y="106" width="262" height="3" rx="2" fill="#FBBF24"/><text x="320" y="138" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >inventario-2026-09-11</text><text x="320" y="160" fill="#FBBF24" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="start" xml:space="preserve" >.gnmap</text><text x="320" y="188" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Una línea por host.</text><text x="320" y="206" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Para grep, awk y comparaciones</text><text x="320" y="222" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >rápidas con diff.</text><rect x="570" y="106" width="262" height="128" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1" /><rect x="570" y="106" width="262" height="3" rx="2" fill="#38BDF8"/><text x="590" y="138" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >inventario-2026-09-11</text><text x="590" y="160" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="start" xml:space="preserve" >.xml</text><text x="590" y="188" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Estructurado y completo.</text><text x="590" y="206" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Para ndiff, para scripts y para</text><text x="590" y="222" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >importar a otras herramientas.</text><rect x="30" y="250" width="820" height="62" rx="5" fill="rgba(251,191,36,0.08)" stroke="#FBBF24" stroke-width="1" /><text x="46" y="274" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" >Un inventario de servicios es información sensible</text><text x="46" y="294" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Dice exactamente qué ofrece cada equipo de una red. Guárdalo donde guardarías una contraseña, no en el escritorio ni en un repositorio público.</text></svg>
