<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d"><title id="t">sftp: cada orden tiene su gemela local</title><desc id="d">Tabla de dos columnas: a la izquierda las órdenes que actúan en el servidor (pwd, ls, cd, mkdir) y a la derecha sus equivalentes locales con l delante (lpwd, lls, lcd, lmkdir). Abajo, get trae del servidor y put lleva al servidor.</desc><rect width="880" height="390" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="44.0" rx="6" fill="#19E6A4" fill-opacity="0.12" stroke="#19E6A4" stroke-width="1"/><text x="224.0" y="48.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">EN EL SERVIDOR</text><rect x="456.0" y="20.0" width="400.0" height="44.0" rx="6" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1"/><text x="656.0" y="48.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">EN TU EQUIPO  (l = local)</text><rect x="24.0" y="72.0" width="832.0" height="40.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="98.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">pwd</text><text x="476.0" y="98.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">lpwd</text><text x="404.0" y="98.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">¿dónde estoy?</text><text x="836.0" y="98.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-