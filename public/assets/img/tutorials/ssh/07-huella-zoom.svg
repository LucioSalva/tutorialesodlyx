<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-labelledby="t d"><title id="t">Comparar la huella por dos caminos</title><desc id="d">Zoom de dos salidas reales: arriba, la huella que mostró el cliente al conectar; abajo, la huella calculada en el propio servidor con ssh-keygen -lf. El valor SHA256 coincide carácter a carácter.</desc><rect width="880" height="312" fill="#0B1017"/><rect x="16.0" y="16.0" width="848.0" height="76.0" rx="6" fill="#070B10" stroke="#FBBF24" stroke-width="1.6"/><text x="34.0" y="40.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">① Lo que te enseña el CLIENTE al conectar</text><text x="34.0" y="72.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">ED25519 key fingerprint is SHA256:f/kLSUc2Jy9xR2JFOx4z932HIl6YXzi56MXyvqZuEYY.</tspan></text><rect x="16.0" y="104.0" width="848.0" height="104.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1.6"/><text x="34.0" y="128.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">② Lo que dice el SERVIDOR: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub</text><text x="34.0" y="160.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">256 SHA256:f/kLSUc2Jy9xR2JFOx4z932HIl6YXzi56MXyvqZuEYY root@buildkitsandbox</tspan></text><text x="34.0" y="188.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">  (ED25519)</tspan></text><rect x="16.0" y="220.0" width="848.0" height="76.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1.6"/><text x="34.0" y="244.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">③ Coinciden → es el servidor al que querías llegar</text><text x="34.0" y="276.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="17" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">SHA256:f/kLSUc2Jy9xR2JFOx4z932HIl6YXzi56MXyvqZuEYY</tspan></text></svg>
