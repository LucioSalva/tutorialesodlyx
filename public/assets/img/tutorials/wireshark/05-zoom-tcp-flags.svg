<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Zoom sobre el campo Flags de TCP</title><desc id="d">De la línea resumen del Packet List al desglose bit a bit del campo Flags en el Packet Details.</desc><rect width="880" height="350" fill="#0B1017"/><text x="30" y="32" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.08em">1 · LO QUE VES EN EL PACKET LIST</text><rect x="30" y="44" width="820" height="34" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="44" y="66" fill="#D7E2EA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve"><tspan>7  2.058763  127.0.0.1 → 127.0.0.1  TCP  74  </tspan><tspan fill="#19E6A4" font-weight="700">49452 → 8090 [SYN] </tspan><tspan>Seq=0 Win=65495</tspan></text><rect x="276" y="50" width="132" height="22" rx="3" fill="none" stroke="#19E6A4" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="440" y1="86" x2="440" y2="112" stroke="#19E6A4" stroke-width="1.6"/><path d="M440.0,112.0 L437.1,106.7 L442.9,106.7 Z" fill="#19E6A4"/><text x="452" y="105" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >despliega TCP › Flags en el Packet Details</text><text x="30" y="140" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.08em">2 · LO QUE HAY DETRÁS</text><rect x="30" y="152" width="820" height="156" rx="5" fill="#111925" stroke="#22303C" stroke-width="1" /><text x="46" y="176" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >.... 0000 0000 0010 = Flags: 0x002 (SYN)</text><text x="836" y="176" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="end" xml:space="preserve" >el valor completo del campo</text><text x="46" y="195" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >    ...0 .... .... = Urgent: Not set</text><text x="46" y="214" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >    .... 0... .... = Acknowledgment: Not set</text><text x="836" y="214" fill="#F87171" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="end" xml:space="preserve" >aún no confirma nada: por eso es el PRIMER paquete</text><text x="46" y="233" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >    .... .0.. .... = Push: Not set</text><text x="46" y="252" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >    .... ..0. .... = Reset: Not set</text><text x="46" y="271" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >    .... ...1 .... = Syn: Set</text><text x="836" y="271" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="end" xml:space="preserve" >este bit a 1 es lo que abre la conexión</text><text x="46" y="290" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >    .... .... 0... = Fin: Not set</text><text x="30" y="332" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Captura real de laboratorio · trama 7 · el desglose bit a bit lo dibuja Wireshark, no el paquete</text></svg>
