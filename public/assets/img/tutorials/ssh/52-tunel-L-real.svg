<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 239" width="880" height="239" role="img" aria-labelledby="t d"><title id="t">Un túnel -L funcionando</title><desc id="d">Salida real: desde el laptop, el panel interno del servidor no es accesible; tras abrir ssh -f -N -L 8080:127.0.0.1:8000 srv, curl a 127.0.0.1:8080 devuelve la página del panel, y ss muestra el puerto 8080 escuchando solo en loopback.</desc><rect width="880" height="239" fill="#0B1017"/><rect x="8.0" y="8.0" width="864.0" height="223.0" rx="6" fill="#070B10" stroke="#22303C" stroke-width="1"/><path d="M9,36 h862" stroke="#22303C"/><circle cx="24" cy="22" r="4.5" fill="#F87171" fill-opacity="0.55"/><circle cx="39" cy="22" r="4.5" fill="#FBBF24" fill-opacity="0.55"/><circle cx="54" cy="22" r="4.5" fill="#34D399" fill-opacity="0.55"/><text x="74.0" y="26.5" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="start" xml:space="preserve">salida real · laboratorio</text><text x="24.0" y="58.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">curl -sS -m 3 http://servidor:8000/</tspan></text><rect x="14.0" y="63.0" width="852.0" height="19.0" rx="3" fill="#F87171" fill-opacity="0.1"/><rect x="14" y="63.0" width="3" height="19" fill="#F87171"/><circle cx="850.0" cy="71.5" r="10" fill="#0B1017" stroke="#F87171" stroke-width="1.8"/><text x="850.0" y="75.7" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="24.0" y="77.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">curl: (7) Failed to connect to servidor port 8000 after 2 ms: Could not connect to server</tspan></text><rect x="14.0" y="82.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="82.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="90.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="94.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="24.0" y="96.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ssh -f -N -L 8080:127.0.0.1:8000 srv</tspan></text><text x="24.0" y="115.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">curl -sS http://127.0.0.1:8080/</tspan></text><rect x="14.0" y="120.0" width="852.0" height="19.0" rx="3" fill="#19E6A4" fill-opacity="0.1"/><rect x="14" y="120.0" width="3" height="19" fill="#19E6A4"/><circle cx="850.0" cy="128.5" r="10" fill="#0B1017" stroke="#19E6A4" stroke-width="1.8"/><text x="850.0" y="132.7" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="24.0" y="134.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">&lt;h1&gt;Panel interno (solo 127.0.0.1)&lt;/h1&gt;</tspan></text><text x="24.0" y="153.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">ss -tln | grep 8080</tspan></text><rect x="14.0" y="158.0" width="852.0" height="19.0" rx="3" fill="#38BDF8" fill-opacity="0.1"/><rect x="14" y="158.0" width="3" height="19" fill="#38BDF8"/><circle cx="850.0" cy="166.5" r="10" fill="#0B1017" stroke="#38BDF8" stroke-width="1.8"/><text x="850.0" y="170.7" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="24.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">LISTEN 0      128        127.0.0.1:8080       0.0.0.0:*   </tspan></text><text x="24.0" y="191.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#C2CCD6" font-weight="400">LISTEN 0      128            [::1]:8080          [::]:*   </tspan></text><text x="24.0" y="210.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">alumno@laptop:~$ </tspan><tspan fill="#E3EBF1" font-weight="700">pkill -f &#x27;ssh -f -N -L&#x27;</tspan></text></svg>
