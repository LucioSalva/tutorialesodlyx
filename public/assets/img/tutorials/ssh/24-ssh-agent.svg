<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d"><title id="t">Sin agente y con agente</title><desc id="d">Sin ssh-agent, cada conexión pide la passphrase. Con ssh-agent, se escribe una vez con ssh-add; el agente guarda la llave descifrada en memoria y firma por los clientes ssh, scp, rsync y git.</desc><rect width="880" height="380" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="250.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#FBBF24"/><text x="42.0" y="50.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SIN AGENTE</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">cada conexión descifra la llave</text><text x="44.0" y="100.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ ssh srv</tspan></text><text x="404.0" y="100.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="end" xml:space="preserve">passphrase</text><text x="44.0" y="136.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ scp informe.txt srv:</tspan></text><text x="404.0" y="136.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="end" xml:space="preserve">passphrase</text><text x="44.0" y="172.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ rsync -av web/ srv:</tspan></text><text x="404.0" y="172.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="end" xml:space="preserve">passphrase</text><text x="44.0" y="208.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ git push</tspan></text><text x="404.0" y="208.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="end" xml:space="preserve">passphrase</text><text x="44.0" y="250.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Acabas quitándole la passphrase a la llave: justo lo</text><text x="44.0" y="268.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">contrario de lo que querías.</text><rect x="456.0" y="20.0" width="400.0" height="250.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="474.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">CON AGENTE</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">descifras una vez por sesión</text><text x="476.0" y="100.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#19E6A4" font-weight="700">$ ssh-add</tspan></text><text x="836.0" y="100.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" text-anchor="end" xml:space="preserve">passphrase (1 vez)</text><rect x="476.0" y="116.0" width="360.0" height="42.0" rx="6" fill="#19E6A4" fill-opacity="0.1" stroke="#19E6A4" stroke-width="1"/><text x="492.0" y="142.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">ssh-agent · llave descifrada en memoria</text><text x="476.0" y="186.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ ssh srv</tspan></text><text x="836.0" y="186.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">firma el agente</text><text x="476.0" y="214.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ rsync -av web/ srv:</tspan></text><text x="836.0" y="214.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">firma el agente</text><text x="476.0" y="242.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="400">$ git push</tspan></text><text x="836.0" y="242.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="end" xml:space="preserve">firma el agente</text><rect x="24.0" y="286.0" width="832.0" height="76.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="312.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Qué es exactamente</text><text x="44.0" y="334.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Un proceso que guarda la llave descifrada en memoria y responde a las peticiones de firma. La llave del disco sigue</text><text x="44.0" y="352.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">cifrada. La privada nunca sale del agente.</text></svg>
