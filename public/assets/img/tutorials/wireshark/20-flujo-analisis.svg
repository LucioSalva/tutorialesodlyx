<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">De la observación a la conclusión</title><desc id="d">Cadena de análisis: observación, evidencia, hipótesis, contraste y conclusión, con las limitaciones siempre a la vista.</desc><rect width="880" height="300" fill="#0B1017"/><rect x="30" y="40" width="186" height="100" rx="6" fill="#111925" stroke="#38BDF8" stroke-width="1" /><rect x="30" y="40" width="186" height="3" rx="2" fill="#38BDF8"/><text x="48" y="70" fill="#38BDF8" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">OBSERVAS</text><text x="48" y="94" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >algo llama la atención</text><text x="48" y="112" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >en la captura</text><line x1="222" y1="90" x2="246" y2="90" stroke="#8FA0AE" stroke-width="1.6"/><path d="M246.0,90.0 L239.9,93.4 L239.9,86.6 Z" fill="#8FA0AE"/><rect x="252" y="40" width="186" height="100" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1" /><rect x="252" y="40" width="186" height="3" rx="2" fill="#19E6A4"/><text x="270" y="70" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">AÍSLAS</text><text x="270" y="94" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >un filtro deja solo</text><text x="270" y="112" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >lo que importa</text><line x1="444" y1="90" x2="468" y2="90" stroke="#8FA0AE" stroke-width="1.6"/><path d="M468.0,90.0 L461.9,93.4 L461.9,86.6 Z" fill="#8FA0AE"/><rect x="474" y="40" width="186" height="100" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1" /><rect x="474" y="40" width="186" height="3" rx="2" fill="#FBBF24"/><text x="492" y="70" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">CONTRASTAS</text><text x="492" y="94" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >¿la línea base dice</text><text x="492" y="112" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >que esto es normal?</text><line x1="666" y1="90" x2="690" y2="90" stroke="#8FA0AE" stroke-width="1.6"/><path d="M690.0,90.0 L683.9,93.4 L683.9,86.6 Z" fill="#8FA0AE"/><rect x="696" y="40" width="186" height="100" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1" /><rect x="696" y="40" width="186" height="3" rx="2" fill="#19E6A4"/><text x="714" y="70" fill="#19E6A4" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start" xml:space="preserve" letter-spacing="0.06em">CONCLUYES</text><text x="714" y="94" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >con el alcance y las</text><text x="714" y="112" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >limitaciones escritas</text><rect x="30" y="168" width="820" height="110" rx="6" fill="#0E141C" stroke="#22303C" stroke-width="1" /><text x="46" y="194" fill="#D7E2EA" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve" >Lo que nunca se salta</text><circle cx="54" cy="214" r="3" fill="#FBBF24"/><text x="68" y="218" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Punto de observación</text><text x="230" y="218" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >solo ves lo que pasa por donde capturaste</text><circle cx="54" cy="236" r="3" fill="#FBBF24"/><text x="68" y="240" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Ventana temporal</text><text x="230" y="240" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >dos minutos no dicen nada de un patrón horario</text><circle cx="54" cy="258" r="3" fill="#FBBF24"/><text x="68" y="262" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Cifrado</text><text x="230" y="262" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >sabes con quién y cuánto, casi nunca qué</text><circle cx="54" cy="280" r="3" fill="#FBBF24"/><text x="68" y="284" fill="#FBBF24" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" xml:space="preserve" >Pérdida</text><text x="230" y="284" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >si dumpcap descartó tramas, la captura está incompleta</text></svg>
