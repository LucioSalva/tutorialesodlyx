<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d" font-kerning="none"><title id="t">Follow TCP Stream</title><desc id="d">La ventana de Follow Stream reconstruye la conversación completa: en un color lo que envió el cliente y en otro lo que respondió el servidor.</desc><rect width="880" height="360" fill="#0B1017"/><rect x="30" y="20" width="820" height="300" rx="6" fill="#111925" stroke="#22303C" stroke-width="1" /><path d="M30,46 h820" stroke="#22303C" stroke-width="1"/><circle cx="44" cy="33" r="4" fill="#3B4754"/><circle cx="57" cy="33" r="4" fill="#3B4754"/><circle cx="70" cy="33" r="4" fill="#3B4754"/><text x="88" y="37" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="600" text-anchor="start" xml:space="preserve" >Follow TCP Stream (tcp.stream eq 0)</text><text x="48" y="64" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >GET / HTTP/1.1</text><text x="48" y="83" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Host: 127.0.0.1:8090</text><text x="48" y="102" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >User-Agent: curl/8.22.0</text><text x="48" y="121" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Accept: */*</text><text x="48" y="159" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >HTTP/1.1 200 OK</text><text x="48" y="178" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Date: Thu, 11 Sep 2026 23:31:39 GMT</text><text x="48" y="197" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Server: Apache/2.4.68 (Debian)</text><text x="48" y="216" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Content-Type: text/html</text><text x="48" y="235" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >Content-Length: 1842</text><text x="48" y="273" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >&lt;!DOCTYPE html&gt;</text><text x="48" y="292" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve" >&lt;html&gt;&lt;head&gt;&lt;title&gt;Laboratorio&lt;/title&gt;&lt;/head&gt;</text><rect x="600" y="240" width="236" height="66" rx="5" fill="#0E141C" stroke="#22303C" stroke-width="1" /><rect x="616" y="256" width="12" height="12" rx="2" fill="#19E6A4" /><text x="636" y="266" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >cliente → servidor</text><rect x="616" y="280" width="12" height="12" rx="2" fill="#38BDF8" /><text x="636" y="290" fill="#C2CCD6" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >servidor → cliente</text><text x="30" y="340" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Captura real de laboratorio · clic derecho sobre cualquier paquete › Follow › TCP Stream</text><text x="30" y="356" fill="#8FA0AE" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve" >Sobre HTTPS esta misma ventana muestra ruido: el contenido va cifrado.</text></svg>
