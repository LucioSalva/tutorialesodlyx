<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d"><title id="t">Telnet frente a SSH</title><desc id="d">Con Telnet el usuario, la contraseña y los comandos viajan legibles; con SSH el mismo diálogo viaja cifrado y además se comprueba la identidad del servidor.</desc><rect width="880" height="400" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="330.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#F87171"/><text x="42.0" y="50.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ANTES · TELNET</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">puerto 23 · texto en claro</text><rect x="456.0" y="20.0" width="400.0" height="330.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#19E6A4"/><text x="474.0" y="50.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">HOY · SSH</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">puerto 22 · cifrado y autenticado</text><text x="44.0" y="96.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Lo que ve alguien en medio del camino:</text><rect x="44.0" y="108.0" width="360.0" height="84.0" rx="6" fill="#070B10" stroke="#F87171" stroke-width="1"/><text x="60.0" y="134.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">login: alumno</text><text x="60.0" y="156.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">password: MiClave123</text><text x="60.0" y="178.0" fill="#F87171" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">$ cat /etc/passwd</text><text x="44.0" y="222.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Cualquiera con acceso a la red —el wifi, un router,</text><text x="44.0" y="241.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">el proveedor— lo lee tal cual, sin romper nada.</text><text x="44.0" y="290.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">Y nadie comprueba con quién hablas.</text><text x="44.0" y="312.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Podrías estar escribiendo la contraseña en la</text><text x="44.0" y="331.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">máquina equivocada.</text><text x="476.0" y="96.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Lo que ve alguien en medio del camino:</text><rect x="476.0" y="108.0" width="360.0" height="84.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="492.0" y="134.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">a3 f1 9c 44 0e bb 71 2d 8a 5f c0</text><text x="492.0" y="156.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">7e 22 b8 d3 46 91 fa 05 6c e7 30</text><text x="492.0" y="178.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="400" text-anchor="start" xml:space="preserve">11 9d 4a 68 c2 5b ff 83 27 e0 74</text><text x="476.0" y="222.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">SSH aporta tres garantías distintas:</text><circle cx="484" cy="250" r="4" fill="#19E6A4"/><text x="496.0" y="255.0" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="700">Confidencialidad</tspan><tspan fill="#C2CCD6" font-weight="400">  nadie lee el contenido</tspan></text><circle cx="484" cy="280" r="4" fill="#19E6A4"/><text x="496.0" y="285.0" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="700">Integridad</tspan><tspan fill="#C2CCD6" font-weight="400">  nadie lo cambia sin que se note</tspan></text><circle cx="484" cy="310" r="4" fill="#19E6A4"/><text x="496.0" y="315.0" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#E3EBF1" font-weight="700">Autenticación</tspan><tspan fill="#C2CCD6" font-weight="400">  compruebas con quién hablas</tspan></text><text x="440.0" y="382.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">Telnet no está «mal configurado»: se diseñó para una red en la que se confiaba.</text></svg>
