<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d"><title id="t">Cómo decide ssh qué opciones aplicar</title><desc id="d">El fichero config se lee de arriba abajo. Para cada opción gana el PRIMER valor encontrado entre los bloques Host que coinciden. Por eso los bloques concretos van arriba y Host asterisco al final.</desc><rect width="880" height="400" fill="#0B1017"/><text x="24.0" y="36.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ssh app.empresa.lab  →  ¿qué User y qué Port usa?</text><rect x="24.0" y="56.0" width="470.0" height="56.0" rx="6" fill="#070B10" stroke="#19E6A4" stroke-width="1"/><text x="40.0" y="80.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Host app.empresa.lab</text><text x="478.0" y="80.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="end" xml:space="preserve">coincide</text><text x="56.0" y="104.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">    User deploy</text><text x="478.0" y="104.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">✔ se aplica</text><rect x="24.0" y="126.0" width="470.0" height="78.0" rx="6" fill="#070B10" stroke="#38BDF8" stroke-width="1"/><text x="40.0" y="150.0" fill="#38BDF8" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Host *.empresa.lab</text><text x="478.0" y="150.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="end" xml:space="preserve">coincide</text><text x="56.0" y="174.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">    User admin</text><text x="478.0" y="174.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">ignorado: ya tenía valor</text><text x="56.0" y="196.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">    Port 2222</text><text x="478.0" y="196.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">✔ se aplica</text><rect x="24.0" y="218.0" width="470.0" height="78.0" rx="6" fill="#070B10" stroke="#A78BFA" stroke-width="1"/><text x="40.0" y="242.0" fill="#A78BFA" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">Host *</text><text x="478.0" y="242.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" text-anchor="end" xml:space="preserve">coincide</text><text x="56.0" y="266.0" fill="#8FA0AE" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">    User alumno</text><text x="478.0" y="266.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">ignorado: ya tenía valor</text><text x="56.0" y="288.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">    ServerAliveInterval 60</text><text x="478.0" y="288.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="end" xml:space="preserve">✔ se aplica</text><rect x="516.0" y="56.0" width="340.0" height="190.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="516.0" y="56.0" width="340.0" height="3" rx="1.5" fill="#19E6A4"/><text x="534.0" y="86.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">RESULTADO</text><text x="534.0" y="106.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">ssh -G app.empresa.lab lo confirma</text><text x="536.0" y="138.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">user deploy</text><text x="536.0" y="168.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">port 2222</text><text x="536.0" y="198.0" fill="#19E6A4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">serveraliveinterval 60</text><rect x="24.0" y="314.0" width="832.0" height="70.0" rx="6" fill="#FBBF24" fill-opacity="0.08" stroke="#FBBF24" stroke-width="1"/><text x="44.0" y="340.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">La regla: el primer valor gana</text><text x="44.0" y="364.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Lo concreto arriba y Host * al final. Un Host * al principio fijaría User antes de que los bloques específicos</text><text x="44.0" y="383.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">pudieran hacerlo.</text></svg>
