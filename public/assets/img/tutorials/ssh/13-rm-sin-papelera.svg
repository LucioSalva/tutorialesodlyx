<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d"><title id="t">rm no tiene papelera</title><desc id="d">Comparación: en un escritorio gráfico, borrar mueve el fichero a la papelera y se puede recuperar; en una sesión SSH, rm lo elimina de inmediato y no hay papelera.</desc><rect width="880" height="300" fill="#0B1017"/><rect x="24.0" y="20.0" width="400.0" height="200.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="24.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#38BDF8"/><text x="42.0" y="50.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">ESCRITORIO GRÁFICO</text><text x="42.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Supr en el explorador de archivos</text><text x="48.0" y="100.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve">index.php</text><text x="48.0" y="134.0" fill="#38BDF8" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve">→  Papelera</text><text x="48.0" y="168.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve">→  «Restaurar» lo devuelve</text><rect x="456.0" y="20.0" width="400.0" height="200.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><rect x="456.0" y="20.0" width="400.0" height="3" rx="1.5" fill="#F87171"/><text x="474.0" y="50.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">SESIÓN SSH</text><text x="474.0" y="70.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">rm en una terminal</text><text x="480.0" y="100.0" fill="#E3EBF1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve">$ rm index.php</text><text x="480.0" y="134.0" fill="#F87171" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve">→  eliminado. No hay papelera.</text><text x="480.0" y="168.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve">→  solo un backup lo devuelve</text><rect x="24.0" y="236.0" width="832.0" height="50.0" rx="6" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-width="1"/><text x="44.0" y="258.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Antes de pulsar Enter en un rm: pwd para saber dónde estás, ls de lo que vas a borrar, y nunca rm -r sobre una</text><text x="44.0" y="277.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">ruta con variables que no has comprobado.</text></svg>
