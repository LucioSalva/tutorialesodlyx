<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d"><title id="t">Git sobre SSH</title><desc id="d">Git decide qué datos enviar; SSH transporta y autentica. git push llama a ssh, ssh se autentica con tu llave contra el servidor Git y por ese canal Git intercambia los objetos.</desc><rect width="880" height="300" fill="#0B1017"/><rect x="24.0" y="40.0" width="180.0" height="100.0" rx="6" fill="#111925" stroke="#A78BFA" stroke-width="1.5"/><text x="114.0" y="68.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">git push</text><text x="114.0" y="88.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">Git: QUÉ enviar</text><rect x="350.0" y="40.0" width="180.0" height="100.0" rx="6" fill="#111925" stroke="#19E6A4" stroke-width="1.5"/><text x="440.0" y="68.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">ssh</text><text x="440.0" y="88.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">transporte y llave</text><rect x="676.0" y="40.0" width="180.0" height="100.0" rx="6" fill="#111925" stroke="#FBBF24" stroke-width="1.5"/><text x="766.0" y="68.0" fill="#FBBF24" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" xml:space="preserve">SERVIDOR GIT</text><text x="766.0" y="88.0" fill="#8FA0AE" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">repos/proyecto.git</text><line x1="208.0" y1="90.0" x2="346.0" y2="90.0" stroke="#A78BFA" stroke-width="2"/><path d="M346.0,90.0 L338.8,93.5 L338.8,86.5 Z" fill="#A78BFA"/><text x="277.0" y="80.0" fill="#A78BFA" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">invoca</text><line x1="534.0" y1="90.0" x2="672.0" y2="90.0" stroke="#19E6A4" stroke-width="2"/><path d="M672.0,90.0 L664.8,93.5 L664.8,86.5 Z" fill="#19E6A4"/><text x="603.0" y="80.0" fill="#19E6A4" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">autentica</text><rect x="24.0" y="164.0" width="832.0" height="118.0" rx="6" fill="#111925" stroke="#22303C" stroke-width="1"/><text x="44.0" y="192.0" fill="#E3EBF1" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" xml:space="preserve">Una URL SSH de Git se lee igual que scp:</text><text x="44.0" y="222.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="15" text-anchor="start" xml:space="preserve"><tspan fill="#A78BFA" font-weight="700">alumno</tspan><tspan fill="#8FA0AE" font-weight="400">@</tspan><tspan fill="#38BDF8" font-weight="700">servidor</tspan><tspan fill="#8FA0AE" font-weight="700">:</tspan><tspan fill="#FBBF24" font-weight="700">repos/proyecto.git</tspan></text><text x="44.0" y="252.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">En un proveedor (GitHub, GitLab, Gitea…) el usuario suele ser «git» para todos: te identifica la LLAVE, no el nombre de</text><text x="44.0" y="270.0" fill="#C2CCD6" font-family="Inter,'DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">usuario.</text></svg>
